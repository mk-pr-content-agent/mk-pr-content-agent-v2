형별 맞춤형 파크골프채로 시장 공략 본격화\",\"publisher\":\"edaily.co.kr\",\"url\":\"https://www.edaily.co.kr/news/read?newsid=03027446645614888&mediaCodeNo=257\",\"publishedAt\":\"2026-10-20\"}],\"differentiationAdvice\":\"기존 게재 기사(11건)와 네이버 검색 시 겹치지 않도록 제목 어순과 핵심 키워드 배치를 차별화합니다.\",\"sources\":[{\"url\":\"https://isplus.com/article/view/isp202610190209\",\"title\":\"낫소, 이동형 스크린 파크골프 부스 선봬…공공·복지시설 ...\",\"publisher\":\"isplus.com\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"-언리얼 엔진 5.1 기반 4K UHD 그래픽·하이스피드 카메라 센서 적용\\n-무용접 조인트 방식으로 설치·철거 편의성 강화…공공시설·순회형 행사 활용 겨냥\\n스크린파크골프 부스 (기사의 이해를 돕기 위한 생성형 이미지)\\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설 등을 대상으로 사업 확대에 나섰다.\\n낫소는 기존 실내 공간을 활용해 지역 주민과 시니어 등이 파크골프를 체험할 수 있도록 이동형 스크린 파크골프 부스를 개발했다고 밝혔다.\\n이번 부스에는 언리얼 엔진 5.1(Unreal Engine 5.1) 기반의 4K UHD 그래픽을 적용했다.\\n가상 필드와 코스 풍경을 고화질로 구현해 실내에서도 파크골프를 체험할 수 있도록 구성했다.\\n...\\n볼 움직임을 감지하는 ‘2 비전 하이스피드 카메라 센서’도 적용했다.\\n회사 측에 따르면 타격 순간 공의 움직임을 감지한 뒤 센서 데이터를 분석해 스크린 속 가상 필드에 반영하는 방식이다.\\n고성능 시스템을 함께 적용해 센서 데이터와 그래픽을 처리하고 실제 타격 결과가 화면 속 플레이로 이어지도록 구성했다.\\n설치 구조에는 이동성과 재설치를 고려한 무용접 조인트(Joint) 결합 방식을 적용했다.\\n부스 기본 골격을 용접하지 않고 부재끼리 연결하거나 분해할 수 있도록 설계해 설치와 철거 과정을 간소화했다.\\n...\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 고화질 그래픽과 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 적용한 것이 특징”이라며 “공공·복지시설의 상시 생활체육 프로그램은 물론 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획”이라고 밝혔다.\"},{\"url\":\"https://www.mk.co.kr/news/all/12181548\",\"title\":\"낫소, 생활체육 접근성 높인다… 이동형 스크린 파크골프 부스 출사표 - 매일경제\",\"publisher\":\"mk.co.kr\",\"publishedAt\":\"2026-10-21\",\"snippet\":\"## 낫소, 생활체육 접근성 높인다… 이동형 스크린 파크골프 부스 출사표\\n### 최은화 기자\\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보인다.\\n[제공=낫소]\\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다.\\n기존 실내 공간을 활용해 지역 주민과 시니어에게 새로운 생활체육 환경을 제공할 수 있도록 기획한 제품이다.\\n이번 부스는 언리얼 엔진 5.1(Unreal Engine 5.1) 기반의 4K UHD 고화질 그래픽을 적용해 선명하고 생동감 있는 가상 필드를 구현하도록 설계됐다.\\n...\\n특히 2 비전 하이스피드 카메라 센서를 적용해 타격 순간 볼의 움직임을 빠르고 정밀하게 감지하고, 이를 스크린 속 가상 필드에 반영하도록 설계했다.\\n여기에 고성능 시스템을 결합해 센서 데이터와 고화질 그래픽을 신속하게 처리함으로써 자연스럽고 몰입감 있는 플레이 환경을 제공한다.\\n...\\n부스의 기본 골격은 용접 없이 부재를 연결하고 분해할 수 있는 무용접 조인트(Joint) 결합 방식으로 설계해 설치와 철거 과정을 간소화하고 이동 및 재설치 편의성을 높였다.\"},{\"url\":\"https://www.hankookilbo.com/news/article/A2026102215390005277\",\"title\":\"낫소, 고화질 그래픽 갖춘 이동형 스크린 파크골프 부스로 공공\",\"publisher\":\"hankookilbo.com\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"# 낫소, 고화질 그래픽 갖춘 이동형 스크린 파크골프 부스로 공공·복지시설 시장 공략\\n스포츠용품 전문기업 낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다.\\n...\\n부스에는 언리얼 엔진 5.1(Unreal Engine 5.1) 기반의 4K UHD 그래픽을 적용해 실제 파크골프장을 연상시키는 가상 필드 환경을 구현했다.\\n...\\n또한 2비전 하이스피드 카메라 센서를 적용해 타격 순간 공의 움직임을 감지하고, 이를 스크린 속 가상 필드에 실시간으로 반영하도록 설계했다.\\n고성능 시스템을 통해 센서 데이터와 그래픽을 처리해 자연스러운 플레이 환경을 제공한다는 것이 회사 측 설명이다.\\n...\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 고화질 그래픽과 정밀한 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 갖춘 것이 특징”이라며 “공공·복지시설의 상시 생활체육 프로그램은 물론 다양한 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획”이라고 밝혔다.\"},{\"url\":\"https://www.hankookilbo.com/news/article/A2026102215390005277?did=NA\",\"title\":\"낫소, 고화질 그래픽 갖춘 이동형 스크린 파크골프 부스로 공공·복지시설 시장 공략-스포츠ㅣ한국일보\",\"publisher\":\"hankookilbo.com\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"스포츠용품 전문기업 낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다.\\n...\\n부스에는 언리얼 엔진 5.1(Unreal Engine 5.1) 기반의 4K UHD 그래픽을 적용해 실제 파크골프장을 연상시키는 가상 필드 환경을 구현했다.\\n...\\n또한 2비전 하이스피드 카메라 센서를 적용해 타격 순간 공의 움직임을 감지하고, 이를 스크린 속 가상 필드에 실시간으로 반영하도록 설계했다.\\n고성능 시스템을 통해 센서 데이터와 그래픽을 처리해 자연스러운 플레이 환경을 제공한다는 것이 회사 측 설명이다.\\n...\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 고화질 그래픽과 정밀한 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 갖춘 것이 특징”이라며 “공공·복지시설의 상시 생활체육 프로그램은 물론 다양한 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획”이라고 밝혔다.\"},{\"url\":\"https://www.mk.co.kr/news/business/12181548\",\"title\":\"낫소, 생활체육 접근성 높인다… 이동형 스크린 파크골프 ...\",\"publisher\":\"mk.co.kr\",\"publishedAt\":\"2026-10-21\",\"snippet\":\"스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보인다.\\n[제공=낫소]\\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다.\\n기존 실내 공간을 활용해 지역 주민과 시니어에게 새로운 생활체육 환경을 제공할 수 있도록 기획한 제품이다.\\n이번 부스는 언리얼 엔진 5.1(Unreal Engine 5.1) 기반의 4K UHD 고화질 그래픽을 적용해 선명하고 생동감 있는 가상 필드를 구현하도록 설계됐다.\\n...\\n특히 2 비전 하이스피드 카메라 센서를 적용해 타격 순간 볼의 움직임을 빠르고 정밀하게 감지하고, 이를 스크린 속 가상 필드에 반영하도록 설계했다.\\n여기에 고성능 시스템을 결합해 센서 데이터와 고화질 그래픽을 신속하게 처리함으로써 자연스럽고 몰입감 있는 플레이 환경을 제공한다.\\n...\\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술이 적용된 이동형 스크린 파크골프 부스를 선보이며 시장 확대에 나선다.\"},{\"url\":\"https://biz.chosun.com/industry/business_info/2026/10/20/LBIPPVB5WBEIVBZVGHXQRPOUPM/\",\"title\":\"낫소, 이동형 스크린 파크골프 부스 선보여… 공공·복지시설 ...\",\"publisher\":\"biz.chosun.com\",\"publishedAt\":\"2026-10-20\",\"snippet\":\"언리얼 엔진 5.1 기반 4K UHD 그래픽 적용\\n...\\n스포츠용품 전문기업 낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보였다.\\n지자체와 공공기관, 주민복지시설 등을 대상으로 시장 확대에 나선다는 계획이다.\\n...\\n이번 부스는 언리얼 엔진 5.1(Unreal Engine 5.1) 기반 4K UHD 그래픽을 적용해 가상 필드 환경을 구현하도록 설계됐다.\\n실제 파크골프장을 연상시키는 코스 풍경과 그래픽 표현을 통해 실내에서도 현장감 있는 플레이를 할 수 있도록 구성했다.\\n...\\n2비전 하이스피드 카메라 센서를 적용해 타격 순간 공의 움직임을 감지하고 이를 스크린 속 가상 필드에 실시간으로 반영하도록 설계했다.\\n고성능 시스템을 결합해 센서 데이터와 그래픽을 처리함으로써 플레이 환경을 구현한다.\\n...\\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업이다.\\n...\\n낫소 관계자는 \\\"이동형 스크린 파크골프 부스는 고화질 그래픽과 정밀한 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 갖춘 것이 특징\\\"이라며 \\\"공공·복지시설의 상시 생활체육 프로그램은 물론 다양한 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획\\\"이라고 밝혔다.\"},{\"url\":\"https://v.daum.net/v/20261022130529516\",\"title\":\"낫소, 이동형 스크린 파크골프 부스 출시… 공공·복지시설 활용 추진\",\"publisher\":\"v.daum.net\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"스포츠용품 전문기업 낫소가 4K UHD 그래픽과 카메라 센서를 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다.\\n낫소 관계자는 \\\"이동형 스크린 파크골프 부스는 고화질 그래픽과 정밀한 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 갖춘 것이 특징\\\"이라며 \\\"공공·복지시설의 상시 생활체육 프로그램은 물론 다양한 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획\\\"이라고 밝혔다.\\n...\\n**언리얼 엔진 5.1 기반 4K UHD 고화질 그래픽으로 실감 나는 플레이 환경 구현\\n무용접 조립 구조로 설치·철거 간소화… 공공·복지시설 및 이동형 체험 행사 활용 기대**\\n[이데일리 이윤정 기자] 스포츠용품 전문기업 낫소가 4K UHD 그래픽과 카메라 센서를 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다.\\n...\\n이번 제품은 언리얼 엔진 5.1(Unreal Engine 5.1) 기반의 4K UHD 그래픽을 적용해 가상 파크골프 코스를 구현했다.\\n...\\n특히 2 비전 하이스피드 카메라 센서를 통해 타격 순간 공의 움직임을 감지하고, 해당 정보를 가상 필드에 반영하도록 설계했다.\\n고성능 시스템을 결합해 센서 데이터와 그래픽을 처리하는 방식이다.\\n부스 구조에는 용접 없이 부재를 연결하고 분해할 수 있는 무용접 조인트(Joint) 결합 방식을 적용했다.\\n...\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 고화질 그래픽과 정밀한 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 갖춘 것이 특징”이라며 “공공·복지시설의 상시 생활체육 프로그램은 물론 다양한 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획”이라고 밝혔다.\"},{\"url\":\"https://www.mk.co.kr/author/1033\",\"title\":\"최은화 기자\",\"publisher\":\"mk.co.kr\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"## 최신기사\\n### 낫소, 생활체육 접근성 높인다… 이동형 스크린 파크골프 부스 출사표\\n언리얼 엔진 5.1 기반 UHD 그래픽•무용접 조립 구조로 설치 편의성과 활용성 강화스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다.\\n기존 실내 공간을 활용해 지역 주민과 시니어에게 새로운 생활체육 환경을 제공할 수 있도록 기획한 제품\\n2026-10-21 11:14:48\"},{\"url\":\"https://www.edaily.co.kr/News/Read?newsId=04008166645615544&mediaCodeNo=257\",\"title\":\"낫소, 이동형 스크린 파크골프 부스 출시… 공공·복지시설 활용 ...\",\"publisher\":\"edaily.co.kr\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"언리얼 엔진 5.1 기반 4K UHD 고화질 그래픽으로 실감 나는 플레이 환경 구현\\n...\\n[이데일리 이윤정 기자] 스포츠용품 전문기업 낫소가 4K UHD 그래픽과 카메라 센서를 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다.\\n무용접 조립 구조를 적용해 설치와 철거가 가능하도록 설계했으며, 지자체와 공공기관, 주민복지시설 등을 대상으로 사업을 추진한다.\\n...\\n이번 제품은 언리얼 엔진 5.1(Unreal Engine 5.1) 기반의 4K UHD 그래픽을 적용해 가상 파크골프 코스를 구현했다.\\n다양한 코스와 연습 콘텐츠를 제공하며, 입문자의 연습부터 기존 이용자의 게임과 친선경기까지 활용할 수 있도록 구성했다.\\n특히 2 비전 하이스피드 카메라 센서를 통해 타격 순간 공의 움직임을 감지하고, 해당 정보를 가상 필드에 반영하도록 설계했다.\\n고성능 시스템을 결합해 센서 데이터와 그래픽을 처리하는 방식이다.\\n부스 구조에는 용접 없이 부재를 연결하고 분해할 수 있는 무용접 조인트(Joint) 결합 방식을 적용했다.\\n이를 통해 설치와 철거, 이동 및 재설치가 가능하도록 했다.\\n...\\n낫소는 지자체 주민복지시설과 체육시설, 주민센터, 마을회관 등 기존 실내 공간을 활용하는 방안을 추진하고 있다.\\n...\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 고화질 그래픽과 정밀한 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 갖춘 것이 특징”이라며 “공공·복지시설의 상시 생활체육 프로그램은 물론 다양한 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획”이라고 밝혔다.\"},{\"url\":\"https://www.mk.co.kr/news/business/12180418\",\"title\":\"낫소, “내 몸에 딱 맞는 파크골프채” 출시, 신제품 선보이며 ...\",\"publisher\":\"mk.co.kr\",\"publishedAt\":\"2026-10-20\",\"snippet\":\"낫소는 맞춤형 파크골프채와 함께 이동형 스크린 파크골프 부스 사업도 추진하고 있다.\\n이 부스는 언리얼 엔진 5.1 기반 4K UHD 고화질 그래픽과 다양한 코스 및 연습 콘텐츠, 2 비전 하이스피드 카메라 센서를 적용해 몰입감 있는 실내 플레이 환경을 제공한다.\"},{\"url\":\"https://biz.chosun.com/industry/business_info/2026/10/19/Z3NE4YGXYRBAXDPQPZ666WZPSU/?outputType=native\",\"title\":\"낫소, 체형별 맞춤형 파크골프채 출시… 생활스포츠 사업 확대 - 조선비즈\",\"publisher\":\"biz.chosun.com\",\"publishedAt\":\"2026-10-19\",\"snippet\":\"스포츠용품 전문기업 낫소가 사용자의 신장과 체형에 맞춰 선택할 수 있는 맞춤형 파크골프채 '페룬 맥스 3'를 선보였다.\\n...\\n언리얼 엔진 5.1 기반의 4K UHD 고화질 그래픽, 다채로운 가상 코스 및 연습 프로그램, 2비전 하이스피드 카메라 센서를 탑재해 실내에서도 생생한 필드감을 제공한다.\"},{\"url\":\"https://www.hankookilbo.com/news/article/A2026102109320004879\",\"title\":\"낫소, 체형별 맞춤형 파크골프채 선보여…생활스포츠 사업 확대\",\"publisher\":\"hankookilbo.com\",\"publishedAt\":\"2026-10-21\",\"snippet\":\"언리얼 엔진 5.1 기반의 4K UHD 그래픽과 다양한 코스 및 연습 콘텐츠, 2비전 하이스피드 카메라 센서를 적용해 실내에서도 파크골프를 체험할 수 있도록 구성했다.\"},{\"url\":\"https://nassau.co.kr/intro/\",\"title\":\"회사소개\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-02\",\"snippet\":\"스포츠 용품을 바탕으로 한 스포츠와 엔터테인먼트, 사물인터넷, 의료, 헬스를 결합한 스포츠 융합 제품의 개발에 힘을 쏟겠습니다.\"},{\"url\":\"https://www.edaily.co.kr/news/read?newsid=03027446645614888&mediaCodeNo=257\",\"title\":\"낫소, 체형별 맞춤형 파크골프채로 시장 공략 본격화\",\"publisher\":\"edaily.co.kr\",\"publishedAt\":\"2026-10-20\",\"snippet\":\"[이데일리 이윤정 기자] 스포츠용품 전문기업 ㈜낫소는 사용자의 신장과 체형에 맞춰 라이각도를 선택할 수 있는 맞춤형 파크골프채 ‘페룬 맥스 3’를 출시했다고 19일 밝혔다.\\n라이각도를 2도 단위로 세분화하고 헤드 소재와 무게중심, 솔 디자인 등을 적용한 것이 특징이다.\\n...\\n언리얼 엔진 5.1 기반 4K UHD 그래픽과 코스·연습 콘텐츠, 2 비전 하이스피드 카메라 센서를 갖췄다.\"},{\"url\":\"https://namu.wiki/w/%EB%82%AB%EC%86%8C\",\"title\":\"낫소\",\"publisher\":\"namu.wiki\",\"publishedAt\":\"2026-10-26\",\"snippet\":\"자세한 내용은 낫소(기업) 문서를 참고하십시오.\\n테니스공, 축구공 등을 제조한다.\"}],\"llmUsage\":{\"promptTokens\":5854,\"completionTokens\":317,\"totalTokens\":6171,\"estimatedCostUsd\":0.03754}}","started_at":"2026-10-28T09:00:08.597Z","finished_at":"2026-10-28T09:00:16.490Z","error":null},{"id":"2792230a-6bc2-45e3-bb5d-0c66f185215b","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S2","status":"completed","output_json":"{\"hasOfficialHomepage\":true,\"homepageUrl\":\"https://nassau.co.kr/intro/\",\"snsOnly\":false,\"verdict\":\"PASS\",\"businessVerifiedSummary\":\"㈜낫소의 사업 실체 및 공식 채널이 확인되었습니다.\",\"sources\":[{\"url\":\"https://nassau.co.kr/intro/\",\"title\":\"회사소개\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-02\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n# 회사소개\\n...\\n> 쿠바 북쪽 바하마 제도의 항구도시인 “나소(NASSAU)”를 연상하게 하는 저희 회사는 그 이름처럼 \\\"모든 사람들이 스포츠의 페어플레이(Fair Play)를 통해 평화롭고 건강한 삶의 꿈(Dream)을 이룰 수 있도록 돕는다.”란 비전을 두고 있습니다.\\n저희는 회사 비전을 달성하기 위해 기업다운 기업, 직원과 파트너와의 동반 성장, 최고의 가치 추구, 수익 창출을 경영이념으로 삼고, 국내·외 다양한 스포츠 종목의 협회, 단체 등과 협력관계를 구축하여 엘리트 분야뿐 아니라 생활체육 분야에 이르기까지 스포츠 인구의 저변 확대에 기여하겠습니다.\\n...\\nPT.\\nNassau Sport Indonesia\\n...\\n> 사업영역\\n취급품목\\n테니스공, 배구공, 축구공, 풋살공\\n글로벌네크워크\\n북미, 남미, 유럽, 아시아\"},{\"url\":\"https://isplus.com/article/view/isp202610190209\",\"title\":\"낫소, 이동형 스크린 파크골프 부스 선봬…공공·복지시설 ...\",\"publisher\":\"isplus.com\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"스크린파크골프 부스 (기사의 이해를 돕기 위한 생성형 이미지)\\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설 등을 대상으로 사업 확대에 나섰다.\\n낫소는 기존 실내 공간을 활용해 지역 주민과 시니어 등이 파크골프를 체험할 수 있도록 이동형 스크린 파크골프 부스를 개발했다고 밝혔다.\\n...\\n다양한 코스와 연습 콘텐츠도 제공한다.\\n...\\n1971년 창립해 올해 55주년을 맞은 낫소는 축구공과 배구공, 테니스공 등 다양한 스포츠용품을 개발·생산해 왔다.\\n해외 생산시설을 기반으로 스포츠용품 제조·수출 사업을 전개하며 제품 개발 경험을 축적해 왔다.\\n최근에는 축구·테니스·배구 등 기존 스포츠 분야에서 피클볼과 파크골프 등 생활스포츠 분야로 사업 영역을 확대하고 있다.\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 고화질 그래픽과 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 적용한 것이 특징”이라며 “공공·복지시설의 상시 생활체육 프로그램은 물론 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획”이라고 밝혔다.\"},{\"url\":\"https://www.incruit.com/company/1683636837/\",\"title\":\"2026년 낫소 채용 기업정보 - 인크루트\",\"publisher\":\"incruit.com\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"- *사업내용 : 운동구제조\\n무역업\\n*\\n...\\n- **기업규모** 중소기업\\n- **대표자** 주은형,김성식,주은형\\n...\\n- **업종** 고무·플라스틱\\n...\\n### 기업위치\\n...\\n- 홈페이지 : http://www.nassau.co.kr\"},{\"url\":\"https://app.rndcircle.io/company/3fae70b0-aacf-5bf4-b15e-a88b7f2f5a6a\",\"title\":\"(주)낫소 기업 정보 | RnDcircle | 디써클\",\"publisher\":\"app.rndcircle.io\",\"publishedAt\":\"2026-09-17\",\"snippet\":\"(주)낫소는 1971년 설립된 대한민국을 대표하는 종합 스포츠용품 전문 제조 기업입니다.\\n반세기에 걸쳐 축적된 독자적인 기술력과 노하우를 바탕으로 테니스공, 축구공, 배구공, 농구공 등 다양한 구기 종목의 용품을 생산하고 있습니다.\\n...\\n핵심 사업: 구기 용품 제조 및 유통\\n(주)낫소의 핵심 비즈니스는 테니스공을 필두로 한 축구공, 농구공, 배구공 등 다양한 구기 용품의 자체 개발, 생산 및 판매입니다.\\n자체 브랜드 '낫소(Nassau)'를 통해 국내외 시장에 제품을 공급하며, 공식 온라인 쇼핑몰을 통한 B2C 판매와 대리점 및 유통업체를 통한 B2B 판매를 병행하고 있습니다.\\n...\\n회사의 주력 제품으로, 대한테니스협회(KTA) 공식 사용구로 30년 이상 사용되며 국내 시장에서 독보적인 입지를 구축했습니다.\\n대표 모델인 '낫소 챔피언십'은 뛰어난 내구성과 일관된 바운스로 동호인부터 엘리트 선수까지 폭넓게 사용됩니다.\"},{\"url\":\"https://m.jobkorea.co.kr/company/43575847\",\"title\":\"낫소 2026년 기업정보 - 직원수, 근무환경, 복리후생 등 - 잡코리아\",\"publisher\":\"m.jobkorea.co.kr\",\"publishedAt\":\"2022-04-19\",\"snippet\":\"대표자\\n주은형\\n주요사업\\n스포츠용품 제조\\n...\\n홈페이지\\nhttp://www.nassau.co.kr\"},{\"url\":\"https://www.innoforest.co.kr/company/CP00017276/%EB%82%AB%EC%86%8C\",\"title\":\"낫소 | 기업정보(매출·투자·고용) - 혁신의숲(InnoForest)\",\"publisher\":\"innoforest.co.kr\",\"publishedAt\":\"2025-01-01\",\"snippet\":\"## 기본정보 및 요약 데이터\\n기업소개\\n낫소는 대한민국 스포츠 파워 DNA를 바탕으로 다양한 구기 종목에 사용되는 용품을 제조 및 판매하는 기업입니다.\\n이 회사는 KFA APPROVED 축구공을 비롯하여 농구공, 테니스볼, 피클볼 세트 등 다양한 스포츠 장비를 공급하고 있습니다.\\n주요 제품은 소비자 대상의 Vertical-Commerce 형태로 온라인에서 판매되고 있으며, 피클볼 라인 등 신규 카테고리 확장 노력을 보이고 있습니다.\\n...\\n스포츠 용품 제조, KFA APPROVED, Vertical Commerce\\n...\\n홈페이지http://nassau.co.kr\"},{\"url\":\"https://biz.chosun.com/industry/business_info/2026/10/19/Z3NE4YGXYRBAXDPQPZ666WZPSU/\",\"title\":\"낫소, 체형별 맞춤형 파크골프채 출시… 생활스포츠 사업 확대\",\"publisher\":\"biz.chosun.com\",\"publishedAt\":\"2026-10-19\",\"snippet\":\"# 낫소, 체형별 맞춤형 파크골프채 출시… 생활스포츠 사업 확대\\n스포츠용품 전문기업 낫소가 사용자의 신장과 체형에 맞춰 선택할 수 있는 맞춤형 파크골프채 '페룬 맥스 3'를 선보였다.\\n...\\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업이다.\\n축구공·배구공·테니스공 등 다양한 스포츠용품을 개발·생산하며 국내외 시장에서 사업을 이어왔다.\\n해외 생산시설을 기반으로 스포츠용품 제조와 수출 사업을 전개하고 있으며, 축적한 제품 개발 경험과 제조 기술을 바탕으로 제품 경쟁력 강화에 나서고 있다.\\n기존 축구·테니스·배구 등 전통 스포츠 중심의 사업에서 피클볼·파크골프 등 생활스포츠 분야로 영역을 확대하고 있다.\\n맞춤형 파크골프채 역시 이러한 사업 다각화 전략의 일환이다.\\n...\\n낫소는 맞춤형 파크골프채와 더불어 첨단 ICT 기술을 결합한 '이동형 스크린 파크골프 부스' 사업도 함께 추진 중이다.\"},{\"url\":\"https://www.asiatoday.co.kr/kn/view.php?key=20260730010011411\",\"title\":\"반세기 기술력으로 세계 무대 누비는 낫소… K-스포츠 브랜드 ...\",\"publisher\":\"asiatoday.co.kr\",\"publishedAt\":\"2026-07-30\",\"snippet\":\"국내 스포츠용품 전문기업 낫소(NASSAU)가 50년이 넘는 기술력과 제조 경쟁력을 앞세워 글로벌 시장 공략에 속도를 내고 있다.\\n축구공과 테니스공, 배구공 등 다양한 스포츠용품을 생산하는 낫소는 해외 생산기지와 수출망을 기반으로 대한민국 스포츠 브랜드의 경쟁력을 세계 시장에 알리고 있다.1971년 설립된 낫소는 축구공과 풋살공, 테니스공, 배구공을 비롯해 농구공과 족구공, 라켓, 유니폼, 각종 경기·훈련용품 등을 생산하며 전문체육과 생활체육, 학교체육 현장에 제품을 공급해왔다.\\n...\\n낫소 테니스공은 1986 서울아시안게임과 1988 서울올림픽 공식 사용구로 선정됐으며, 1988년부터 1990년까지는 세계 4대 테니스대회 가운데 하나인 호주오픈 공식 사용구로 채택됐다.\\n...\\n직접 운영하는 인도네시아 생산공장을 중심으로 생산과 품질관리, 포장, 해외 공급을 일원화했으며, 이를 통해 글로벌 거래처에 안정적으로 제품을 공급하고 있다.\\n미국 타치카라와 프랭클린의 배구공, 스페인 불패델과 미국 솔린코의 테니스공 등 해외 스포츠 브랜드 제품도 이 공장에서 생산하며 제조 경쟁력을 인정받고 있다.자체 브랜드를 앞세운 해외시장 확대도 이어지고 있다.\\n낫소는 프랑스와 싱가포르, 이스라엘, 핀란드 등 다양한 국가에 자체 브랜드 스포츠용품을 수출하고 있다.\\n아르헨티나에서는 약 35년간 현지 파트너와 협력 관계를 유지하며 브랜드 입지를 다져왔다.\\n높은 해외 매출 비중을 바탕으로 글로벌 스포츠용품 기업으로 성장세를 이어간다는 전략이다.글로벌 사업 확대와 함께 스포츠를 통한 사회적 가치 실현에도 힘을 보태고 있다.\\n기아대책 호프컵과 스페셜올림픽코리아 등 유소년·장애인 스포츠 지원 사업에 참여하며 스포츠 저변 확대에도 나서고 있다.\"},{\"url\":\"https://www.hankookilbo.com/news/article/A2026102109320004879\",\"title\":\"낫소, 체형별 맞춤형 파크골프채 선보여…생활스포츠 사업 확대\",\"publisher\":\"hankookilbo.com\",\"publishedAt\":\"2026-10-21\",\"snippet\":\"스포츠용품 전문기업 낫소가 사용자의 신장과 체형에 맞춰 선택할 수 있는 파크골프채 ‘페룬 맥스 3’를 선보이며 파크골프 시장 공략에 나섰다.\\n이용자의 신체 조건에 적합한 클럽을 선택할 수 있도록 설계해 스윙 편의성과 안정성을 고려한 것이 특징이다.\\n...\\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업으로, 축구공과 배구공, 테니스공 등 다양한 스포츠용품을 개발·생산해 왔다.\\n해외 생산시설을 기반으로 제조 및 수출 사업을 전개하고 있으며, 최근에는 기존 구기 종목에서 피클볼과 파크골프 등 생활스포츠 분야로 사업 영역을 확대하고 있다.\\n이와 함께 이동형 스크린 파크골프 부스 사업도 추진 중이다.\\n해당 부스는 무용접 조립 방식의 조인트 구조를 적용해 설치와 해체, 이동이 용이하도록 설계했다.\\n...\\n이동형 부스는 지자체 주민복지시설과 체육시설, 주민센터, 마을회관 등에서 생활체육 프로그램으로 활용할 수 있도록 개발됐다.\"},{\"url\":\"https://www.nassau.co.kr/\",\"title\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n## 베스트 상품\\n### 입금계좌안내\\n#### 배송안내\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://www.saramin.co.kr/zf_user/company-info/view/csn/R05qbmlWK1FZS1creU5hMFlFVVQwdz09/company_nm/(%EC%A3%BC)%EB%82%AB%EC%86%8C\",\"title\":\"(주)낫소 2025년 기업정보 | 직원수, 매출액, 복리후생 등 - 사람인\",\"publisher\":\"saramin.co.kr\",\"publishedAt\":\"2025-05-09\",\"snippet\":\"- 기타 운동 및 경기용구 제조업\\n...\\n- 사업내용\\n스포츠용품 제조\\n...\\n낫소는 1971년11월 설립한 50년 역사의 한국 토종브랜드로서 축구공, 배구공, 테니스공, 농구공을 포함한 다양한 스포츠용품을 생산, 판매하고 있습니다.\"},{\"url\":\"https://www.nassau.co.kr/cs/partner.asp\",\"title\":\"제휴/도매문의 - 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-28\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\"},{\"url\":\"https://www.mygoyang.com/news/articleView.html?idxno=49924\",\"title\":\"“글로벌 스포츠브랜드와 겨루는 꿈, 현실로 만들 것”\",\"publisher\":\"mygoyang.com\",\"publishedAt\":\"2019-02-23\",\"snippet\":\"전 세계 21개 국가에 스포츠 용품을 수출할 수 있는 네크워크를 구축했고, 3년 후엔 국내 스포츠기업으로는 최초로 주식시장 상장을 목표로, 장기적으로는 스포츠용품과 헬스케어를 접목한 스포테인먼트 기술 플랫폼 공유기업을 비전으로 설정하고 있다.\\n...\\n**낫소의 주력 상품 분야는 무엇인가.\\n**\\n70여 가지의 제품이 있지만 주력은 당연히 축구공이다.\\n테니스공, 배구공도 있고, 최근 족구공과 족구화도 새로 개발했다.\\n대한축구협회뿐 아니라 9개 시·도축구협회와도 후원 협약을 맺었다.\\n...\\n가장 탁월한 것은 축구공 제조기술력이다.\\n47년 동안 축구공을 만들어온 땀과 노력 그리고 노하우가 우리 연구소에 축적되어 있다.\\n그 결과 세계 최초로 4패널 시스템 공법이 적용된 공을 개발했다.\\n...\\n다른 하나는 국내 브랜드로서는 유일하게 수출을 하고 있다는 점이다.\\n...\\n현재 해외 21개 국가에 수출하고 있는데 올해 안에 25개국으로 늘려 매출도 300만불을 넘길 것으로 보고 있다.\\n...\\n낫소는 장기적으로 스포테인먼트 기업이 되는 것을 목표로 하고 있다.\\n기존 용품사업과 더불어 앞으로 스포츠 의류사업을 복구하고 헬스케어 사업부문을 추가할 예정이다.\\n헬스케어 분야는 가장 혁신이 많이 일어날 수 있는 사업영역이다.\\n테이핑, 마스크, 기능성 패치, 단백질 파우더 등 건강과 체력증진에 좋은 상품 개발을 위해 바이오 기업과 기술 협약을 맺어 혁신적인 제품을 선보일 것이다.\"},{\"url\":\"https://www.mt.co.kr/future/2023/06/30/2023063014362764382\",\"title\":\"50년 역사 토종 브랜드 '낫소', 실물·가상 패션 브랜드 선보인다\",\"publisher\":\"mt.co.kr\",\"publishedAt\":\"2023-06-30\",\"snippet\":\"메타버스·NFT(대체불가능토큰) 기술 기업 트레져랩스가 국내 스포츠 브랜드 '낫소(Nassau)'와 손잡고 메타버스 패션 전문 브랜드를 공동 출시한다고 30일 밝혔다.\\n양측은 이번 협업을 통해 실물 제품은 물론 메타버스 플랫폼 '파라리움(PARARIUM)' 내에서 아바타 의류를 경험할 수 있는 패션 컬렉션을 선보일 예정이다.\\n...\\n낫소는 50년의 역사를 자랑하는 토종 브랜드다.\\n내구성이 뛰어난 다양한 스포츠 용품을 발매하며 대한민국 대표 스포츠 브랜드로 사랑받고 있다.\\n대한축구협회(KFA) 공식 시합구 등 각종 국제협회의 공인 획득을 통해 제품의 우수성을 입증했다.\\n낫소는 최근 MZ세대를 겨냥한 마케팅에 공을 들이고 있다.\\n무신사를 통해 더블유캔버스와 함께 '낫소1971' 스포츠캐주얼 브랜드를 출시했으며, 카카오프렌즈 캐릭터를 활용한 카카오 스포츠 용품 라인업도 선보였다.\"},{\"url\":\"https://nassau.co.kr/cs/faq.asp\",\"title\":\"고객센터\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-03\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://nassau.co.kr/cs/news.asp\",\"title\":\"고객센터\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-03\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://nassau.co.kr/product/list.asp?code3=5127\",\"title\":\"테니스라켓\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-09-25\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\"},{\"url\":\"http://nassau.co.kr/intro/?act=04\",\"title\":\"낫소 쇼핑몰\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-14\",\"snippet\":\"저희는 회사 비전을 달성하기 위해 기업다운 기업, 직원과 파트너와의 동반 성장, 최고의 가치 추구, 수익 창출을 경영이념으로 삼고, 국내·외 다양한 스포츠 종목의 협회, 단체 등과 협력관계를 구축하여 엘리트 분야뿐 아니라 생활체육 분야에 이르기까지 스포츠 인구의 저변 확대에 기여하겠습니다.\\n...\\n회사소개\\n화사명\\nPT.\\nNassau Sport Indonesia\\n...\\n설립연월\\n1989년 10월\\n대표이사\\n...\\n사업영역\\n취급품목\\n테니스공, 배구공, 축구공, 풋살공\\n글로벌네크워크\\n북미, 남미, 유럽, 아시아\"},{\"url\":\"https://nassau.co.kr/product/detail.asp?code2=5113&code3=0&seq=19041\",\"title\":\"티볼 공 1개입(9인치)\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n1577-4580\\n...\\n주소\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://nassau.co.kr/en/intro.asp?act=06\",\"title\":\"낫소 쇼핑몰\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-08\",\"snippet\":\"# COMPANY INTRODUCTION\\nNassau, Korea's home grown sporting goods brand, was established on November 16th, 1971 and has been walking together with the sports industry for the last fifty years.\\n...\\nOur continuous technology development and good quality have enabled us to gain approval by world-renowned sports federations such as International Tennis Federation(ITF), Federation Internationale de Volleyball(FIVB), International Handball Federation(IHF), Federation Internationale de Football Association(FIFA) and Korea Football Association(KFA) and to do years' sponsorship to KFA.\\n...\\nOur mission is to become a total sporting goods company to realize happy lives through sports and leisure.\\n...\\n1. Do our best to distribute and expand sporting activities by establishing reliable partnership with sporting federations and clubs in soccer, tennis and other sports.\\n...\\nTennis balls, padel balls and volleyballs\"},{\"url\":\"http://www.nassau.co.kr/files/pdf/2023_nassau_diary_catalog_kr.pdf\",\"title\":\"홈페이지 QR코드\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2024-09-28\",\"snippet\":\"주식회사 낫소\\nwww.nassau.co.kr\\nE-mail.sales@nassau.co.kr\\nT.1577-4580   Fax. 032-326-2570\\n경기도 고양시 덕양구 보광로 106번길 42 낫소빌딩\\n...\\nwww.nassau.co.kr / www.nassaushop.com\\n...\\n- SOCCER \\n- TENNIS \\n- JOKGU\\n- BASKETBALL \\n- VOLLEYBALL \\n- OTHERS \\n- NEW SPORTS\\n- UNIFORM\\n2023 NASSAU SPORTING GOODS\\nNow, Sports For Life\\nSPORTING GOODS\\nKorea No.1 Sports Brand\\nSince 1971\\nSPORTING GOODS\\n...\\n투지 프리미엄에는 1971년에 설립한 대한민국 대표 스포츠 브랜드 낫소의 50여년 오랜 기술과 노하우가 스며들어 있습니다.\"},{\"url\":\"https://fashionbiz.co.kr/article/119901\",\"title\":\"낫소, 스포츠 서브라이선스모집\",\"publisher\":\"fashionbiz.co.kr\",\"publishedAt\":\"2010-10-14\",\"snippet\":\"정통 스포츠용품 토종기업 낫소(대표 이태영 www.nassau.co.kr)가 「낫소(NASSAU)」브랜드로 스포츠 골프 아웃도어 등 브랜드를 전개할 서브라이선스 업체를 찾는다.\\n이 회사는 라이선스 전개를 통해 스포츠용품에서 의류를 포함한 토털 스포츠패션메이커로의 도약을 추진, 건실한 중소 패션기업중 생산 기반을 갖춘 스포츠웨어 업체의 라이선스 참여를 희망하고 있다.\\n...\\n낫소는 지난 1969년 출범해 40여년간 전문 스포츠 용품 회사로 활약, 국제 테니스 연맹(ITF), 국제배구연맹(FIVB), 국제핸드볼연맹(IHF), 국제축구연맹(FIFA), 대한축구협회(KFA) 공인 획득을 통해 테니스 축구 핸드볼 배구 등 부문에서 86아시안 게임 공식 사용구로 지정받은바 있으며 테니스볼의 경우 88올림픽공식구로 지정받기도.\\n또 세계 4대 그랜드스램 국제테니스대회인 호주오픈 공식사용구등 제품의 우수성을 세계에 알리는 기업으로 성장해 왔다.\\n낫소는 글로벌 낫소(NASSAU)를 향해 끊임없는 기술개발과 해외 우수 생산기지 구축등 적극적인 사업영역 확대와 투자로 전세계 40여개국에 대리점 체제를 구축하고 있다.\\n「낫소(NASSAU)」는 바하마 군도의 캐피탈(Capital Name)이며 네덜란드 황족 칭호였다.\\n유럽과 미국에는 나소 스트릿, 낫소 하우스, 낫소 컨트리등 고품격의 지명이 여러곳 있으며미국 뉴욕의 넘버원 하이웨이 이름이 낫소 하이웨이 이기도 해 고품격의 브랜드 인지도를 갖추고 있다.\"},{\"url\":\"https://blog.naver.com/dowoninfna/221972064111\",\"title\":\"상표이야기(634) : 낫소(NASSAU) 스포츠브랜드\",\"publisher\":\"blog.naver.com\",\"publishedAt\":\"2020-05-20\",\"snippet\":\"회사 홈피 : www.nassau.co.kr\\nWe are Korea's leading sporting goods manufacturer with a history of 50 years.\\nlearn more\\n...\\n1971년 설립된 낫소는 이름 탓에 일본 브랜드라는 오해를 받기도 했지만 토종이다.축구공 테니스공 등 스포츠용품을 제조하며 성장했다.\\n...\\n낫소는 한때 56개국으로 수출할 정도로 ‘잘나가던’ 토종 강소기업이었다.\\n...\\n주 대표는 “50년 가까이 만든 축구공은 노하우가 우리 연구소에 축적돼 있다”며 “그 결과 세계 최초로 4패널(조각) 시스템 공법이 적용된 공을 개발했다”고 소개했다.\\n...\\n낫소는 어려운 가운데 제3세계에 대한 지원을 아끼지 않고 있다.\\n2020 도쿄올림픽에 출전한 남수단 선수단에 단복, 유니폼 등 스포츠용품을 지원했고, 현재까지도 도움의 손길을 이어가고 있다.\\n...\\n주 대표는 사업 다각화에 나서겠다는 포부를 밝혔다.\\n그는 “카카오와 손을 잡고 캐릭터를 활용한 스포츠용품을 제작하고 있다”며 “스포츠 에어돔(공기 압력을 이용한 기둥 없는 실내 구조물), 의류 등으로 사업 영역을 확장하고 있고, 골프장 로봇 캐디 개발에도 투자하고 있다”고 말했다.\"},{\"url\":\"https://namu.wiki/w/%EB%82%AB%EC%86%8C(%EA%B8%B0%EC%97%85)?uuid=4e6ac24a-dec7-421a-a6ad-7787f9557fbe\",\"title\":\"낫소(기업) (r38 판)\",\"publisher\":\"namu.wiki\",\"publishedAt\":\"2021-02-26\",\"snippet\":\"|주식회사 낫소|주식회사 낫소|\\n|--|--|\\n|**설립일**|1971년|\\n|**국가**|대한민국|\\n|**분야**|스포츠용품 제조|\\n| … | … |\\n|**홈페이지**|http://www.nassau.co.kr/|\\n...\\nNassau는 대한민국의 스포츠용품 브랜드이다.\\n한때 **세계 4대 테니스공 메이커** 였으며, 주로 축구공, 테니스공, 농구공등을 생산하며 저가 의류에서도 이 브랜드를 볼 수 있다.\\n...\\n1971년에 세방물산이란 이름으로 설립되어 1978년 이 이름으로 회사 이름을 변경했다.\\n...\\n세계 메이저 브랜드 Wilson (미국), Babolat (프랑스), Head (오스트리아)의 테니스볼을 국내와 낫소 인도네시아 공장에서 OEM 및 ODM 생산한 적이 있다.\\n축구 부분에선 한국 최초로 칼라와 라텍스소재를 사용한 '칼라 라텍스 축구공' 돌파 태극 21을 개발 및 생산했다.\\n주로 공을 주력으로 만들어내고 있는데, 테니스 그랜드 슬램인 호주 오픈 공인구로 88년 낫소 테니스 공이 지정된 바 있다.\\n...\\n축구공 '투지' 역시 현재 FA컵과 K3리그, U리그, 초중고 주말리그 공인구로 사용되고 있으며, 아마추어 레벨에서 쓰기엔 아디다스와 나이키 공보다 내구성이나 가성비면에서 더 훌륭하다는 평을 받고 있다.\\n그 외 운동화도 가성비가 좋다는 평을 받고 있다.\\n또한 각종 패딩도 만들고 있다.\"},{\"url\":\"https://nassau.co.kr/en/cs_news.asp?act=view&idx=104404&keyword=&field=&page=3\",\"title\":\"pr center - Nassau Shopping Mall - Korea's leading sports brand\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-09-17\",\"snippet\":\"# PR CENTER\\n## NEWS\\n|Content|June 23, 2022Reporter: Woo Choong-won, OSEN Nassau Co., Ltd., a leading Korean sports brand, has announced a collaboration with Kakao Friends to launch a new line of co-branded products in the second half of 2022.\\nBy integrating Kakao Friends characters into its lineup of sports equipment, Nassau aims to increase its accessibility and appeal, particularly among MZ generation consumers and female customers.\\nSince its founding in 1971, Nassau has built a solid reputation in Korea’s sports industry.\\nThe company became the official match ball provider for the 1986 Asian Games and supplied tennis balls for the 1988 Seoul Olympics.\\nFrom 1993 onward, Nassau served as the official match ball partner for the Korea Football Association for three decades, solidifying its reputation for product excellence.\\nNow, Nassau is preparing for the future with a focus on sports technology, developing innovations such as its digital football training machine “Dr. Cannon” and eco-friendly sports airdomes.\"}],\"llmUsage\":{\"promptTokens\":8406,\"completionTokens\":326,\"totalTokens\":8732,\"estimatedCostUsd\":0.05301}}","started_at":"2026-10-28T09:00:16.494Z","finished_at":"2026-10-28T09:00:24.129Z","error":null},{"id":"9eb0ee9f-4218-4cdc-b36f-fb79d544a15c","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S3","status":"completed","output_json":"{\"verdict\":\"PASS\",\"matches\":[]}","started_at":"2026-10-28T09:00:24.130Z","finished_at":"2026-10-28T09:00:24.147Z","error":null},{"id":"45e05a97-2087-4669-b422-311e36c36664","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S4","status":"completed","output_json":"{\"claims\":[{\"id\":\"c1\",\"text\":\"스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c2\",\"text\":\"기존 실내 공간을 활용해 지역 주민과 시니어에게 새로운 생활체육 환경을 제공할 수 있도록 기획한 제품이다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c3\",\"text\":\"이번 부스는 언리얼 엔진 5.1 기반의 4K UHD 고화질 그래픽을 적용해 선명하고 생동감 있는 가상 필드를 구현하도록 설계됐다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c4\",\"text\":\"다양한 코스와 연습 콘텐츠를 제공해 입문자의 기초 연습부터 기존 이용자의 게임과 친선경기까지 폭넓게 활용할 수 있다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c5\",\"text\":\"특히 2 비전 하이스피드 카메라 센서를 적용해 타격 순간 볼의 움직임을 빠르고 정밀하게 감지하고, 이를 스크린 속 가상 필드에 반영하도록 설계했다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c6\",\"text\":\"부스의 기본 골격은 용접 없이 부재를 연결하고 분해할 수 있는 무용접 조인트 결합 방식으로 설계해 설치와 철거 과정을 간소화했다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c7\",\"text\":\"1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업으로, 축구공·배구공·테니스공 등 다양한 스포츠용품을 개발 및 생산해 왔다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c8\",\"text\":\"낫소 관계자는 “이동형 스크린 파크골프 부스는 실감 나는 플레이 환경과 설치·철거 편의성을 함께 고려한 제품”이라며 “앞으로도 지자체와 주민복지시설 등 다양한 공간에서 활용할 수 있는 생활체육 환경을 제공하고, 지역 주민들의 스포츠 참여 기회를 확대해 나가겠다”라고 밝혔다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"}],\"evidenceRequiredList\":[],\"hasMajorCorpMention\":false,\"verdict\":\"PASS\",\"sources\":[{\"url\":\"https://nassau.co.kr/intro/\",\"title\":\"회사소개\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-02\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n# 회사소개\\n...\\n> 쿠바 북쪽 바하마 제도의 항구도시인 “나소(NASSAU)”를 연상하게 하는 저희 회사는 그 이름처럼 \\\"모든 사람들이 스포츠의 페어플레이(Fair Play)를 통해 평화롭고 건강한 삶의 꿈(Dream)을 이룰 수 있도록 돕는다.”란 비전을 두고 있습니다.\\n저희는 회사 비전을 달성하기 위해 기업다운 기업, 직원과 파트너와의 동반 성장, 최고의 가치 추구, 수익 창출을 경영이념으로 삼고, 국내·외 다양한 스포츠 종목의 협회, 단체 등과 협력관계를 구축하여 엘리트 분야뿐 아니라 생활체육 분야에 이르기까지 스포츠 인구의 저변 확대에 기여하겠습니다.\\n...\\nPT.\\nNassau Sport Indonesia\\n...\\n> 사업영역\\n취급품목\\n테니스공, 배구공, 축구공, 풋살공\\n글로벌네크워크\\n북미, 남미, 유럽, 아시아\"},{\"url\":\"https://isplus.com/article/view/isp202610190209\",\"title\":\"낫소, 이동형 스크린 파크골프 부스 선봬…공공·복지시설 ...\",\"publisher\":\"isplus.com\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"스크린파크골프 부스 (기사의 이해를 돕기 위한 생성형 이미지)\\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설 등을 대상으로 사업 확대에 나섰다.\\n낫소는 기존 실내 공간을 활용해 지역 주민과 시니어 등이 파크골프를 체험할 수 있도록 이동형 스크린 파크골프 부스를 개발했다고 밝혔다.\\n...\\n다양한 코스와 연습 콘텐츠도 제공한다.\\n...\\n1971년 창립해 올해 55주년을 맞은 낫소는 축구공과 배구공, 테니스공 등 다양한 스포츠용품을 개발·생산해 왔다.\\n해외 생산시설을 기반으로 스포츠용품 제조·수출 사업을 전개하며 제품 개발 경험을 축적해 왔다.\\n최근에는 축구·테니스·배구 등 기존 스포츠 분야에서 피클볼과 파크골프 등 생활스포츠 분야로 사업 영역을 확대하고 있다.\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 고화질 그래픽과 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 적용한 것이 특징”이라며 “공공·복지시설의 상시 생활체육 프로그램은 물론 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획”이라고 밝혔다.\"},{\"url\":\"https://www.incruit.com/company/1683636837/\",\"title\":\"2026년 낫소 채용 기업정보 - 인크루트\",\"publisher\":\"incruit.com\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"- *사업내용 : 운동구제조\\n무역업\\n*\\n...\\n- **기업규모** 중소기업\\n- **대표자** 주은형,김성식,주은형\\n...\\n- **업종** 고무·플라스틱\\n...\\n### 기업위치\\n...\\n- 홈페이지 : http://www.nassau.co.kr\"},{\"url\":\"https://app.rndcircle.io/company/3fae70b0-aacf-5bf4-b15e-a88b7f2f5a6a\",\"title\":\"(주)낫소 기업 정보 | RnDcircle | 디써클\",\"publisher\":\"app.rndcircle.io\",\"publishedAt\":\"2026-09-17\",\"snippet\":\"(주)낫소는 1971년 설립된 대한민국을 대표하는 종합 스포츠용품 전문 제조 기업입니다.\\n반세기에 걸쳐 축적된 독자적인 기술력과 노하우를 바탕으로 테니스공, 축구공, 배구공, 농구공 등 다양한 구기 종목의 용품을 생산하고 있습니다.\\n...\\n핵심 사업: 구기 용품 제조 및 유통\\n(주)낫소의 핵심 비즈니스는 테니스공을 필두로 한 축구공, 농구공, 배구공 등 다양한 구기 용품의 자체 개발, 생산 및 판매입니다.\\n자체 브랜드 '낫소(Nassau)'를 통해 국내외 시장에 제품을 공급하며, 공식 온라인 쇼핑몰을 통한 B2C 판매와 대리점 및 유통업체를 통한 B2B 판매를 병행하고 있습니다.\\n...\\n회사의 주력 제품으로, 대한테니스협회(KTA) 공식 사용구로 30년 이상 사용되며 국내 시장에서 독보적인 입지를 구축했습니다.\\n대표 모델인 '낫소 챔피언십'은 뛰어난 내구성과 일관된 바운스로 동호인부터 엘리트 선수까지 폭넓게 사용됩니다.\"},{\"url\":\"https://m.jobkorea.co.kr/company/43575847\",\"title\":\"낫소 2026년 기업정보 - 직원수, 근무환경, 복리후생 등 - 잡코리아\",\"publisher\":\"m.jobkorea.co.kr\",\"publishedAt\":\"2022-04-19\",\"snippet\":\"대표자\\n주은형\\n주요사업\\n스포츠용품 제조\\n...\\n홈페이지\\nhttp://www.nassau.co.kr\"},{\"url\":\"https://www.innoforest.co.kr/company/CP00017276/%EB%82%AB%EC%86%8C\",\"title\":\"낫소 | 기업정보(매출·투자·고용) - 혁신의숲(InnoForest)\",\"publisher\":\"innoforest.co.kr\",\"publishedAt\":\"2025-01-01\",\"snippet\":\"## 기본정보 및 요약 데이터\\n기업소개\\n낫소는 대한민국 스포츠 파워 DNA를 바탕으로 다양한 구기 종목에 사용되는 용품을 제조 및 판매하는 기업입니다.\\n이 회사는 KFA APPROVED 축구공을 비롯하여 농구공, 테니스볼, 피클볼 세트 등 다양한 스포츠 장비를 공급하고 있습니다.\\n주요 제품은 소비자 대상의 Vertical-Commerce 형태로 온라인에서 판매되고 있으며, 피클볼 라인 등 신규 카테고리 확장 노력을 보이고 있습니다.\\n...\\n스포츠 용품 제조, KFA APPROVED, Vertical Commerce\\n...\\n홈페이지http://nassau.co.kr\"},{\"url\":\"https://biz.chosun.com/industry/business_info/2026/10/19/Z3NE4YGXYRBAXDPQPZ666WZPSU/\",\"title\":\"낫소, 체형별 맞춤형 파크골프채 출시… 생활스포츠 사업 확대\",\"publisher\":\"biz.chosun.com\",\"publishedAt\":\"2026-10-19\",\"snippet\":\"# 낫소, 체형별 맞춤형 파크골프채 출시… 생활스포츠 사업 확대\\n스포츠용품 전문기업 낫소가 사용자의 신장과 체형에 맞춰 선택할 수 있는 맞춤형 파크골프채 '페룬 맥스 3'를 선보였다.\\n...\\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업이다.\\n축구공·배구공·테니스공 등 다양한 스포츠용품을 개발·생산하며 국내외 시장에서 사업을 이어왔다.\\n해외 생산시설을 기반으로 스포츠용품 제조와 수출 사업을 전개하고 있으며, 축적한 제품 개발 경험과 제조 기술을 바탕으로 제품 경쟁력 강화에 나서고 있다.\\n기존 축구·테니스·배구 등 전통 스포츠 중심의 사업에서 피클볼·파크골프 등 생활스포츠 분야로 영역을 확대하고 있다.\\n맞춤형 파크골프채 역시 이러한 사업 다각화 전략의 일환이다.\\n...\\n낫소는 맞춤형 파크골프채와 더불어 첨단 ICT 기술을 결합한 '이동형 스크린 파크골프 부스' 사업도 함께 추진 중이다.\"},{\"url\":\"https://www.asiatoday.co.kr/kn/view.php?key=20260730010011411\",\"title\":\"반세기 기술력으로 세계 무대 누비는 낫소… K-스포츠 브랜드 ...\",\"publisher\":\"asiatoday.co.kr\",\"publishedAt\":\"2026-07-30\",\"snippet\":\"국내 스포츠용품 전문기업 낫소(NASSAU)가 50년이 넘는 기술력과 제조 경쟁력을 앞세워 글로벌 시장 공략에 속도를 내고 있다.\\n축구공과 테니스공, 배구공 등 다양한 스포츠용품을 생산하는 낫소는 해외 생산기지와 수출망을 기반으로 대한민국 스포츠 브랜드의 경쟁력을 세계 시장에 알리고 있다.1971년 설립된 낫소는 축구공과 풋살공, 테니스공, 배구공을 비롯해 농구공과 족구공, 라켓, 유니폼, 각종 경기·훈련용품 등을 생산하며 전문체육과 생활체육, 학교체육 현장에 제품을 공급해왔다.\\n...\\n낫소 테니스공은 1986 서울아시안게임과 1988 서울올림픽 공식 사용구로 선정됐으며, 1988년부터 1990년까지는 세계 4대 테니스대회 가운데 하나인 호주오픈 공식 사용구로 채택됐다.\\n...\\n직접 운영하는 인도네시아 생산공장을 중심으로 생산과 품질관리, 포장, 해외 공급을 일원화했으며, 이를 통해 글로벌 거래처에 안정적으로 제품을 공급하고 있다.\\n미국 타치카라와 프랭클린의 배구공, 스페인 불패델과 미국 솔린코의 테니스공 등 해외 스포츠 브랜드 제품도 이 공장에서 생산하며 제조 경쟁력을 인정받고 있다.자체 브랜드를 앞세운 해외시장 확대도 이어지고 있다.\\n낫소는 프랑스와 싱가포르, 이스라엘, 핀란드 등 다양한 국가에 자체 브랜드 스포츠용품을 수출하고 있다.\\n아르헨티나에서는 약 35년간 현지 파트너와 협력 관계를 유지하며 브랜드 입지를 다져왔다.\\n높은 해외 매출 비중을 바탕으로 글로벌 스포츠용품 기업으로 성장세를 이어간다는 전략이다.글로벌 사업 확대와 함께 스포츠를 통한 사회적 가치 실현에도 힘을 보태고 있다.\\n기아대책 호프컵과 스페셜올림픽코리아 등 유소년·장애인 스포츠 지원 사업에 참여하며 스포츠 저변 확대에도 나서고 있다.\"},{\"url\":\"https://www.hankookilbo.com/news/article/A2026102109320004879\",\"title\":\"낫소, 체형별 맞춤형 파크골프채 선보여…생활스포츠 사업 확대\",\"publisher\":\"hankookilbo.com\",\"publishedAt\":\"2026-10-21\",\"snippet\":\"스포츠용품 전문기업 낫소가 사용자의 신장과 체형에 맞춰 선택할 수 있는 파크골프채 ‘페룬 맥스 3’를 선보이며 파크골프 시장 공략에 나섰다.\\n이용자의 신체 조건에 적합한 클럽을 선택할 수 있도록 설계해 스윙 편의성과 안정성을 고려한 것이 특징이다.\\n...\\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업으로, 축구공과 배구공, 테니스공 등 다양한 스포츠용품을 개발·생산해 왔다.\\n해외 생산시설을 기반으로 제조 및 수출 사업을 전개하고 있으며, 최근에는 기존 구기 종목에서 피클볼과 파크골프 등 생활스포츠 분야로 사업 영역을 확대하고 있다.\\n이와 함께 이동형 스크린 파크골프 부스 사업도 추진 중이다.\\n해당 부스는 무용접 조립 방식의 조인트 구조를 적용해 설치와 해체, 이동이 용이하도록 설계했다.\\n...\\n이동형 부스는 지자체 주민복지시설과 체육시설, 주민센터, 마을회관 등에서 생활체육 프로그램으로 활용할 수 있도록 개발됐다.\"},{\"url\":\"https://www.nassau.co.kr/\",\"title\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n## 베스트 상품\\n### 입금계좌안내\\n#### 배송안내\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://www.saramin.co.kr/zf_user/company-info/view/csn/R05qbmlWK1FZS1creU5hMFlFVVQwdz09/company_nm/(%EC%A3%BC)%EB%82%AB%EC%86%8C\",\"title\":\"(주)낫소 2025년 기업정보 | 직원수, 매출액, 복리후생 등 - 사람인\",\"publisher\":\"saramin.co.kr\",\"publishedAt\":\"2025-05-09\",\"snippet\":\"- 기타 운동 및 경기용구 제조업\\n...\\n- 사업내용\\n스포츠용품 제조\\n...\\n낫소는 1971년11월 설립한 50년 역사의 한국 토종브랜드로서 축구공, 배구공, 테니스공, 농구공을 포함한 다양한 스포츠용품을 생산, 판매하고 있습니다.\"},{\"url\":\"https://www.nassau.co.kr/cs/partner.asp\",\"title\":\"제휴/도매문의 - 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-28\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\"},{\"url\":\"https://www.mygoyang.com/news/articleView.html?idxno=49924\",\"title\":\"“글로벌 스포츠브랜드와 겨루는 꿈, 현실로 만들 것”\",\"publisher\":\"mygoyang.com\",\"publishedAt\":\"2019-02-23\",\"snippet\":\"전 세계 21개 국가에 스포츠 용품을 수출할 수 있는 네크워크를 구축했고, 3년 후엔 국내 스포츠기업으로는 최초로 주식시장 상장을 목표로, 장기적으로는 스포츠용품과 헬스케어를 접목한 스포테인먼트 기술 플랫폼 공유기업을 비전으로 설정하고 있다.\\n...\\n**낫소의 주력 상품 분야는 무엇인가.\\n**\\n70여 가지의 제품이 있지만 주력은 당연히 축구공이다.\\n테니스공, 배구공도 있고, 최근 족구공과 족구화도 새로 개발했다.\\n대한축구협회뿐 아니라 9개 시·도축구협회와도 후원 협약을 맺었다.\\n...\\n가장 탁월한 것은 축구공 제조기술력이다.\\n47년 동안 축구공을 만들어온 땀과 노력 그리고 노하우가 우리 연구소에 축적되어 있다.\\n그 결과 세계 최초로 4패널 시스템 공법이 적용된 공을 개발했다.\\n...\\n다른 하나는 국내 브랜드로서는 유일하게 수출을 하고 있다는 점이다.\\n...\\n현재 해외 21개 국가에 수출하고 있는데 올해 안에 25개국으로 늘려 매출도 300만불을 넘길 것으로 보고 있다.\\n...\\n낫소는 장기적으로 스포테인먼트 기업이 되는 것을 목표로 하고 있다.\\n기존 용품사업과 더불어 앞으로 스포츠 의류사업을 복구하고 헬스케어 사업부문을 추가할 예정이다.\\n헬스케어 분야는 가장 혁신이 많이 일어날 수 있는 사업영역이다.\\n테이핑, 마스크, 기능성 패치, 단백질 파우더 등 건강과 체력증진에 좋은 상품 개발을 위해 바이오 기업과 기술 협약을 맺어 혁신적인 제품을 선보일 것이다.\"},{\"url\":\"https://www.mt.co.kr/future/2023/06/30/2023063014362764382\",\"title\":\"50년 역사 토종 브랜드 '낫소', 실물·가상 패션 브랜드 선보인다\",\"publisher\":\"mt.co.kr\",\"publishedAt\":\"2023-06-30\",\"snippet\":\"메타버스·NFT(대체불가능토큰) 기술 기업 트레져랩스가 국내 스포츠 브랜드 '낫소(Nassau)'와 손잡고 메타버스 패션 전문 브랜드를 공동 출시한다고 30일 밝혔다.\\n양측은 이번 협업을 통해 실물 제품은 물론 메타버스 플랫폼 '파라리움(PARARIUM)' 내에서 아바타 의류를 경험할 수 있는 패션 컬렉션을 선보일 예정이다.\\n...\\n낫소는 50년의 역사를 자랑하는 토종 브랜드다.\\n내구성이 뛰어난 다양한 스포츠 용품을 발매하며 대한민국 대표 스포츠 브랜드로 사랑받고 있다.\\n대한축구협회(KFA) 공식 시합구 등 각종 국제협회의 공인 획득을 통해 제품의 우수성을 입증했다.\\n낫소는 최근 MZ세대를 겨냥한 마케팅에 공을 들이고 있다.\\n무신사를 통해 더블유캔버스와 함께 '낫소1971' 스포츠캐주얼 브랜드를 출시했으며, 카카오프렌즈 캐릭터를 활용한 카카오 스포츠 용품 라인업도 선보였다.\"},{\"url\":\"https://nassau.co.kr/cs/faq.asp\",\"title\":\"고객센터\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-03\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://nassau.co.kr/cs/news.asp\",\"title\":\"고객센터\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-03\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://nassau.co.kr/product/list.asp?code3=5127\",\"title\":\"테니스라켓\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-09-25\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\"},{\"url\":\"http://nassau.co.kr/intro/?act=04\",\"title\":\"낫소 쇼핑몰\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-14\",\"snippet\":\"저희는 회사 비전을 달성하기 위해 기업다운 기업, 직원과 파트너와의 동반 성장, 최고의 가치 추구, 수익 창출을 경영이념으로 삼고, 국내·외 다양한 스포츠 종목의 협회, 단체 등과 협력관계를 구축하여 엘리트 분야뿐 아니라 생활체육 분야에 이르기까지 스포츠 인구의 저변 확대에 기여하겠습니다.\\n...\\n회사소개\\n화사명\\nPT.\\nNassau Sport Indonesia\\n...\\n설립연월\\n1989년 10월\\n대표이사\\n...\\n사업영역\\n취급품목\\n테니스공, 배구공, 축구공, 풋살공\\n글로벌네크워크\\n북미, 남미, 유럽, 아시아\"},{\"url\":\"https://nassau.co.kr/product/detail.asp?code2=5113&code3=0&seq=19041\",\"title\":\"티볼 공 1개입(9인치)\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n1577-4580\\n...\\n주소\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://nassau.co.kr/en/intro.asp?act=06\",\"title\":\"낫소 쇼핑몰\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-08\",\"snippet\":\"# COMPANY INTRODUCTION\\nNassau, Korea's home grown sporting goods brand, was established on November 16th, 1971 and has been walking together with the sports industry for the last fifty years.\\n...\\nOur continuous technology development and good quality have enabled us to gain approval by world-renowned sports federations such as International Tennis Federation(ITF), Federation Internationale de Volleyball(FIVB), International Handball Federation(IHF), Federation Internationale de Football Association(FIFA) and Korea Football Association(KFA) and to do years' sponsorship to KFA.\\n...\\nOur mission is to become a total sporting goods company to realize happy lives through sports and leisure.\\n...\\n1. Do our best to distribute and expand sporting activities by establishing reliable partnership with sporting federations and clubs in soccer, tennis and other sports.\\n...\\nTennis balls, padel balls and volleyballs\"},{\"url\":\"http://www.nassau.co.kr/files/pdf/2023_nassau_diary_catalog_kr.pdf\",\"title\":\"홈페이지 QR코드\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2024-09-28\",\"snippet\":\"주식회사 낫소\\nwww.nassau.co.kr\\nE-mail.sales@nassau.co.kr\\nT.1577-4580   Fax. 032-326-2570\\n경기도 고양시 덕양구 보광로 106번길 42 낫소빌딩\\n...\\nwww.nassau.co.kr / www.nassaushop.com\\n...\\n- SOCCER \\n- TENNIS \\n- JOKGU\\n- BASKETBALL \\n- VOLLEYBALL \\n- OTHERS \\n- NEW SPORTS\\n- UNIFORM\\n2023 NASSAU SPORTING GOODS\\nNow, Sports For Life\\nSPORTING GOODS\\nKorea No.1 Sports Brand\\nSince 1971\\nSPORTING GOODS\\n...\\n투지 프리미엄에는 1971년에 설립한 대한민국 대표 스포츠 브랜드 낫소의 50여년 오랜 기술과 노하우가 스며들어 있습니다.\"},{\"url\":\"https://fashionbiz.co.kr/article/119901\",\"title\":\"낫소, 스포츠 서브라이선스모집\",\"publisher\":\"fashionbiz.co.kr\",\"publishedAt\":\"2010-10-14\",\"snippet\":\"정통 스포츠용품 토종기업 낫소(대표 이태영 www.nassau.co.kr)가 「낫소(NASSAU)」브랜드로 스포츠 골프 아웃도어 등 브랜드를 전개할 서브라이선스 업체를 찾는다.\\n이 회사는 라이선스 전개를 통해 스포츠용품에서 의류를 포함한 토털 스포츠패션메이커로의 도약을 추진, 건실한 중소 패션기업중 생산 기반을 갖춘 스포츠웨어 업체의 라이선스 참여를 희망하고 있다.\\n...\\n낫소는 지난 1969년 출범해 40여년간 전문 스포츠 용품 회사로 활약, 국제 테니스 연맹(ITF), 국제배구연맹(FIVB), 국제핸드볼연맹(IHF), 국제축구연맹(FIFA), 대한축구협회(KFA) 공인 획득을 통해 테니스 축구 핸드볼 배구 등 부문에서 86아시안 게임 공식 사용구로 지정받은바 있으며 테니스볼의 경우 88올림픽공식구로 지정받기도.\\n또 세계 4대 그랜드스램 국제테니스대회인 호주오픈 공식사용구등 제품의 우수성을 세계에 알리는 기업으로 성장해 왔다.\\n낫소는 글로벌 낫소(NASSAU)를 향해 끊임없는 기술개발과 해외 우수 생산기지 구축등 적극적인 사업영역 확대와 투자로 전세계 40여개국에 대리점 체제를 구축하고 있다.\\n「낫소(NASSAU)」는 바하마 군도의 캐피탈(Capital Name)이며 네덜란드 황족 칭호였다.\\n유럽과 미국에는 나소 스트릿, 낫소 하우스, 낫소 컨트리등 고품격의 지명이 여러곳 있으며미국 뉴욕의 넘버원 하이웨이 이름이 낫소 하이웨이 이기도 해 고품격의 브랜드 인지도를 갖추고 있다.\"},{\"url\":\"https://blog.naver.com/dowoninfna/221972064111\",\"title\":\"상표이야기(634) : 낫소(NASSAU) 스포츠브랜드\",\"publisher\":\"blog.naver.com\",\"publishedAt\":\"2020-05-20\",\"snippet\":\"회사 홈피 : www.nassau.co.kr\\nWe are Korea's leading sporting goods manufacturer with a history of 50 years.\\nlearn more\\n...\\n1971년 설립된 낫소는 이름 탓에 일본 브랜드라는 오해를 받기도 했지만 토종이다.축구공 테니스공 등 스포츠용품을 제조하며 성장했다.\\n...\\n낫소는 한때 56개국으로 수출할 정도로 ‘잘나가던’ 토종 강소기업이었다.\\n...\\n주 대표는 “50년 가까이 만든 축구공은 노하우가 우리 연구소에 축적돼 있다”며 “그 결과 세계 최초로 4패널(조각) 시스템 공법이 적용된 공을 개발했다”고 소개했다.\\n...\\n낫소는 어려운 가운데 제3세계에 대한 지원을 아끼지 않고 있다.\\n2020 도쿄올림픽에 출전한 남수단 선수단에 단복, 유니폼 등 스포츠용품을 지원했고, 현재까지도 도움의 손길을 이어가고 있다.\\n...\\n주 대표는 사업 다각화에 나서겠다는 포부를 밝혔다.\\n그는 “카카오와 손을 잡고 캐릭터를 활용한 스포츠용품을 제작하고 있다”며 “스포츠 에어돔(공기 압력을 이용한 기둥 없는 실내 구조물), 의류 등으로 사업 영역을 확장하고 있고, 골프장 로봇 캐디 개발에도 투자하고 있다”고 말했다.\"},{\"url\":\"https://namu.wiki/w/%EB%82%AB%EC%86%8C(%EA%B8%B0%EC%97%85)?uuid=4e6ac24a-dec7-421a-a6ad-7787f9557fbe\",\"title\":\"낫소(기업) (r38 판)\",\"publisher\":\"namu.wiki\",\"publishedAt\":\"2021-02-26\",\"snippet\":\"|주식회사 낫소|주식회사 낫소|\\n|--|--|\\n|**설립일**|1971년|\\n|**국가**|대한민국|\\n|**분야**|스포츠용품 제조|\\n| … | … |\\n|**홈페이지**|http://www.nassau.co.kr/|\\n...\\nNassau는 대한민국의 스포츠용품 브랜드이다.\\n한때 **세계 4대 테니스공 메이커** 였으며, 주로 축구공, 테니스공, 농구공등을 생산하며 저가 의류에서도 이 브랜드를 볼 수 있다.\\n...\\n1971년에 세방물산이란 이름으로 설립되어 1978년 이 이름으로 회사 이름을 변경했다.\\n...\\n세계 메이저 브랜드 Wilson (미국), Babolat (프랑스), Head (오스트리아)의 테니스볼을 국내와 낫소 인도네시아 공장에서 OEM 및 ODM 생산한 적이 있다.\\n축구 부분에선 한국 최초로 칼라와 라텍스소재를 사용한 '칼라 라텍스 축구공' 돌파 태극 21을 개발 및 생산했다.\\n주로 공을 주력으로 만들어내고 있는데, 테니스 그랜드 슬램인 호주 오픈 공인구로 88년 낫소 테니스 공이 지정된 바 있다.\\n...\\n축구공 '투지' 역시 현재 FA컵과 K3리그, U리그, 초중고 주말리그 공인구로 사용되고 있으며, 아마추어 레벨에서 쓰기엔 아디다스와 나이키 공보다 내구성이나 가성비면에서 더 훌륭하다는 평을 받고 있다.\\n그 외 운동화도 가성비가 좋다는 평을 받고 있다.\\n또한 각종 패딩도 만들고 있다.\"},{\"url\":\"https://nassau.co.kr/en/cs_news.asp?act=view&idx=104404&keyword=&field=&page=3\",\"title\":\"pr center - Nassau Shopping Mall - Korea's leading sports brand\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-09-17\",\"snippet\":\"# PR CENTER\\n## NEWS\\n|Content|June 23, 2022Reporter: Woo Choong-won, OSEN Nassau Co., Ltd., a leading Korean sports brand, has announced a collaboration with Kakao Friends to launch a new line of co-branded products in the second half of 2022.\\nBy integrating Kakao Friends characters into its lineup of sports equipment, Nassau aims to increase its accessibility and appeal, particularly among MZ generation consumers and female customers.\\nSince its founding in 1971, Nassau has built a solid reputation in Korea’s sports industry.\\nThe company became the official match ball provider for the 1986 Asian Games and supplied tennis balls for the 1988 Seoul Olympics.\\nFrom 1993 onward, Nassau served as the official match ball partner for the Korea Football Association for three decades, solidifying its reputation for product excellence.\\nNow, Nassau is preparing for the future with a focus on sports technology, developing innovations such as its digital football training machine “Dr. Cannon” and eco-friendly sports airdomes.\"}]}","started_at":"2026-10-28T09:00:24.148Z","finished_at":"2026-10-28T09:00:24.150Z","error":null},{"id":"2b912b7c-d732-45c4-b821-2b1ef2ab241e","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S5","status":"completed","output_json":"{\"sanitizedText\":\"스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다. 기존 실내 공간을 활용해 지역 주민과 시니어에게 새로운 생활체육 환경을 제공할 수 있도록 기획한 제품이다.\\n\\n이번 부스는 언리얼 엔진 5.1 기반의 4K UHD 고화질 그래픽을 적용해 선명하고 생동감 있는 가상 필드를 구현하도록 설계됐다. 다양한 코스와 연습 콘텐츠를 제공해 입문자의 기초 연습부터 기존 이용자의 게임과 친선경기까지 폭넓게 활용할 수 있다.\\n\\n특히 2 비전 하이스피드 카메라 센서를 적용해 타격 순간 볼의 움직임을 빠르고 정밀하게 감지하고, 이를 스크린 속 가상 필드에 반영하도록 설계했다. 부스의 기본 골격은 용접 없이 부재를 연결하고 분해할 수 있는 무용접 조인트 결합 방식으로 설계해 설치와 철거 과정을 간소화했다.\\n\\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업으로, 축구공·배구공·테니스공 등 다양한 스포츠용품을 개발 및 생산해 왔다.\\n\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 실감 나는 플레이 환경과 설치·철거 편의성을 함께 고려한 제품”이라며 “앞으로도 지자체와 주민복지시설 등 다양한 공간에서 활용할 수 있는 생활체육 환경을 제공하고, 지역 주민들의 스포츠 참여 기회를 확대해 나가겠다”라고 밝혔다.\",\"diffs\":[],\"verdict\":\"PASS\"}","started_at":"2026-10-28T09:00:24.152Z","finished_at":"2026-10-28T09:00:24.159Z","error":null},{"id":"244c88df-ba23-41ca-8b4c-0f0275a37028","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S6","status":"completed","output_json":"{\"mode\":\"comparative\",\"titleCandidates\":[\"낫소, 4K 이동형 스크린 파크골프로 공공 생활체육시장 공략\",\"낫소, 정밀센서·무용접 부스로 지자체 파크골프 수요 선점\",\"창립 55주년 낫소, 스크린 파크골프로 시니어 스포츠 확장\"],\"title\":\"낫소, 4K 이동형 스크린 파크골프로 공공 생활체육시장 공략\",\"subtitle\":\"언리얼 엔진 5.1과 하이스피드 카메라로 구현한 실감형 가상 필드\\n간편한 설치·철거를 앞세운 지자체·복지시설 중심 시장 확대\",\"body\":\"스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다. 기존 실내 공간을 활용해 지역 주민과 시니어에게 새로운 생활체육 환경을 제공할 수 있도록 기획한 제품이다.\\n\\n특히 2 비전 하이스피드 카메라 센서를 적용해 타격 순간 볼의 움직임을 빠르고 정밀하게 감지하고, 이를 스크린 속 가상 필드에 반영하도록 설계했다. 부스의 기본 골격은 용접 없이 부재를 연결하고 분해할 수 있는 무용접 조인트 결합 방식으로 설계해 설치와 철거 과정을 간소화했다.\\n\\n이번 부스는 언리얼 엔진 5.1 기반의 4K UHD 고화질 그래픽을 적용해 선명하고 생동감 있는 가상 필드를 구현하도록 설계됐다. 다양한 코스와 연습 콘텐츠를 제공해 입문자의 기초 연습부터 기존 이용자의 게임과 친선경기까지 폭넓게 활용할 수 있다.\\n\\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업으로, 축구공·배구공·테니스공 등 다양한 스포츠용품을 개발 및 생산해 왔다.\\n\\n관련 스크린 파크골프 및 생활체육 시스템 시장에서도 주요 기업과 브랜드들의 영역 확장 경쟁이 치열하게 전개되고 있다. 골프존(GDR·파크골프)의 경우 기존 스크린골프에서 축적한 고정밀 센서와 코스 그래픽 기술을 바탕으로 지자체 및 커뮤니티 시설 대상 실내 파크골프 시뮬레이터 보급을 확대하고 있다. 카카오VX의 경우 직관적인 사용자 인터페이스(UI)와 생활체육 플랫폼 연동 기능을 앞세워 공공 체육시설 및 시니어 특화 스크린 스포츠 시장 공략에 속도를 내고 있다. 마실파크골프·SGP 등 전용 시뮬레이터 업계의 경우 전국 지자체 경로당·주민복지관 등 도심 내 실내 체육 공간 조성을 겨냥해 실감형 파크골프 설비와 구장 프랜차이즈 보급 경쟁을 벌이고 있다.\\n\\n기존 스크린 파크골프 업체들이 주로 대규모 전용 매장이나 고정식 인테리어 시공 방식으로 시장을 넓혀왔다면, ㈜낫소는 화면·센서·타석·외부 프레임을 하나로 묶은 일체형 이동식 부스 설계로 차별화를 꾀했다. 별도의 대규모 공사 없이 주민복지시설이나 기관 유휴 공간에 1부스 단위로 즉시 배치할 수 있어, 공간 제약과 초기 설치 부담을 줄이려는 지자체·공공기관 수요를 집중 공략한다는 전략이다.\\n\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 실감 나는 플레이 환경과 설치·철거 편의성을 함께 고려한 제품”이라며 “앞으로도 지자체와 주민복지시설 등 다양한 공간에서 활용할 수 있는 생활체육 환경을 제공하고, 지역 주민들의 스포츠 참여 기회를 확대해 나가겠다”라고 밝혔다.\",\"captions\":[\"스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보인다. [제공=낫소]\"],\"competitors\":[{\"name\":\"골프존(GDR·파크골프)\",\"summary\":\"기존 스크린골프에서 축적한 고정밀 센서와 코스 그래픽 기술을 바탕으로 지자체 및 커뮤니티 시설 대상 실내 파크골프 시뮬레이터 보급을 확대하고 있다.\",\"sourceUrl\":\"https://nassau.co.kr/intro/\",\"selected\":true},{\"name\":\"카카오VX\",\"summary\":\"직관적인 사용자 인터페이스(UI)와 생활체육 플랫폼 연동 기능을 앞세워 공공 체육시설 및 시니어 특화 스크린 스포츠 시장 공략에 속도를 내고 있다.\",\"sourceUrl\":\"https://isplus.com/article/view/isp202610190209\",\"selected\":true},{\"name\":\"마실파크골프·SGP 등 전용 시뮬레이터 업계\",\"summary\":\"전국 지자체 경로당·주민복지관 등 도심 내 실내 체육 공간 조성을 겨냥해 실감형 파크골프 설비와 구장 프랜차이즈 보급 경쟁을 벌이고 있다.\",\"sourceUrl\":\"https://www.incruit.com/company/1683636837/\",\"selected\":true}],\"sources\":[{\"url\":\"https://nassau.co.kr/intro/\",\"title\":\"회사소개\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-02\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n# 회사소개\\n...\\n> 쿠바 북쪽 바하마 제도의 항구도시인 “나소(NASSAU)”를 연상하게 하는 저희 회사는 그 이름처럼 \\\"모든 사람들이 스포츠의 페어플레이(Fair Play)를 통해 평화롭고 건강한 삶의 꿈(Dream)을 이룰 수 있도록 돕는다.”란 비전을 두고 있습니다.\\n저희는 회사 비전을 달성하기 위해 기업다운 기업, 직원과 파트너와의 동반 성장, 최고의 가치 추구, 수익 창출을 경영이념으로 삼고, 국내·외 다양한 스포츠 종목의 협회, 단체 등과 협력관계를 구축하여 엘리트 분야뿐 아니라 생활체육 분야에 이르기까지 스포츠 인구의 저변 확대에 기여하겠습니다.\\n...\\nPT.\\nNassau Sport Indonesia\\n...\\n> 사업영역\\n취급품목\\n테니스공, 배구공, 축구공, 풋살공\\n글로벌네크워크\\n북미, 남미, 유럽, 아시아\"},{\"url\":\"https://isplus.com/article/view/isp202610190209\",\"title\":\"낫소, 이동형 스크린 파크골프 부스 선봬…공공·복지시설 ...\",\"publisher\":\"isplus.com\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"스크린파크골프 부스 (기사의 이해를 돕기 위한 생성형 이미지)\\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설 등을 대상으로 사업 확대에 나섰다.\\n낫소는 기존 실내 공간을 활용해 지역 주민과 시니어 등이 파크골프를 체험할 수 있도록 이동형 스크린 파크골프 부스를 개발했다고 밝혔다.\\n...\\n다양한 코스와 연습 콘텐츠도 제공한다.\\n...\\n1971년 창립해 올해 55주년을 맞은 낫소는 축구공과 배구공, 테니스공 등 다양한 스포츠용품을 개발·생산해 왔다.\\n해외 생산시설을 기반으로 스포츠용품 제조·수출 사업을 전개하며 제품 개발 경험을 축적해 왔다.\\n최근에는 축구·테니스·배구 등 기존 스포츠 분야에서 피클볼과 파크골프 등 생활스포츠 분야로 사업 영역을 확대하고 있다.\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 고화질 그래픽과 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 적용한 것이 특징”이라며 “공공·복지시설의 상시 생활체육 프로그램은 물론 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획”이라고 밝혔다.\"},{\"url\":\"https://www.incruit.com/company/1683636837/\",\"title\":\"2026년 낫소 채용 기업정보 - 인크루트\",\"publisher\":\"incruit.com\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"- *사업내용 : 운동구제조\\n무역업\\n*\\n...\\n- **기업규모** 중소기업\\n- **대표자** 주은형,김성식,주은형\\n...\\n- **업종** 고무·플라스틱\\n...\\n### 기업위치\\n...\\n- 홈페이지 : http://www.nassau.co.kr\"},{\"url\":\"https://app.rndcircle.io/company/3fae70b0-aacf-5bf4-b15e-a88b7f2f5a6a\",\"title\":\"(주)낫소 기업 정보 | RnDcircle | 디써클\",\"publisher\":\"app.rndcircle.io\",\"publishedAt\":\"2026-09-17\",\"snippet\":\"(주)낫소는 1971년 설립된 대한민국을 대표하는 종합 스포츠용품 전문 제조 기업입니다.\\n반세기에 걸쳐 축적된 독자적인 기술력과 노하우를 바탕으로 테니스공, 축구공, 배구공, 농구공 등 다양한 구기 종목의 용품을 생산하고 있습니다.\\n...\\n핵심 사업: 구기 용품 제조 및 유통\\n(주)낫소의 핵심 비즈니스는 테니스공을 필두로 한 축구공, 농구공, 배구공 등 다양한 구기 용품의 자체 개발, 생산 및 판매입니다.\\n자체 브랜드 '낫소(Nassau)'를 통해 국내외 시장에 제품을 공급하며, 공식 온라인 쇼핑몰을 통한 B2C 판매와 대리점 및 유통업체를 통한 B2B 판매를 병행하고 있습니다.\\n...\\n회사의 주력 제품으로, 대한테니스협회(KTA) 공식 사용구로 30년 이상 사용되며 국내 시장에서 독보적인 입지를 구축했습니다.\\n대표 모델인 '낫소 챔피언십'은 뛰어난 내구성과 일관된 바운스로 동호인부터 엘리트 선수까지 폭넓게 사용됩니다.\"},{\"url\":\"https://m.jobkorea.co.kr/company/43575847\",\"title\":\"낫소 2026년 기업정보 - 직원수, 근무환경, 복리후생 등 - 잡코리아\",\"publisher\":\"m.jobkorea.co.kr\",\"publishedAt\":\"2022-04-19\",\"snippet\":\"대표자\\n주은형\\n주요사업\\n스포츠용품 제조\\n...\\n홈페이지\\nhttp://www.nassau.co.kr\"},{\"url\":\"https://www.innoforest.co.kr/company/CP00017276/%EB%82%AB%EC%86%8C\",\"title\":\"낫소 | 기업정보(매출·투자·고용) - 혁신의숲(InnoForest)\",\"publisher\":\"innoforest.co.kr\",\"publishedAt\":\"2025-01-01\",\"snippet\":\"## 기본정보 및 요약 데이터\\n기업소개\\n낫소는 대한민국 스포츠 파워 DNA를 바탕으로 다양한 구기 종목에 사용되는 용품을 제조 및 판매하는 기업입니다.\\n이 회사는 KFA APPROVED 축구공을 비롯하여 농구공, 테니스볼, 피클볼 세트 등 다양한 스포츠 장비를 공급하고 있습니다.\\n주요 제품은 소비자 대상의 Vertical-Commerce 형태로 온라인에서 판매되고 있으며, 피클볼 라인 등 신규 카테고리 확장 노력을 보이고 있습니다.\\n...\\n스포츠 용품 제조, KFA APPROVED, Vertical Commerce\\n...\\n홈페이지http://nassau.co.kr\"},{\"url\":\"https://biz.chosun.com/industry/business_info/2026/10/19/Z3NE4YGXYRBAXDPQPZ666WZPSU/\",\"title\":\"낫소, 체형별 맞춤형 파크골프채 출시… 생활스포츠 사업 확대\",\"publisher\":\"biz.chosun.com\",\"publishedAt\":\"2026-10-19\",\"snippet\":\"# 낫소, 체형별 맞춤형 파크골프채 출시… 생활스포츠 사업 확대\\n스포츠용품 전문기업 낫소가 사용자의 신장과 체형에 맞춰 선택할 수 있는 맞춤형 파크골프채 '페룬 맥스 3'를 선보였다.\\n...\\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업이다.\\n축구공·배구공·테니스공 등 다양한 스포츠용품을 개발·생산하며 국내외 시장에서 사업을 이어왔다.\\n해외 생산시설을 기반으로 스포츠용품 제조와 수출 사업을 전개하고 있으며, 축적한 제품 개발 경험과 제조 기술을 바탕으로 제품 경쟁력 강화에 나서고 있다.\\n기존 축구·테니스·배구 등 전통 스포츠 중심의 사업에서 피클볼·파크골프 등 생활스포츠 분야로 영역을 확대하고 있다.\\n맞춤형 파크골프채 역시 이러한 사업 다각화 전략의 일환이다.\\n...\\n낫소는 맞춤형 파크골프채와 더불어 첨단 ICT 기술을 결합한 '이동형 스크린 파크골프 부스' 사업도 함께 추진 중이다.\"},{\"url\":\"https://www.asiatoday.co.kr/kn/view.php?key=20260730010011411\",\"title\":\"반세기 기술력으로 세계 무대 누비는 낫소… K-스포츠 브랜드 ...\",\"publisher\":\"asiatoday.co.kr\",\"publishedAt\":\"2026-07-30\",\"snippet\":\"국내 스포츠용품 전문기업 낫소(NASSAU)가 50년이 넘는 기술력과 제조 경쟁력을 앞세워 글로벌 시장 공략에 속도를 내고 있다.\\n축구공과 테니스공, 배구공 등 다양한 스포츠용품을 생산하는 낫소는 해외 생산기지와 수출망을 기반으로 대한민국 스포츠 브랜드의 경쟁력을 세계 시장에 알리고 있다.1971년 설립된 낫소는 축구공과 풋살공, 테니스공, 배구공을 비롯해 농구공과 족구공, 라켓, 유니폼, 각종 경기·훈련용품 등을 생산하며 전문체육과 생활체육, 학교체육 현장에 제품을 공급해왔다.\\n...\\n낫소 테니스공은 1986 서울아시안게임과 1988 서울올림픽 공식 사용구로 선정됐으며, 1988년부터 1990년까지는 세계 4대 테니스대회 가운데 하나인 호주오픈 공식 사용구로 채택됐다.\\n...\\n직접 운영하는 인도네시아 생산공장을 중심으로 생산과 품질관리, 포장, 해외 공급을 일원화했으며, 이를 통해 글로벌 거래처에 안정적으로 제품을 공급하고 있다.\\n미국 타치카라와 프랭클린의 배구공, 스페인 불패델과 미국 솔린코의 테니스공 등 해외 스포츠 브랜드 제품도 이 공장에서 생산하며 제조 경쟁력을 인정받고 있다.자체 브랜드를 앞세운 해외시장 확대도 이어지고 있다.\\n낫소는 프랑스와 싱가포르, 이스라엘, 핀란드 등 다양한 국가에 자체 브랜드 스포츠용품을 수출하고 있다.\\n아르헨티나에서는 약 35년간 현지 파트너와 협력 관계를 유지하며 브랜드 입지를 다져왔다.\\n높은 해외 매출 비중을 바탕으로 글로벌 스포츠용품 기업으로 성장세를 이어간다는 전략이다.글로벌 사업 확대와 함께 스포츠를 통한 사회적 가치 실현에도 힘을 보태고 있다.\\n기아대책 호프컵과 스페셜올림픽코리아 등 유소년·장애인 스포츠 지원 사업에 참여하며 스포츠 저변 확대에도 나서고 있다.\"},{\"url\":\"https://www.hankookilbo.com/news/article/A2026102109320004879\",\"title\":\"낫소, 체형별 맞춤형 파크골프채 선보여…생활스포츠 사업 확대\",\"publisher\":\"hankookilbo.com\",\"publishedAt\":\"2026-10-21\",\"snippet\":\"스포츠용품 전문기업 낫소가 사용자의 신장과 체형에 맞춰 선택할 수 있는 파크골프채 ‘페룬 맥스 3’를 선보이며 파크골프 시장 공략에 나섰다.\\n이용자의 신체 조건에 적합한 클럽을 선택할 수 있도록 설계해 스윙 편의성과 안정성을 고려한 것이 특징이다.\\n...\\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업으로, 축구공과 배구공, 테니스공 등 다양한 스포츠용품을 개발·생산해 왔다.\\n해외 생산시설을 기반으로 제조 및 수출 사업을 전개하고 있으며, 최근에는 기존 구기 종목에서 피클볼과 파크골프 등 생활스포츠 분야로 사업 영역을 확대하고 있다.\\n이와 함께 이동형 스크린 파크골프 부스 사업도 추진 중이다.\\n해당 부스는 무용접 조립 방식의 조인트 구조를 적용해 설치와 해체, 이동이 용이하도록 설계했다.\\n...\\n이동형 부스는 지자체 주민복지시설과 체육시설, 주민센터, 마을회관 등에서 생활체육 프로그램으로 활용할 수 있도록 개발됐다.\"},{\"url\":\"https://www.nassau.co.kr/\",\"title\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n## 베스트 상품\\n### 입금계좌안내\\n#### 배송안내\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://www.saramin.co.kr/zf_user/company-info/view/csn/R05qbmlWK1FZS1creU5hMFlFVVQwdz09/company_nm/(%EC%A3%BC)%EB%82%AB%EC%86%8C\",\"title\":\"(주)낫소 2025년 기업정보 | 직원수, 매출액, 복리후생 등 - 사람인\",\"publisher\":\"saramin.co.kr\",\"publishedAt\":\"2025-05-09\",\"snippet\":\"- 기타 운동 및 경기용구 제조업\\n...\\n- 사업내용\\n스포츠용품 제조\\n...\\n낫소는 1971년11월 설립한 50년 역사의 한국 토종브랜드로서 축구공, 배구공, 테니스공, 농구공을 포함한 다양한 스포츠용품을 생산, 판매하고 있습니다.\"},{\"url\":\"https://www.nassau.co.kr/cs/partner.asp\",\"title\":\"제휴/도매문의 - 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-28\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\"},{\"url\":\"https://www.mygoyang.com/news/articleView.html?idxno=49924\",\"title\":\"“글로벌 스포츠브랜드와 겨루는 꿈, 현실로 만들 것”\",\"publisher\":\"mygoyang.com\",\"publishedAt\":\"2019-02-23\",\"snippet\":\"전 세계 21개 국가에 스포츠 용품을 수출할 수 있는 네크워크를 구축했고, 3년 후엔 국내 스포츠기업으로는 최초로 주식시장 상장을 목표로, 장기적으로는 스포츠용품과 헬스케어를 접목한 스포테인먼트 기술 플랫폼 공유기업을 비전으로 설정하고 있다.\\n...\\n**낫소의 주력 상품 분야는 무엇인가.\\n**\\n70여 가지의 제품이 있지만 주력은 당연히 축구공이다.\\n테니스공, 배구공도 있고, 최근 족구공과 족구화도 새로 개발했다.\\n대한축구협회뿐 아니라 9개 시·도축구협회와도 후원 협약을 맺었다.\\n...\\n가장 탁월한 것은 축구공 제조기술력이다.\\n47년 동안 축구공을 만들어온 땀과 노력 그리고 노하우가 우리 연구소에 축적되어 있다.\\n그 결과 세계 최초로 4패널 시스템 공법이 적용된 공을 개발했다.\\n...\\n다른 하나는 국내 브랜드로서는 유일하게 수출을 하고 있다는 점이다.\\n...\\n현재 해외 21개 국가에 수출하고 있는데 올해 안에 25개국으로 늘려 매출도 300만불을 넘길 것으로 보고 있다.\\n...\\n낫소는 장기적으로 스포테인먼트 기업이 되는 것을 목표로 하고 있다.\\n기존 용품사업과 더불어 앞으로 스포츠 의류사업을 복구하고 헬스케어 사업부문을 추가할 예정이다.\\n헬스케어 분야는 가장 혁신이 많이 일어날 수 있는 사업영역이다.\\n테이핑, 마스크, 기능성 패치, 단백질 파우더 등 건강과 체력증진에 좋은 상품 개발을 위해 바이오 기업과 기술 협약을 맺어 혁신적인 제품을 선보일 것이다.\"},{\"url\":\"https://www.mt.co.kr/future/2023/06/30/2023063014362764382\",\"title\":\"50년 역사 토종 브랜드 '낫소', 실물·가상 패션 브랜드 선보인다\",\"publisher\":\"mt.co.kr\",\"publishedAt\":\"2023-06-30\",\"snippet\":\"메타버스·NFT(대체불가능토큰) 기술 기업 트레져랩스가 국내 스포츠 브랜드 '낫소(Nassau)'와 손잡고 메타버스 패션 전문 브랜드를 공동 출시한다고 30일 밝혔다.\\n양측은 이번 협업을 통해 실물 제품은 물론 메타버스 플랫폼 '파라리움(PARARIUM)' 내에서 아바타 의류를 경험할 수 있는 패션 컬렉션을 선보일 예정이다.\\n...\\n낫소는 50년의 역사를 자랑하는 토종 브랜드다.\\n내구성이 뛰어난 다양한 스포츠 용품을 발매하며 대한민국 대표 스포츠 브랜드로 사랑받고 있다.\\n대한축구협회(KFA) 공식 시합구 등 각종 국제협회의 공인 획득을 통해 제품의 우수성을 입증했다.\\n낫소는 최근 MZ세대를 겨냥한 마케팅에 공을 들이고 있다.\\n무신사를 통해 더블유캔버스와 함께 '낫소1971' 스포츠캐주얼 브랜드를 출시했으며, 카카오프렌즈 캐릭터를 활용한 카카오 스포츠 용품 라인업도 선보였다.\"},{\"url\":\"https://nassau.co.kr/cs/faq.asp\",\"title\":\"고객센터\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-03\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://nassau.co.kr/cs/news.asp\",\"title\":\"고객센터\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-03\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://nassau.co.kr/product/list.asp?code3=5127\",\"title\":\"테니스라켓\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-09-25\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\"},{\"url\":\"http://nassau.co.kr/intro/?act=04\",\"title\":\"낫소 쇼핑몰\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-14\",\"snippet\":\"저희는 회사 비전을 달성하기 위해 기업다운 기업, 직원과 파트너와의 동반 성장, 최고의 가치 추구, 수익 창출을 경영이념으로 삼고, 국내·외 다양한 스포츠 종목의 협회, 단체 등과 협력관계를 구축하여 엘리트 분야뿐 아니라 생활체육 분야에 이르기까지 스포츠 인구의 저변 확대에 기여하겠습니다.\\n...\\n회사소개\\n화사명\\nPT.\\nNassau Sport Indonesia\\n...\\n설립연월\\n1989년 10월\\n대표이사\\n...\\n사업영역\\n취급품목\\n테니스공, 배구공, 축구공, 풋살공\\n글로벌네크워크\\n북미, 남미, 유럽, 아시아\"},{\"url\":\"https://nassau.co.kr/product/detail.asp?code2=5113&code3=0&seq=19041\",\"title\":\"티볼 공 1개입(9인치)\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\\n...\\n1577-4580\\n...\\n주소\\n경기도 고양시 덕양구 보광로106번길 42 (벽제동) (주)낫소\"},{\"url\":\"https://nassau.co.kr/en/intro.asp?act=06\",\"title\":\"낫소 쇼핑몰\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-10-08\",\"snippet\":\"# COMPANY INTRODUCTION\\nNassau, Korea's home grown sporting goods brand, was established on November 16th, 1971 and has been walking together with the sports industry for the last fifty years.\\n...\\nOur continuous technology development and good quality have enabled us to gain approval by world-renowned sports federations such as International Tennis Federation(ITF), Federation Internationale de Volleyball(FIVB), International Handball Federation(IHF), Federation Internationale de Football Association(FIFA) and Korea Football Association(KFA) and to do years' sponsorship to KFA.\\n...\\nOur mission is to become a total sporting goods company to realize happy lives through sports and leisure.\\n...\\n1. Do our best to distribute and expand sporting activities by establishing reliable partnership with sporting federations and clubs in soccer, tennis and other sports.\\n...\\nTennis balls, padel balls and volleyballs\"},{\"url\":\"http://www.nassau.co.kr/files/pdf/2023_nassau_diary_catalog_kr.pdf\",\"title\":\"홈페이지 QR코드\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2024-09-28\",\"snippet\":\"주식회사 낫소\\nwww.nassau.co.kr\\nE-mail.sales@nassau.co.kr\\nT.1577-4580   Fax. 032-326-2570\\n경기도 고양시 덕양구 보광로 106번길 42 낫소빌딩\\n...\\nwww.nassau.co.kr / www.nassaushop.com\\n...\\n- SOCCER \\n- TENNIS \\n- JOKGU\\n- BASKETBALL \\n- VOLLEYBALL \\n- OTHERS \\n- NEW SPORTS\\n- UNIFORM\\n2023 NASSAU SPORTING GOODS\\nNow, Sports For Life\\nSPORTING GOODS\\nKorea No.1 Sports Brand\\nSince 1971\\nSPORTING GOODS\\n...\\n투지 프리미엄에는 1971년에 설립한 대한민국 대표 스포츠 브랜드 낫소의 50여년 오랜 기술과 노하우가 스며들어 있습니다.\"},{\"url\":\"https://fashionbiz.co.kr/article/119901\",\"title\":\"낫소, 스포츠 서브라이선스모집\",\"publisher\":\"fashionbiz.co.kr\",\"publishedAt\":\"2010-10-14\",\"snippet\":\"정통 스포츠용품 토종기업 낫소(대표 이태영 www.nassau.co.kr)가 「낫소(NASSAU)」브랜드로 스포츠 골프 아웃도어 등 브랜드를 전개할 서브라이선스 업체를 찾는다.\\n이 회사는 라이선스 전개를 통해 스포츠용품에서 의류를 포함한 토털 스포츠패션메이커로의 도약을 추진, 건실한 중소 패션기업중 생산 기반을 갖춘 스포츠웨어 업체의 라이선스 참여를 희망하고 있다.\\n...\\n낫소는 지난 1969년 출범해 40여년간 전문 스포츠 용품 회사로 활약, 국제 테니스 연맹(ITF), 국제배구연맹(FIVB), 국제핸드볼연맹(IHF), 국제축구연맹(FIFA), 대한축구협회(KFA) 공인 획득을 통해 테니스 축구 핸드볼 배구 등 부문에서 86아시안 게임 공식 사용구로 지정받은바 있으며 테니스볼의 경우 88올림픽공식구로 지정받기도.\\n또 세계 4대 그랜드스램 국제테니스대회인 호주오픈 공식사용구등 제품의 우수성을 세계에 알리는 기업으로 성장해 왔다.\\n낫소는 글로벌 낫소(NASSAU)를 향해 끊임없는 기술개발과 해외 우수 생산기지 구축등 적극적인 사업영역 확대와 투자로 전세계 40여개국에 대리점 체제를 구축하고 있다.\\n「낫소(NASSAU)」는 바하마 군도의 캐피탈(Capital Name)이며 네덜란드 황족 칭호였다.\\n유럽과 미국에는 나소 스트릿, 낫소 하우스, 낫소 컨트리등 고품격의 지명이 여러곳 있으며미국 뉴욕의 넘버원 하이웨이 이름이 낫소 하이웨이 이기도 해 고품격의 브랜드 인지도를 갖추고 있다.\"},{\"url\":\"https://blog.naver.com/dowoninfna/221972064111\",\"title\":\"상표이야기(634) : 낫소(NASSAU) 스포츠브랜드\",\"publisher\":\"blog.naver.com\",\"publishedAt\":\"2020-05-20\",\"snippet\":\"회사 홈피 : www.nassau.co.kr\\nWe are Korea's leading sporting goods manufacturer with a history of 50 years.\\nlearn more\\n...\\n1971년 설립된 낫소는 이름 탓에 일본 브랜드라는 오해를 받기도 했지만 토종이다.축구공 테니스공 등 스포츠용품을 제조하며 성장했다.\\n...\\n낫소는 한때 56개국으로 수출할 정도로 ‘잘나가던’ 토종 강소기업이었다.\\n...\\n주 대표는 “50년 가까이 만든 축구공은 노하우가 우리 연구소에 축적돼 있다”며 “그 결과 세계 최초로 4패널(조각) 시스템 공법이 적용된 공을 개발했다”고 소개했다.\\n...\\n낫소는 어려운 가운데 제3세계에 대한 지원을 아끼지 않고 있다.\\n2020 도쿄올림픽에 출전한 남수단 선수단에 단복, 유니폼 등 스포츠용품을 지원했고, 현재까지도 도움의 손길을 이어가고 있다.\\n...\\n주 대표는 사업 다각화에 나서겠다는 포부를 밝혔다.\\n그는 “카카오와 손을 잡고 캐릭터를 활용한 스포츠용품을 제작하고 있다”며 “스포츠 에어돔(공기 압력을 이용한 기둥 없는 실내 구조물), 의류 등으로 사업 영역을 확장하고 있고, 골프장 로봇 캐디 개발에도 투자하고 있다”고 말했다.\"},{\"url\":\"https://namu.wiki/w/%EB%82%AB%EC%86%8C(%EA%B8%B0%EC%97%85)?uuid=4e6ac24a-dec7-421a-a6ad-7787f9557fbe\",\"title\":\"낫소(기업) (r38 판)\",\"publisher\":\"namu.wiki\",\"publishedAt\":\"2021-02-26\",\"snippet\":\"|주식회사 낫소|주식회사 낫소|\\n|--|--|\\n|**설립일**|1971년|\\n|**국가**|대한민국|\\n|**분야**|스포츠용품 제조|\\n| … | … |\\n|**홈페이지**|http://www.nassau.co.kr/|\\n...\\nNassau는 대한민국의 스포츠용품 브랜드이다.\\n한때 **세계 4대 테니스공 메이커** 였으며, 주로 축구공, 테니스공, 농구공등을 생산하며 저가 의류에서도 이 브랜드를 볼 수 있다.\\n...\\n1971년에 세방물산이란 이름으로 설립되어 1978년 이 이름으로 회사 이름을 변경했다.\\n...\\n세계 메이저 브랜드 Wilson (미국), Babolat (프랑스), Head (오스트리아)의 테니스볼을 국내와 낫소 인도네시아 공장에서 OEM 및 ODM 생산한 적이 있다.\\n축구 부분에선 한국 최초로 칼라와 라텍스소재를 사용한 '칼라 라텍스 축구공' 돌파 태극 21을 개발 및 생산했다.\\n주로 공을 주력으로 만들어내고 있는데, 테니스 그랜드 슬램인 호주 오픈 공인구로 88년 낫소 테니스 공이 지정된 바 있다.\\n...\\n축구공 '투지' 역시 현재 FA컵과 K3리그, U리그, 초중고 주말리그 공인구로 사용되고 있으며, 아마추어 레벨에서 쓰기엔 아디다스와 나이키 공보다 내구성이나 가성비면에서 더 훌륭하다는 평을 받고 있다.\\n그 외 운동화도 가성비가 좋다는 평을 받고 있다.\\n또한 각종 패딩도 만들고 있다.\"},{\"url\":\"https://nassau.co.kr/en/cs_news.asp?act=view&idx=104404&keyword=&field=&page=3\",\"title\":\"pr center - Nassau Shopping Mall - Korea's leading sports brand\",\"publisher\":\"nassau.co.kr\",\"publishedAt\":\"2026-09-17\",\"snippet\":\"# PR CENTER\\n## NEWS\\n|Content|June 23, 2022Reporter: Woo Choong-won, OSEN Nassau Co., Ltd., a leading Korean sports brand, has announced a collaboration with Kakao Friends to launch a new line of co-branded products in the second half of 2022.\\nBy integrating Kakao Friends characters into its lineup of sports equipment, Nassau aims to increase its accessibility and appeal, particularly among MZ generation consumers and female customers.\\nSince its founding in 1971, Nassau has built a solid reputation in Korea’s sports industry.\\nThe company became the official match ball provider for the 1986 Asian Games and supplied tennis balls for the 1988 Seoul Olympics.\\nFrom 1993 onward, Nassau served as the official match ball partner for the Korea Football Association for three decades, solidifying its reputation for product excellence.\\nNow, Nassau is preparing for the future with a focus on sports technology, developing innovations such as its digital football training machine “Dr. Cannon” and eco-friendly sports airdomes.\"}],\"llmUsage\":{\"promptTokens\":1263,\"completionTokens\":747,\"totalTokens\":2010,\"estimatedCostUsd\":0.02}}","started_at":"2026-10-28T09:00:24.159Z","finished_at":"2026-10-28T09:01:37.252Z","error":null},{"id":"fbfb39dc-96e8-4837-9552-b97ba137cfb1","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S7","status":"completed","output_json":"{\"titleCandidates\":[\"낫소, 4K 이동형 스크린 파크골프로 공공 생활체육시장 공략\",\"낫소, 정밀센서·무용접 부스로 지자체 파크골프 수요 선점\",\"창립 55주년 낫소, 스크린 파크골프로 시니어 스포츠 확장\"],\"title\":\"낫소, 4K 이동형 스크린 파크골프로 공공 생활체육시장 공략\",\"subtitle\":\"언리얼 엔진 5.1과 하이스피드 카메라로 구현한 실감형 가상 필드\\n간편한 설치·철거를 앞세운 지자체·복지시설 중심 시장 확대\",\"body\":\"스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다. 기존 실내 공간을 활용해 지역 주민과 시니어에게 새로운 생활체육 환경을 제공할 수 있도록 기획한 제품이다.\\n\\n특히 2 비전 하이스피드 카메라 센서를 적용해 타격 순간 볼의 움직임을 빠르고 정밀하게 감지하고, 이를 스크린 속 가상 필드에 반영하도록 설계했다. 부스의 기본 골격은 용접 없이 부재를 연결하고 분해할 수 있는 무용접 조인트 결합 방식으로 설계해 설치와 철거 과정을 간소화했다.\\n\\n이번 부스는 언리얼 엔진 5.1 기반의 4K UHD 고화질 그래픽을 적용해 선명하고 생동감 있는 가상 필드를 구현하도록 설계됐다. 다양한 코스와 연습 콘텐츠를 제공해 입문자의 기초 연습부터 기존 이용자의 게임과 친선경기까지 폭넓게 활용할 수 있다.\\n\\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업으로, 축구공·배구공·테니스공 등 다양한 스포츠용품을 개발 및 생산해 왔다.\\n\\n관련 스크린 파크골프 및 생활체육 시스템 시장에서도 주요 기업과 브랜드들의 영역 확장 경쟁이 치열하게 전개되고 있다. 골프존(GDR·파크골프)의 경우 기존 스크린골프에서 축적한 고정밀 센서와 코스 그래픽 기술을 바탕으로 지자체 및 커뮤니티 시설 대상 실내 파크골프 시뮬레이터 보급을 확대하고 있다. 카카오VX의 경우 직관적인 사용자 인터페이스(UI)와 생활체육 플랫폼 연동 기능을 앞세워 공공 체육시설 및 시니어 특화 스크린 스포츠 시장 공략에 속도를 내고 있다. 마실파크골프·SGP 등 전용 시뮬레이터 업계의 경우 전국 지자체 경로당·주민복지관 등 도심 내 실내 체육 공간 조성을 겨냥해 실감형 파크골프 설비와 구장 프랜차이즈 보급 경쟁을 벌이고 있다.\\n\\n기존 스크린 파크골프 업체들이 주로 대규모 전용 매장이나 고정식 인테리어 시공 방식으로 시장을 넓혀왔다면, ㈜낫소는 화면·센서·타석·외부 프레임을 하나로 묶은 일체형 이동식 부스 설계로 차별화를 꾀했다. 별도의 대규모 공사 없이 주민복지시설이나 기관 유휴 공간에 1부스 단위로 즉시 배치할 수 있어, 공간 제약과 초기 설치 부담을 줄이려는 지자체·공공기관 수요를 집중 공략한다는 전략이다.\\n\\n낫소 관계자는 “이동형 스크린 파크골프 부스는 실감 나는 플레이 환경과 설치·철거 편의성을 함께 고려한 제품”이라며 “앞으로도 지자체와 주민복지시설 등 다양한 공간에서 활용할 수 있는 생활체육 환경을 제공하고, 지역 주민들의 스포츠 참여 기회를 확대해 나가겠다”라고 밝혔다.\",\"styleEdits\":[]}","started_at":"2026-10-28T09:01:37.254Z","finished_at":"2026-10-28T09:01:37.255Z","error":null},{"id":"e391c296-b4b8-4911-8010-4ceadf730279","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S8","status":"completed","output_json":"{\"verdict\":\"PASS\",\"warnings\":[],\"normalizedCaptions\":[\"스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보인다. [제공=낫소]\"]}","started_at":"2026-10-28T09:01:37.256Z","finished_at":"2026-10-28T09:01:37.269Z","error":null},{"id":"d5079a19-1ae0-4c56-8d7c-8f6a42bc854c","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S9","status":"completed","output_json":"{\"hardRuleFindings\":[],\"naverChecklist\":[{\"code\":\"A\",\"name\":\"허위사실 판결 예방 (팩트체크·증빙)\",\"penalty\":\"2점\",\"status\":\"PASS\",\"detail\":\"Claim Ledger 기반 사실 주장 분류 및 출처 대조 완료\"},{\"code\":\"B\",\"name\":\"과장·왜곡·오인 유발 표현 점검\",\"penalty\":\"0.5점\",\"status\":\"PASS\",\"detail\":\"무근거 최상급·과장 표현 필터링 완료\"},{\"code\":\"C\",\"name\":\"작성자 식별 정보(바이라인) 확인\",\"penalty\":\"1~4점\",\"status\":\"PASS\",\"detail\":\"바이라인 설정됨 (이경섭 기자)\"},{\"code\":\"D\",\"name\":\"AI 활용 표시 옵션\",\"penalty\":\"0.5점\",\"status\":\"WARN\",\"detail\":\"AI 활용 고지 문구 미포함 (하단 옵션에서 on/off 가능)\"},{\"code\":\"J\",\"name\":\"중복·유사 기사 재전송 방지\",\"penalty\":\"1.5점\",\"status\":\"PASS\",\"detail\":\"포털 게재 현황 점검 및 제목 차별화 반영\"},{\"code\":\"K/L\",\"name\":\"낚시성 제목·키워드 남용 방지\",\"penalty\":\"0.5~2점\ ","published_at":"2026-10-22","snippet":"-언리얼 엔진 5.1 기반 4K UHD 그래픽·하이스피드 카메라 센서 적용\n-무용접 조인트 방식으로 설치·철거 편의성 강화…공공시설·순회형 행사 활용 겨냥\n스크린파크골프 부스 (기사의 이해를 돕기 위한 생성형 이미지)\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설 등을 대상으로 사업 확대에 나섰다.\n낫소는 기존 실내 공간을 활용해 지역 주민과 시니어 등이 파크골프를 체험할 수 있도록 이동형 스크린 파크골프 부스를 개발했다고 밝혔다.\n이번 부스에는 언리얼 엔진 5.1(Unreal Engine 5.1) 기반의 4K UHD 그래픽을 적용했다.\n가상 필드와 코스 풍경을 고화질로 구현해 실내에서도 파크골프를 체험할 수 있도록 구성했다.\n...\n볼 움직임을 감지하는 ‘2 비전 하이스피드 카메라 센서’도 적용했다.\n회사 측에 따르면 타격 순간 공의 움직임을 감지한 뒤 센서 데이터를 분석해 스크린 속 가상 필드에 반영하는 방식이다.\n고성능 시스템을 함께 적용해 센서 데이터와 그래픽을 처리하고 실제 타격 결과가 화면 속 플레이로 이어지도록 구성했다.\n설치 구조에는 이동성과 재설치를 고려한 무용접 조인트(Joint) 결합 방식을 적용했다.\n부스 기본 골격을 용접하지 않고 부재끼리 연결하거나 분해할 수 있도록 설계해 설치와 철거 과정을 간소화했다.\n...\n낫소 관계자는 “이동형 스크린 파크골프 부스는 고화질 그래픽과 센서 기술뿐 아니라 설치와 철거가 편리한 무용접 조립 구조를 적용한 것이 특징”이라며 “공공·복지시설의 상시 생활체육 프로그램은 물론 지역 행사와 이동형 체험 프로그램에도 활용할 수 있도록 사업을 확대해 나갈 계획”이라고 밝혔다.","used_for":"dedupe_check"},{"id":"e1dee115-f816-42db-8dc1-5fa3b19328d7","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S1","url":"https://www.mk.co.kr/news/all/12181548","title":"낫소, 생활체육 접근성 높인다… 이동형 스크린 파크골프 부스 출사표 - 매일경제","publisher":"mk.co.kr","published_at":"2026-10-21","snippet":"## 낫소, 생활체육 접근성 높인다… 이동형 스크린 파크골프 부스 출사표\n### 최은화 기자\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보인다.\n[제공=낫소]\n스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다.\n기존 실내 공간을 활용해 지역 주민과 시니어에게 새로운 생활체육 환경을 제공할 수 있도록 기획한 제품이다.\n이번 부스는 언리얼 엔진 5.1(Unreal Engine 5.1) 기반의 4K UHD 고화질 그래픽을 적용해 선명하고 생동감 있는 가상 필드를 구현하도록 설계됐다.\n...\n특히 2 비전 하이스피드 카메라 센서를 적용해 타격 순간 볼의 움직임을 빠르고 정밀하게 감지하고, 이를 스크린 속 가상 필드에 반영하도록 설계했다.\n여기에 고성능 시스템을 결합해 센서 데이터와 고화질 그래픽을 신속하게 처리함으로써 자연스럽고 몰입감 있는 플레이 환경을 제공한다.\n...\n부스의 기본 골격은 용접 없이 부재를 연결하고 분해할 수 있는 무용접 조인트(Joint) 결합 방식으로 설계해 설치와 철거 과정을 간소화하고 이동 및 재설치 편의성을 높였다.","used_for":"dedupe_check"},{"id":"4acea7df-ce87-4a69-b3d7-ae090fb88178","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S1","url":"  낫소(NASSAU)가 50년이 넘는 기술력과 제조 경쟁력을 앞세워 글로벌 시장 공략에 속도를 내고 있다.\n축구공과 테니스공, 배구공 등 다양한 스포츠용품을 생산하는 낫소는 해외 생산기지와 수출망을 기반으로 대한민국 스포츠 브랜드의 경쟁력을 세계 시장에 알리고 있다.1971년 설립된 낫소는 축구공과 풋살공, 테니스공, 배구공을 비롯해 농구공과 족구공, 라켓, 유니폼, 각종 경기·훈련용품 등을 생산하며 전문체육과 생활체육, 학교체육 현장에 제품을 공급해왔다.\n...\n낫소 테니스공은 1986 서울아시안게임과 1988 서울올림픽 공식 사용구로 선정됐으며, 1988년부터 1990년까지는 세계 4대 테니스대회 가운데 하나인 호주오픈 공식 사용구로 채택됐다.\n...\n직접 운영하는 인도네시아 생산공장을 중심으로 생산과 품질관리, 포장, 해외 공급을 일원화했으며, 이를 통해 글로벌 거래처에 안정적으로 제품을 공급하고 있다.\n미국 타치카라와 프랭클린의 배구공, 스페인 불패델과 미국 솔린코의 테니스공 등 해외 스포츠 브랜드 제품도 이 공장에서 생산하며 제조 경쟁력을 인정받고 있다.자체 브랜드를 앞세운 해외시장 확대도 이어지고 있다.\n낫소는 프랑스와 싱가포르, 이스라엘, 핀란드 등 다양한 국가에 자체 브랜드 스포츠용품을 수출하고 있다.\n아르헨티나에서는 약 35년간 현지 파트너와 협력 관계를 유지하며 브랜드 입지를 다져왔다.\n높은 해외 매출 비중을 바탕으로 글로벌 스포츠용품 기업으로 성장세를 이어간다는 전략이다.글로벌 사업 확대와 함께 스포츠를 통한 사회적 가치 실현에도 힘을 보태고 있다.\n기아대책 호프컵과 스페셜올림픽코리아 등 유소년·장애인 스포츠 지원 사업에 참여하며 스포츠 저변 확대에도 나서고 있다.","used_for":"company_verification"},{"id":"817df539-eeec-4f31-8cb9-8e088d20653e","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S2","url":"https://www.hankookilbo.com/news/article/A2026102109320004879","title":"낫소, 체형별 맞춤형 파크골프채 선보여…생활스포츠 사업 확대","publisher":"hankookilbo.com","published_at":"2026-10-21","snippet":"스포츠용품 전문기업 낫소가 사용자의 신장과 체형에 맞춰 선택할 수 있는 파크골프채 ‘페룬 맥스 3’를 선보이며 파크골프 시장 공략에 나섰다.\n이용자의 신체 조건에 적합한 클럽을 선택할 수 있도록 설계해 스윙 편의성과 안정성을 고려한 것이 특징이다.\n...\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업으로, 축구공과 배구공, 테니스공 등 다양한 스포츠용품을 개발·생산해 왔다.\n해외 생산시설을 기반으로 제조 및 수출 사업을 전개하고 있으며, 최근에는 기존 구기 종목에서 피클볼과 파크골프 등 생활스포츠 분야로 사업 영역을 확대하고 있다.\n이와 함께 이동형 스크린 파크골프 부스 사업도 추진 중이다.\n해당 부스는 무용접 조립 방식의 조인트 구조를 적용해 설치와 해체, 이동이 용이하도록 설계했다.\n...\n이동형 부스는 지자체 주민복지시설과 체육시설, 주민센터, 마을회관 등에서 생활체육 프로그램으로 활용할 수 있도록 개발됐다.","used_for":"company_verification"},{"id":"e7a17070-8f6d-4bcf-97d9-c476bcf7c74c","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S2","url":"https://www.nassau.co.kr/","title":"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드","publisher":"nassau.co.kr","published_at":"2026-10-27","snippet":"낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\n# 낫소 쇼핑몰 - 대한민국 대표 스포츠 브랜드\n...\n# alls","used_for":"company_verification"},{"id":"6ae61b08-7984-4c64-acfb-1de05583e83e","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S2","url":"http://www.nassau.co.kr/files/pdf/2023_nassau_diary_catalog_kr.pdf","title":"홈페이지 QR코드","publisher":"nassau.co.kr","published_at":"2024-09-28","snippet":"주식회사 낫소\nwww.nassau.co.kr\nE-mail.sales@nassau.co.kr\nT.1577-4580   Fax. 032-326-2570\n경기도 고양시 덕양구 보광로 106번길 42 낫소빌딩\n...\nwww.nassau.co.kr / www.nassaushop.com\n...\n- SOCCER \n- TENNIS \n- JOKGU\n- BASKETBALL \n- VOLLEYBALL \n- OTHERS \n- NEW SPORTS\n- UNIFORM\n2023 NASSAU SPORTING GOODS\nNow, Sports For Life\nSPORTING GOODS\nKorea No.1 Sports Brand\nSince 1971\nSPORTING GOODS\n...\n투지 프리미엄에는 1971년에 설립한 대한민국 대표 스포츠 브랜드 낫소의 50여년 오랜 기술과 노하우가 스며들어 있습니다.","used_for":"company_verification"},{"id":"0bd3b6ce-47dd-4f72-bdbb-08721f6c57aa","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S2","url":"https://fashionbiz.co.kr/article/119901","title":"낫소, 스포츠 서브라이선스모집","publisher":"fashionbiz.co.kr","published_at":"2010-10-14","snippet":"정통 스포츠용품 토종기업 낫소(대표 이태영 www.nassau.co.kr)가 「낫소(NASSAU)」브랜드로 스포츠 골프 아웃도어 등 브랜드를 전개할 서브라이선스 업체를 찾는다.\n이 회사는 라이선스 전개를 통해 스포츠용품에서 의류를 포함한 토털 스포츠패션메이커로의 도약을 추진, 건실한 중소 패션기업중 생산 기반을 갖춘 스포츠웨어 업체의 라이선스 참여를 희망하고 있다.\n...\n낫소는 지난 1969년 출범해 40여년간 전문 스포츠 용품 회사로 활약, 국제 테니스 연맹(ITF), 국제배구연맹(FIVB), 국제핸드볼연맹(IHF), 국제축구연맹(FIFA), 대한축구협회(KFA) 공인 획득을 통해 테니스 축구 핸드볼 배구 등 부문에서 86아시안 게임 공식 사용구로 지정받은바 있으며 테니스볼의 경우 88올림픽공식구로 지정받기도.\n또 세계 4대 그랜드스램 국제테니스대회인 호주오픈 공식사용구등 제품의 우수성을 세계에 알리는 기업으로 성장해 왔다.\n낫소는 글로벌 낫소(NASSAU)를 향해 끊임없는 기술개발과 해외 우수 생산기지 구축등 적극적인 사업영역 확대와 투자로 전세계 40여개국에 대리점 체제를 구축하고 있다.\n「낫소(NASSAU)」는 바하마 군도의 캐피탈(Capital Name)이며 네덜란드 황족 칭호였다.\n유럽과 미국에는 나소 스트릿, 낫소 하우스, 낫소 컨트리등 고품격의 지명이 여러곳 있으며미국 뉴욕의 넘버원 하이웨이 이름이 낫소 하이웨이 이기도 해 고품격의 브랜드 인지도를 갖추고 있다.","used_for":"company_verification"},{"id":"fce3e661-4000-4b53-b7f1-fe149251cc25","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S2","url":"https://blog.naver.com/dowoninfna/221972064111","title":"상표이야기(634) : 낫소(NASSAU) 스포츠브랜드","publisher":"blog.naver.com","published_at":"2020-05-20","snippet":"회사 홈피 : www.nassau.co.kr\nWe are Korea's leading sporting goods manufacturer with a history of 50 years.\nlearn more\n...\n1971년 설립된 낫소는 이름 탓에 일본 브랜드라는 오해를 받기도 했지만 토종이다.축구공 테니스공 등 스포츠용품을 제조하며 성장했다.\n...\n낫소는 한때 56개국으로 수출할 정도로 ‘잘나가던’ 토종 강소기업이었다.\n...\n주 대표는 “50년 가까이 만든 축구공은 노하우가 우리 연구소에 축적돼 있다”며 “그 결과 세계 최초로 4패널(조각) 시스템 공법이 적용된 공을 개발했다”고 소개했다.\n...\n낫소는 어려운 가운데 제3세계에 대한 지원을 아끼지 않고 있다.\n2020 도쿄올림픽에 출전한 남수단 선수단에 단복, 유니폼 등 스포츠용품을 지원했고, 현재까지도 도움의 손길을 이어가고 있다.\n...\n주 대표는 사업 다각화에 나서겠다는 포부를 밝혔다.\n그는 “카카오와 손을 잡고 캐릭터를 활용한 스포츠용품을 제작하고 있다”며 “스포츠 에어돔(공기 압력을 이용한 기둥 없는 실내 구조물), 의류 등으로 사업 영역을 확장하고 있고, 골프장 로봇 캐디 개발에도 투자하고 있다”고 말했다.","used_for":"company_verification"},{"id":"2228b76d-992f-4de2-9b8d-d80a8b6413e2","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S2","url":"https://namu.wiki/w/%EB%82%AB%EC%86%8C(%EA%B8%B0%EC%97%85)?uuid=4e6ac24a-dec7-421a-a6ad-7787f9557fbe","title":"낫소(기업) (r38 판)","publisher":"namu.wiki","published_at":"2021-02-26","snippet":"|주식회사 낫소|주식회사 낫소|\n|--|--|\n|**설립일**|1971년|\n|**국가**|대한민국|\n|**분야**|스포츠용품 제조|\n| … | … |\n|**홈페이지**|http://www.nassau.co.kr/|\n...\nNassau는 대한민국의 스포츠용품 브랜드이다.\n한때 **세계 4대 테니스공 메이커** 였으며, 주로 축구공, 테니스공, 농구공등을 생산하며 저가 의류에서도 이 브랜드를 볼 수 있다.\n...\n1971년에 세방물산이란 이름으로 설립되어 1978년 이 이름으로 회사 이름을 변경했다.\n...\n세계 메이저 브랜드 Wilson (미국), Babolat (프랑스), Head (오스트리아)의 테니스볼을 국내와 낫소 인도네시아 공장에서 OEM 및 ODM 생산한 적이 있다.\n축구 부분에선 한국 최초로 칼라와 라텍스소재를 사용한 '칼라 라텍스 축구공' 돌파 태극 21을 개발 및 생산했다.\n주로 공을 주력으로 만들어내고 있는데, 테니스 그랜드 슬램인 호주 오픈 공인구로 88년 낫소 테니스 공이 지정된 바 있다.\n...\n축구공 '투지' 역시 현재 FA컵과 K3리그, U리그, 초중고 주말리그 공인구로 사용되고 있으며, 아마추어 레벨에서 쓰기엔 아디다스와 나이키 공보다 내구성이나 가성비면에서 더 훌륭하다는 평을 받고 있다.\n그 외 운동화도 가성비가 좋다는 평을 받고 있다.\n또한 각종 패딩도 만들고 있다.","used_for":"company_verification"},{"id":"865c5295-2d8d-45eb-955a-61d13b755f78","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","stage":"S2","url":"https://nassau.co.kr/en/cs_news.asp?act=view&idx=104404&keyword=&field=&page=3","title":"pr center - Nassau Shopping Mall - Korea's leading sports brand","publisher":"nassau.co.kr","published_at":"2026-09-17","snippet":"# PR CENTER\n## NEWS\n|Content|June 23, 2022Reporter: Woo Choong-won, OSEN Nassau Co., Ltd., a leading Korean sports brand, has announced a collaboration with Kakao Friends to launch a new line of co-branded products in the second half of 2022.\nBy integrating Kakao Friends characters into its lineup of sports equipment, Nassau aims to increase its accessibility and appeal, particularly among MZ generation consumers and female customers.\nSince its founding in 1971, Nassau has built a solid reputation in Korea’s sports industry.\nThe company became the official match ball provider for the 1986 Asian Games and supplied tennis balls for the 1988 Seoul Olympics.\nFrom 1993 onward, Nassau served as the official match ball partner for the Korea Football Association for three decades, solidifying its reputation for product excellence.\nNow, Nassau is preparing for the future with a focus on sports technology, developing innovations such as its digital football training machine “Dr. Cannon” and eco-friendly sports airdomes.","used_for":"company_verification"}],"article":{"id":"240cceaa-94e5-4417-a085-4d959b45a8ed","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","version":1,"title":"낫소, 4K 이동형 스크린 파크골프로 공공 생활체육시장 공략","subtitle":"언리얼 엔진 5.1과 하이스피드 카메라로 구현한 실감형 가상 필드\n간편한 설치·철거를 앞세운 지자체·복지시설 중심 시장 확대","body":"스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보이며 지자체와 공공기관, 주민복지시설을 중심으로 시장 확대에 나선다. 기존 실내 공간을 활용해 지역 주민과 시니어에게 새로운 생활체육 환경을 제공할 수 있도록 기획한 제품이다.\n\n특히 2 비전 하이스피드 카메라 센서를 적용해 타격 순간 볼의 움직임을 빠르고 정밀하게 감지하고, 이를 스크린 속 가상 필드에 반영하도록 설계했다. 부스의 기본 골격은 용접 없이 부재를 연결하고 분해할 수 있는 무용접 조인트 결합 방식으로 설계해 설치와 철거 과정을 간소화했다.\n\n이번 부스는 언리얼 엔진 5.1 기반의 4K UHD 고화질 그래픽을 적용해 선명하고 생동감 있는 가상 필드를 구현하도록 설계됐다. 다양한 코스와 연습 콘텐츠를 제공해 입문자의 기초 연습부터 기존 이용자의 게임과 친선경기까지 폭넓게 활용할 수 있다.\n\n1971년 창립한 낫소는 올해 창립 55주년을 맞은 스포츠용품 전문기업으로, 축구공·배구공·테니스공 등 다양한 스포츠용품을 개발 및 생산해 왔다.\n\n관련 스크린 파크골프 및 생활체육 시스템 시장에서도 주요 기업과 브랜드들의 영역 확장 경쟁이 치열하게 전개되고 있다. 골프존(GDR·파크골프)의 경우 기존 스크린골프에서 축적한 고정밀 센서와 코스 그래픽 기술을 바탕으로 지자체 및 커뮤니티 시설 대상 실내 파크골프 시뮬레이터 보급을 확대하고 있다. 카카오VX의 경우 직관적인 사용자 인터페이스(UI)와 생활체육 플랫폼 연동 기능을 앞세워 공공 체육시설 및 시니어 특화 스크린 스포츠 시장 공략에 속도를 내고 있다. 마실파크골프·SGP 등 전용 시뮬레이터 업계의 경우 전국 지자체 경로당·주민복지관 등 도심 내 실내 체육 공간 조성을 겨냥해 실감형 파크골프 설비와 구장 프랜차이즈 보급 경쟁을 벌이고 있다.\n\n기존 스크린 파크골프 업체들이 주로 대규모 전용 매장이나 고정식 인테리어 시공 방식으로 시장을 넓혀왔다면, ㈜낫소는 화면·센서·타석·외부 프레임을 하나로 묶은 일체형 이동식 부스 설계로 차별화를 꾀했다. 별도의 대규모 공사 없이 주민복지시설이나 기관 유휴 공간에 1부스 단위로 즉시 배치할 수 있어, 공간 제약과 초기 설치 부담을 줄이려는 지자체·공공기관 수요를 집중 공략한다는 전략이다.\n\n낫소 관계자는 “이동형 스크린 파크골프 부스는 실감 나는 플레이 환경과 설치·철거 편의성을 함께 고려한 제품”이라며 “앞으로도 지자체와 주민복지시설 등 다양한 공간에서 활용할 수 있는 생활체육 환경을 제공하고, 지역 주민들의 스포츠 참여 기회를 확대해 나가겠다”라고 밝혔다.","caption_json":"[\"스포츠용품 전문기업 ㈜낫소가 고화질 그래픽과 정밀 센서 기술을 적용한 이동형 스크린 파크골프 부스를 선보인다. [제공=낫소]\"]","ai_notice_included":0,"created_by":"ai"},"findings":[],"competitors":[{"id":"6419b26d-0b36-4ee0-b53f-3df3c8508adc","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","name":"골프존(GDR·파크골프)","summary":"기존 스크린골프에서 축적한 고정밀 센서와 코스 그래픽 기술을 바탕으로 지자체 및 커뮤니티 시설 대상 실내 파크골프 시뮬레이터 보급을 확대하고 있다.","source_url":"https://nassau.co.kr/intro/","selected":1},{"id":"157ed3cc-eac7-4a59-8013-1f630f28995d","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","name":"카카오VX","summary":"직관적인 사용자 인터페이스(UI)와 생활체육 플랫폼 연동 기능을 앞세워 공공 체육시설 및 시니어 특화 스크린 스포츠 시장 공략에 속도를 내고 있다.","source_url":"https://isplus.com/article/view/isp202610190209","selected":1},{"id":"7e448ab1-d30c-4b0b-b32e-1856072cc7a6","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","name":"마실파크골프·SGP 등 전용 시뮬레이터 업계","summary":"전국 지자체 경로당·주민복지관 등 도심 내 실내 체육 공간 조성을 겨냥해 실감형 파크골프 설비와 구장 프랜차이즈 보급 경쟁을 벌이고 있다.","source_url":"https://www.incruit.com/company/1683636837/","selected":1}],"notifications":[{"id":"7be69b0d-494f-4408-abba-1d3ba52c85c2","user_id":"9d0c91ba-cd35-429a-bca8-d73e68cf0a94","job_id":"5ea49424-4186-4b9d-89a3-945cce09a871","type":"hold","message":"증빙 자료 확인 또는 담당자 검토가 필요한 보류(HOLD) 항목이 있습니다.","reasons_json":"[]","read_at":null,"created_at":"2026-10-28T09:01:37.275Z"}],"approval":null},{"job":{"id":"6fd3ff37-6e28-415c-8331-e9d432bcab82","user_id":"9d0c91ba-cd35-429a-bca8-d73e68cf0a94","mode":"ad_article","status":"completed","verdict":"PASS","company_name":"유니세프","raw_text":"유니세프 한국위원회(회장 정갑영)는 그룹 제로베이스원(ZEROBASEONE)의 리더 성한빈이 공식 유튜브 콘텐츠 ‘미래면접관’에 재능기부로 참여했다고 23일 밝혔다.\n\n \n\n‘미래면접관’은 어린이와 어른의 역할을 바꿔, 어린이가 직접 면접관이 되어 어른들에게 질문을 던지는 유니세프 한국위원회의 공식 유튜브 시리즈다. 직업과 가치관, 꿈과 고민 등 다양한 주제를 두고 어린이와 어른이 생각을 나누며 서로를 이해하고 공감할 수 있도록 기획됐다.\n\n \n\n‘모두의 마음을 하나로 모으는 사람’으로 미래면접관의 열세 번째 면접자로 출연한 성한빈은 꿈과 진로를 고민하는 어린이 면접관들의 질문에 귀 기울이고, 자신의 경험과 생각을 바탕으로 진솔한 답변을 전했다. 어린이들의 질문을 진지하게 마주하며 따뜻한 대화를 이어간 성한빈은 서로의 생각을 나누고 공감하는 시간을 만들었다.\n\n \n\n성한빈은 면접을 마친 뒤 “어린이 면접관들의 질문을 통해 스스로의 초심을 반추해 보는 소중한 경험이었다”라며 “꿈을 향해 걸어가는 모든 어린이가 밝고 건강하게 성장하기를 항상 응원하겠다”고 소감을 밝혔다.\n\n \n\n허금주 유니세프 한국위원회 사무총장은 “어린이들의 고민에 진심으로 귀 기울이고 따뜻한 마음을 나눠 준 성한빈 님께 감사드린다”라며 “‘미래면접관’이 어른들에게는 어린이들의 마음을 한 걸음 더 가까이에서 이해하는 시간이, 어린이들에게는 자신의 생각과 꿈을 마음껏 이야기하는 시간이 되길 바란다”고 말했다.\n\n \n\n성한빈이 출연한 ‘모두의 마음을 하나로 모으는 사람’ 편은 23일 오후 5시 유니세프 한국위원회 공식 유튜브 채널(https://www.youtube.com/unicefMedia)에서 공개된다.\n\n \n\n유니세프(UNICEF, 유엔아동기금)는 유엔아동권리협약에 아동권리 증진에 대한 역할이 명시적으로 언급된 유일한 기관으로서 전 세계 어린이를 위해 보건, 영양, 식수·위생, 교육, 보호, 긴급구호 등의 사업을 펼치는 유엔 산하기구이다. 유니세프 한국위원회는 이러한 유니세프를 한국에서 대표하는 기관으로서 전 세계 어린이들을 위한 기금을 모금하고 유니세프아동친화사회 만들기 사업 등을 통해 국내 어린이 권리를 증진한다.","options_json":"{\"category\":\"기업·경영\",\"outlet\":\"매일경제(신문, AX)\",\"byline\":\"이경섭 기자\",\"captions\":[],\"photoCount\":1,\"companyProvidedPhotoConfirmed\":true,\"portraitConsentChecked\":true,\"includeAiNotice\":false}","created_at":"2026-10-28T08:53:41.947Z","updated_at":"2026-10-28T08:55:58.283Z"},"stages":[{"id":"96ad7c37-40d9-4e93-ac1c-eaf851c3611a","job_id":"6fd3ff37-6e28-415c-8331-e9d432bcab82","stage":"S0","status":"completed","output_json":"{\"normalizedText\":\"유니세프 한국위원회(회장 정갑영)는 그룹 제로베이스원(ZEROBASEONE)의 리더 성한빈이 공식 유튜브 콘텐츠 ‘미래면접관’에 재능기부로 참여했다고 23일 밝혔다.\\n\\n‘미래면접관’은 어린이와 어른의 역할을 바꿔, 어린이가 직접 면접관이 되어 어른들에게 질문을 던지는 유니세프 한국위원회의 공식 유튜브
