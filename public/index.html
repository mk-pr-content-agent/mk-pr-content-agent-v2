daily\",\"publisher\":\"koreajoongangdaily.com\",\"url\":\"https://www.koreajoongangdaily.com/tag/zerobaseone\",\"publishedAt\":\"2026-10-26\"},{\"title\":\"tag - koreajoongangdaily\",\"publisher\":\"koreajoongangdaily.com\",\"url\":\"https://www.koreajoongangdaily.com/tag/zb1\",\"publishedAt\":\"2026-07-13\"}],\"differentiationAdvice\":\"기존 게재 기사(15건)와 네이버 검색 시 겹치지 않도록 제목 어순과 핵심 키워드 배치를 차별화합니다.\",\"sources\":[{\"url\":\"https://www.newstap.co.kr/news/articleView.html?idxno=336315\",\"title\":\"제로베이스원 성한빈, 유니세프 ‘미래면접관' 출연… 어린이들과 꿈과 고민 나눈다\",\"publisher\":\"newstap.co.kr\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"그룹 제로베이스원(ZEROBASEONE)의 리더 성한빈이 유니세프 한국위원회의 유튜브 콘텐츠에 재능기부로 참여해 어린이들과 꿈과 진로에 관한 이야기를 나눴다.\\n유니세프 한국위원회(회장 정갑영)는 성한빈이 공식 유튜브 시리즈 '미래면접관'의 열세 번째 면접자로 출연했다고 23일 밝혔다.\\n'미래면접관'은 어린이와 어른의 역할을 바꿔 어린이가 면접관이 되고, 어른이 면접자로 참여하는 유니세프 한국위원회의 공식 유튜브 콘텐츠다.\\n어린이들이 직업과 가치관, 꿈과 고민 등 다양한 주제에 관해 직접 질문하고 어른들의 답변을 들으며 서로의 생각을 이해하고 공감할 수 있도록 기획됐다.\\n유니세프 한국위원회 공식 유튜브 '미래면접관'에 함께한 제로베이스원 성한빈 (사진제공=유니세프 한국위원회)\\n이번 콘텐츠에서 성한빈은 '모두의 마음을 하나로 모으는 사람'이라는 주제로 어린이 면접관들과 만났다.\\n꿈과 진로를 고민하는 어린이들의 질문에 귀를 기울이며 자신의 경험과 생각을 바탕으로 진솔한 답변을 전했다.\\n...\\n성한빈이 출연한 '미래면접관'의 '모두의 마음을 하나로 모으는 사람' 편은 23일 오후 5시 유니세프 한국위원회 공식 유튜브 채널을 통해 공개된다.\\n...\\n유니세프 한국위원회는 유니세프를 국내에서 대표하는 기관으로, 전 세계 어린이를 위한 기금을 모금하고 '유니세프아동친화사회 만들기' 사업 등을 통해 국내 어린이의 권리 증진을 위한 활동을 펼치고 있다.\"},{\"url\":\"https://www.starnewskorea.com/star/2026/10/23/2026102308101537668\",\"title\":\"\\\"소중한 경험\\\" 성한빈, 유니세프 한국위원회 유튜브 '미래면접관' 출연 | 스타뉴스\",\"publisher\":\"starnewskorea.com\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"그룹 제로베이스원(ZEROBASEONE)의 리더 성한빈이 유니세프 한국위원회 공식 유튜브 콘텐츠 '미래면접관'에 재능기부로 참여했다.\\n23일 유니세프 한국위원회(회장 정갑영)에 따르면 '미래면접관'은 어린이와 어른의 역할을 바꿔, 어린이가 직접 면접관이 되어 어른들에게 질문을 던지는 유니세프 한국위원회의 공식 유튜브 시리즈다.\\n직업과 가치관, 꿈과 고민 등 다양한 주제를 두고 어린이와 어른이 생각을 나누며 서로를 이해하고 공감할 수 있도록 기획됐다.\\n'모두의 마음을 하나로 모으는 사람'으로 미래면접관의 열세 번째 면접자로 출연한 성한빈은 꿈과 진로를 고민하는 어린이 면접관들의 질문에 귀 기울이고, 자신의 경험과 생각을 바탕으로 진솔한 답변을 전했다.\\n어린이들의 질문을 진지하게 마주하며 따뜻한 대화를 이어간 성한빈은 서로의 생각을 나누고 공감하는 시간을 만들었다.\\n성한빈은 면접을 마친 뒤 \\\"어린이 면접관들의 질문을 통해 스스로의 초심을 반추해 보는 소중한 경험이었다\\\"라며 \\\"꿈을 향해 걸어가는 모든 어린이가 밝고 건강하게 성장하기를 항상 응원하겠다\\\"고 소감을 밝혔다.\\n...\\n성한빈이 출연한 '모두의 마음을 하나로 모으는 사람' 편은 10월 23일 오후 5시 유니세프 한국위원회 공식 유튜브 채널에서 공개된다.\"},{\"url\":\"https://news.nate.com/view/20261023n04878\",\"title\":\"\\\"소중한 경험\\\" 성한빈, 유니세프 한국위원회 유튜브 '미래면접관' 출연 : 네이트 연예\",\"publisher\":\"news.nate.com\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"[스타뉴스 | 문완식 기자] 그룹 제로베이스원(ZEROBASEONE)의 리더 성한빈이 유니세프 한국위원회 공식 유튜브 콘텐츠 '미래면접관'에 재능기부로 참여했다.\\n23일 유니세프 한국위원회(회장 정갑영)에 따르면 '미래면접관'은 어린이와 어른의 역할을 바꿔, 어린이가 직접 면접관이 되어 어른들에게 질문을 던지는 유니세프 한국위원회의 공식 유튜브 시리즈다.\\n직업과 가치관, 꿈과 고민 등 다양한 주제를 두고 어린이와 어른이 생각을 나누며 서로를 이해하고 공감할 수 있도록 기획됐다.\\n'모두의 마음을 하나로 모으는 사람'으로 미래면접관의 열세 번째 면접자로 출연한 성한빈은 꿈과 진로를 고민하는 어린이 면접관들의 질문에 귀 기울이고, 자신의 경험과 생각을 바탕으로 진솔한 답변을 전했다.\\n...\\n성한빈은 면접을 마친 뒤 \\\"어린이 면접관들의 질문을 통해 스스로의 초심을 반추해 보는 소중한 경험이었다\\\"라며 \\\"꿈을 향해 걸어가는 모든 어린이가 밝고 건강하게 성장하기를 항상 응원하겠다\\\"고 소감을 밝혔다.\\n...\\n성한빈이 출연한 '모두의 마음을 하나로 모으는 사람' 편은 10월 23일 오후 5시 유니세프 한국위원회 공식 유튜브 채널에서 공개된다.\\n...\\n유니세프 한국위원회는 이러한 유니세프를 한국에서 대표하는 기관으로서 전 세계 어린이들을 위한 기금을 모금하고 유니세프아동친화사회 만들기 사업 등을 통해 국내 어린이 권리를 증진한다.\"},{\"url\":\"https://www.bntnews.co.kr/article/view/bnt202610230074\",\"title\":\"제로베이스원 성한빈, 유니세프 재능기부\",\"publisher\":\"bntnews.co.kr\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"# 제로베이스원 성한빈, 유니세프 재능기부\\n그룹 제로베이스원 성한빈이 유니세프 한국위원회 콘텐츠에 재능기부로 참여했다.\\n어린이들과 꿈과 진로에 관한 이야기를 나누며 응원의 메시지를 전했다.\\n유니세프 한국위원회는 23일 성한빈이 공식 유튜브 시리즈 ‘미래면접관’에 출연한다고 밝혔다.\\n...\\n성한빈은 열세 번째 면접자로 참여했다.\\n...\\n한편 성한빈이 출연하는 ‘미래면접관’은 23일 오후 5시 유니세프 한국위원회 공식 유튜브 채널에서 공개된다.\"},{\"url\":\"https://news.nate.com/view/20261023n05001\",\"title\":\"어린이가 묻고 성한빈이 답한다…유니세프 '미래면접관' 출연\",\"publisher\":\"news.nate.com\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"꿈·진로 고민 듣고 재능기부로 참여\\n23일 오후 5시 공식 유튜브서 공개\\n유니세프 한국위원회 유튜브 시리즈 '미래면접관'에 출연한 그룹 제로베이스원 성한빈.\\n유니세프 한국위원회 제공\\n[파이낸셜뉴스] 어린이가 면접관이 돼 어른에게 꿈과 진로를 묻는 자리에 그룹 제로베이스원 성한빈이 나선다.\\n어린이들의 고민을 듣고 자신의 경험과 생각을 나눈다.\\n23일 유니세프 한국위원회에 따르면 성한빈이 재능기부로 참여한 '미래면접관' 영상이 이날 오후 5시 위원회 공식 유튜브 채널에서 공개된다.\\n'미래면접관'은 어린이와 어른의 역할을 바꿔 어린이가 직접 질문을 이끄는 프로그램이다.\\n직업과 가치관, 꿈과 고민 등을 주제로 서로의 생각을 나누도록 기획됐다.\\n성한빈은 '모두의 마음을 하나로 모으는 사람' 편에 13번째 면접자로 출연했다.\\n꿈과 진로를 고민하는 어린이 면접관들의 질문에 자신의 경험을 바탕으로 답했다.\"},{\"url\":\"https://www.fnnews.com/news/202610230813402722\",\"title\":\"어린이가 묻고 성한빈이 답한다…유니세프 '미래면접관' 출연\",\"publisher\":\"fnnews.com\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"유니세프 한국위원회 유튜브 시리즈 '미래면접관'에 출연한 그룹 제로베이스원 성한빈.\\n유니세프 한국위원회 제공\\n[파이낸셜뉴스] 어린이가 면접관이 돼 어른에게 꿈과 진로를 묻는 자리에 그룹 제로베이스원 성한빈이 나선다.\\n어린이들의 고민을 듣고 자신의 경험과 생각을 나눈다.\\n23일 유니세프 한국위원회에 따르면 성한빈이 재능기부로 참여한 '미래면접관' 영상이 이날 오후 5시 위원회 공식 유튜브 채널에서 공개된다.\\n...\\n성한빈은 '모두의 마음을 하나로 모으는 사람' 편에 13번째 면접자로 출연했다.\\n꿈과 진로를 고민하는 어린이 면접관들의 질문에 자신의 경험을 바탕으로 답했다.\"},{\"url\":\"https://www.thepowernews.co.kr/view.php?ud=2026102309274652433dfcd109a8_7&vct=\",\"title\":\"제로베이스원 성한빈, 유니세프 ‘미래면접관’ 출연…어린이들과 진로 대화\",\"publisher\":\"thepowernews.co.kr\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"# 제로베이스원 성한빈, 유니세프 ‘미래면접관’ 출연…어린이들과 진로 대화\\n▲그룹 제로베이스원 리더 성한빈이 유니세프 한국위원회 유튜브 콘텐츠 ‘미래면접관’에 출연해 어린이 면접관들과 꿈과 진로, 가치관에 대한 이야기를 나누고 있다.(사진=유니세프 한국위원회)[더파워 이강율 기자] 그룹 제로베이스원(ZEROBASEONE) 리더 성한빈이 어린이 면접관들과 만나 꿈과 진로, 리더십에 대한 자신의 경험을 나눴다.\\n유니세프 한국위원회 유튜브 콘텐츠에 재능기부로 참여해 어린이들의 질문을 듣고 도전 과정과 가치관을 이야기했다.\\n유니세프 한국위원회는 23일 성한빈이 공식 유튜브 콘텐츠 ‘미래면접관’에 재능기부 형식으로 참여했다고 밝혔다.\\n...\\n성한빈은 이번 편에서 ‘모두의 마음을 하나로 모으는 사람’을 주제로 13번째 면접자로 출연했다.\\n어린이 면접관들은 꿈을 이루는 과정과 진로 고민, 리더로서의 역할 등을 질문했다.\\n...\\n성한빈이 출연한 ‘미래면접관-모두의 마음을 하나로 모으는 사람’ 편은 23일 오후 5시 유니세프 한국위원회 공식 유튜브 채널을 통해 공개될 예정이다.\"},{\"url\":\"https://www.thepowernews.co.kr/view.php?ud=2026102309274652433dfcd109a8_7&vct=g0305\",\"title\":\"제로베이스원 성한빈, 유니세프 ‘미래면접관’ 출연…어린이들과 진로 대화\",\"publisher\":\"thepowernews.co.kr\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"제로베이스원 성한빈, 유니세프 ‘미래면접관’ 출연…어린이들과 진로 대화\\n...\\n# 제로베이스원 성한빈, 유니세프 ‘미래면접관’ 출연…어린이들과 진로 대화\\n▲그룹 제로베이스원 리더 성한빈이 유니세프 한국위원회 유튜브 콘텐츠 ‘미래면접관’에 출연해 어린이 면접관들과 꿈과 진로, 가치관에 대한 이야기를 나누고 있다.(사진=유니세프 한국위원회)[더파워 이 .jbfg.com/ko/prcenter/press/detail/25.do\",\"title\":\"“No Child Left Unseen, 미등록 이주아동 지원” JB금융그룹, 유니세프 ...\",\"publisher\":\"jbfg.com\",\"publishedAt\":\"2026-03-12\",\"snippet\":\"JB금융그룹(회장 김기홍)은 지난 11일 서울 마포구 유니세프 한국위원회 사옥에서 유니세프 한국위원회(회장 정갑영)와 ‘프로젝트 169’ 공동 추진을 위한 업무협약을 체결했다고 밝혔다.\\n...\\n“No Child Left Unseen”이라는 슬로건 아래, 행정적 사각지대에 놓여있는 출생 미등록 이주아동이 의료, 양육 등 기본권을 보장받을 수 있도록 기업, 지자체, 민간기관 등이 협력해 지원하는 민관 협력 거버넌스 모델이다.\"},{\"url\":\"https://v.daum.net/v/20261026141308324\",\"title\":\"[AI 트렌드] 유니세프 한국위원회·서울여성가족재단, 유아 마음건강 콘텐츠 개발 外\",\"publisher\":\"v.daum.net\",\"publishedAt\":\"2026-10-26\",\"snippet\":\"유니세프 한국위원회(회장 정갑영)는 서울시여성가족재단(대표이사 박정숙)과 지난 20일 서울여성플라자에서 '나를 찾는 마음여행-유아 사회정서역량 콘텐츠 개발 공유회'를 개최하고 유아용 콘텐츠를 선보였다고 밝혔다.\"},{\"url\":\"https://recruit.unicef.or.kr/\",\"title\":\"유니세프 한국위원회 채용\",\"publisher\":\"recruit.unicef.or.kr\",\"publishedAt\":\"2026-10-08\",\"snippet\":\"### 모든 어린이가 행복한 세상 함께 만들러 가기\\n사단법인 유니세프 한국위원회전화(TEL) 02-737-1004 팩스(FAX) 02-724-8555 @2025 UNICEF Korea All rights reserved.\"},{\"url\":\"https://www.thepowernews.co.kr/view.php?ud=2026102309274652433dfcd109a8_7\",\"title\":\"제로베이스원 성한빈, 유니세프 '미래면접관' 출연…어린이들과 ...\",\"publisher\":\"thepowernews.co.kr\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"제로베이스원 성한빈, 유니세프 ‘미래면접관’ 출연…어린이들과 진로 대화\\n...\\n# 제로베이스원 성한빈, 유니세프 ‘미래면접관’ 출연…어린이들과 진로 대화\\n기사입력 : 2026-10-23 09:49\\n▲그룹 제로베이스원 리더 성한빈이 유니세프 한국위원회 유튜브 콘텐츠 ‘미래면접관’에 출연해 어린이 면접관들과 꿈과 진로, 가치관에 대한 이야기를 나누고 있다.(사진=유니세프 한국위원회)[더파워 이강율 기자] 그룹 제로베이스원(ZEROBASEONE) 리더 성한빈이 어린이 면접관들과 만나 꿈과 진로, 리더십에 대한 자신의 경험을 나눴다.\\n유니세프 한국위원회 유튜브 콘텐츠에 재능기부로 참여해 어린이들의 질문을 듣고 도전 과정과 가치관을 이야기했다.\\n유니세프 한국위원회는 23일 성한빈이 공식 유튜브 콘텐츠 ‘미래면접관’에 재능기부 형식으로 참여했다고 밝혔다.\\n‘미래면접관’은 어린이가 면접관이 돼 어른에게 직접 질문하는 방식의 콘텐츠다.\\n직업과 꿈, 가치관, 고민 등을 주제로 어린이와 출연자가 서로의 생각을 나누도록 구성됐다.\\n성한빈은 이번 편에서 ‘모두의 마음을 하나로 모으는 사람’을 주제로 13번째 면접자로 출연했다.\\n어린이 면접관들은 꿈을 이루는 과정과 진로 고민, 리더로서의 역할 등을 질문했다.\\n성한빈은 자신의 경험을 바탕으로 꿈을 키워온 과정과 노력, 도전 경험 등을 설명했다.\\n어린이들의 이야기를 듣고 질문에 답하면서 각자의 생각을 주고받는 방식으로 촬영이 진행됐다.\\n...\\n성한빈이 출연한 ‘미래면접관-모두의 마음을 하나로 모으는 사람’ 편은 23일 오후 5시 유니세프 한국위원회 공식 유튜브 채널을 통해 공개될 예정이다.\"},{\"url\":\"https://www.jawapos.com/infotainment/2610240315/sung-han-bin-zerobaseone-jadi-bintang-tamu-unicef\",\"title\":\"Sung Han Bin ZEROBASEONE Jadi Bintang Tamu UNICEF\",\"publisher\":\"jawapos.com\",\"publishedAt\":\"2026-10-24\",\"snippet\":\"# Sung Han Bin ZEROBASEONE Jadi Bintang Tamu UNICEF\\n**JawaPos.com** - Sung Han Bin ZEROBASEONE tunjukkan kepeduliannya terhadap anak-anak melalui partisipasi dalam program YouTube resmi UNICEF Korea bertajuk Future Interviewer.\\nIa menyumbangkan bakatnya untuk terlibat dalam konten yang mempertemukan anak-anak dengan orang dewasa guna membahas mimpi, cita-cita, nilai kehidupan, dan berbagai kekhawatiran tentang masa depan.\\nMenurut laporan allkpop, UNICEF Korea mengumumkan bahwa Sung Han Bin tampil sebagai narasumber ke-13 dalam episode berjudul A Person Who Brings Everyone’s Hearts Together.\\n...\\nDalam episode tersebut, Sung Han Bin mendengarkan pertanyaan dari para pewawancara cilik yang tengah memikirkan impian dan pilihan karier mereka.\\n...\\nSekretaris Jenderal UNICEF Korea, Heo Geum Joo, turut menyampaikan apresiasi atas kesediaan Sung Han Bin mendengarkan kekhawatiran anak-anak dan berbagi kehangatan melalui program tersebut.\\n...\\nEpisode yang menampilkan Sung Han Bin dijadwalkan tayang pada 23 Oktober 2026 melalui kanal YouTube resmi UNICEF Korea.\"},{\"url\":\"https://www.allkpop.com/article/2026/10/zerobaseones-sung-han-bin-donates-his-talent-to-unicef-koreas-youtube-series-future-interviewer\",\"title\":\"ZEROBASEONE's Sung Han Bin donates his talent to UNICEF Korea's YouTube series 'Future Interviewer'\",\"publisher\":\"allkpop.com\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"ZEROBASEONE 's leader Sung Han Bin has donated his talent to the Korean Committee for UNICEF's YouTube content.\\nOn October 23, the Korean Committee for UNICEF announced that Sung Han Bin appeared on its official YouTube series 'Future Interviewer' through a talent donation.\\nHe shared conversations about dreams and careers with children and delivered a message of support.\\n'Future Interviewer' is an official YouTube series that swaps the roles of children and adults, with children acting as interviewers and asking adults questions directly.\\n...\\nSung Han Bin appeared as the 13th interviewee in the episode titled 'A Person Who Brings Everyone's Hearts Together.'\\nHe listened carefully to the questions from the young interviewers, who are thinking about their own dreams and future paths, and gave sincere answers based on his own experiences and thoughts.\\n...\\nThe episode featuring Sung Han Bin will be released on the Korean Committee for UNICEF's official YouTube channel on October 23 at 5 PM KST.\\nThe Korean Committee for UNICEF represents UNICEF in Korea, raising funds for children around the world and promoting children's rights in Korea through programs such as the UNICEF Child Friendly Cities Initiative.\"},{\"url\":\"https://www.fnnews.com/section/005005000?page=6\",\"title\":\"문화 뉴스 | 파이낸셜뉴스\",\"publisher\":\"fnnews.com\",\"publishedAt\":\"2026-10-23\",\"snippet\":\"### 어린이가 묻고 성한빈이 답한다…유니세프 '미래면접관' 출연\\n[파이낸셜뉴스] 어린이가 면접관이 돼 어른에게 꿈과 진로를 묻는 자리에 그룹 제로베이스원 성한빈이 나선다.\\n어린이들의 고민을 듣고 자신의 경험과 생각을 나눈다.\\n23일 유니세프 한국위원회에 따르면 성한빈이 재능기부로 참여한 '미래면접관' 영상이 이날 오후 5시 위원회 공식 유튜브 채널에서 공개된다.\\n'미래면접관'은 어린이와 어른의 역할을 바꿔 어린이가 직접 질문을 이끄는 프로그램이다.\\n직업과 가치관, 꿈과 고민 등을 주제로 서로의 생각을 나누도록 기획됐다.\\n성한빈은 '모두의 마음을 하나로 모으는 사람' 편에 13번째 면접자로 출연했다.\"},{\"url\":\"https://en.wikipedia.org/wiki/Zerobaseone\",\"title\":\"Zerobaseone - Wikipedia\",\"publisher\":\"en.wikipedia.org\",\"publishedAt\":\"2023-04-20\",\"snippet\":\"In March 2025, Zerobaseone donated ₩100 million (US$74,611) to Seoul National University Children's Hospital Sponsorship Association, in celebration for achieving the target of 10 million streams for \\\"Doctor!\"},{\"url\":\"https://www.koreajoongangdaily.com/tag/zerobaseone\",\"title\":\"tag - koreajoongangdaily\",\"publisher\":\"koreajoongangdaily.com\",\"publishedAt\":\"2026-10-26\",\"snippet\":\"## ZeroBaseOne's Sung Han-bin donates 100 million to mark third debut anniversary\"},{\"url\":\"https://www.koreajoongangdaily.com/tag/zb1\",\"title\":\"tag - koreajoongangdaily\",\"publisher\":\"koreajoongangdaily.com\",\"publishedAt\":\"2026-07-13\",\"snippet\":\"## ZeroBaseOne's Sung Han-bin donates 100 million to mark third debut anniversary\"},{\"url\":\"https://harian.disway.id/read/922378/7-fakta-gunwook-zerobaseone-yang-ulang-tahun-ke-21-nyaris-jadi-mahasiswa-snu\",\"title\":\"7 Fakta Gunwook ZEROBASEONE yang Ulang Tahun ke- ...\",\"publisher\":\"harian.disway.id\",\"publishedAt\":\"2026-01-10\",\"snippet\":\"Gunwook ternyata pernah ikut donatur tim kampanye UNICEF sebagai bentuk melindungi hak-hak anak di seluruh dunia.\\nSelain donasi langsung, ia juga membantu kampanye lewat *merchandise*.\\nIa sering memakai gelang UNICEF, yang seluruh penjualannya digunakan untuk menyejahterakan anak-anak.\"}],\"llmUsage\":{\"promptTokens\":10244,\"completionTokens\":334,\"totalTokens\":10578,\"estimatedCostUsd\":0.06234}}","started_at":"2026-10-28T08:53:41.960Z","finished_at":"2026-10-28T08:53:49.933Z","error":null},{"id":"14a90100-b4a3-4b40-abe9-3e20edb89ca1","job_id":"6fd3ff37-6e28-415c-8331-e9d432bcab82","stage":"S2","status":"completed","output_json":"{\"hasOfficialHomepage\":true,\"homepageUrl\":\"https://www.unicef.or.kr/\",\"snsOnly\":false,\"verdict\":\"PASS\",\"businessVerifiedSummary\":\"유니세프의 사업 실체 및 공식 채널이 확인되었습니다.\",\"sources\":[{\"url\":\"https://www.unicef.or.kr/\",\"title\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\\n...\\n## 유니세프 소식\\n유니세프아동친화사회 만들기 사업은 아동이 생활하는 사회(지역사회, 학교 등)와 아동에게 영향을 미치는 사회(기업 등)를 모두 아동에게 친화적인 환경으로 만들기 위한 프로젝트입니다.\\n유니세프한국위원회는 이러한 목적 달성을 위해 유니세프아동친화도시, 유니세프아동친화학교, 유니세프아동친화기업 등을 추진하며 점차 그 영역을 확대해 나가고 있습니다.\"},{\"url\":\"https://www.unicef.or.kr/what-we-do/no-discrimination/education/\",\"title\":\"교육\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-05\",\"snippet\":\"# 교육\\n## 모든 어린이는 유아기부터 청년기까지 양질의 교육을 누릴 권리가 있습니다\\n유니세프는 전 세계 모든 어린이가 필요한 지식과 기술을 익힐 수 있도록 교육을 지원합니다.\\n소외되고 배제된 지역에 사는 어린이도 학교에 다닐 수 있도록 교육 접근성을 강화하고, 어떠한 위기 상황에서도 교육을 중단하지 않도록 전문 인력 양성과 양질의 교육 프로그램, 필요한 학용품을 지원합니다.\\n...\\n유니세프는 모든 어린이가 체계적인 교육 시스템 속에서 연령에 따른 적절한 교육을 받을 수 있도록 지원합니다.\\n특히 영유아 교육 확대는 학업 능력 향상을 위한 핵심 전략입니다.\\n영유아 교육은 체계적인 학교 교육 시스템의 초석이 되기 때문입니다.\\n이를 위해 교육 자료 개발, 교사 훈련, 지역사회 참여 교육 등을 진행합니다.\\n또한 정부가 각국의 학업 능력을 체계적으로 평가하여 교육 정책을 펼칠 수 있도록 협력합니다.\\n디지털 교과서, 태양열 라디오 등 모든 어린이가 빠짐없이 배울 수 있도록 혁신적인 교육법도 개발합니다.\\n...\\n유니세프는 청년들이 건강한 미래를 설계하는 데 필요한 기술을 익힐 수 있도록 지원합니다.\\n문장 독해력과 산술 능력을 배우는 기초 기술부터 직업을 마련하는 데 필요한 기술, 디지털을 활용한 기술 등을 배울 수 있도록 지원합니다.\\n## 2022-2025 유니세프 중점 사업 목표\\n- 초·중·고등학교 졸업률 **증가**\\n- 형평성 지수로 측정한 학습 결과의 형평성 **개선**\\n- 전 세계 학습 빈곤율 **감소**\\n...\\n- 학교 밖 어린이 **4,860만 명** 에게 교육 서비스 제공\\n...\\n- 난민 어린이 **640만 명** 에게 교육 서비스 제공\\n...\\n- 난민 어린이 등 학교에 다니지 못했던 어린이 **2,600만 명** 에게 교육 기회 제공\\n3. - 긴급 상황 등 취약 지역 어린이 **1,750만 명** 학습자료 지원\\n...\\n- 디지털 플랫폼을 통해 어린이 **1,800만 명** 교육 접근\\n...\\n- **11개국** 어린이 **200만 명** 에게 OpenAI 협력 디지털 교과서 (63개 언어) 제공\\n...\\n1.\\n- **90개국** 의 학교 밖 어린이 **2,780만 명** 교육 지원\\n2.\\n- **71개국** 어린이 **1,360만 명** 이상에게 디지털 플랫폼 교육 제공\\n3.\\n- **14개국** 어린이 약 **200만 명** 에게 Open AI 협력 디지털 교과서 제공\"},{\"url\":\"https://www.unicef.or.kr/what-we-do/no-discrimination/saving-lives/\",\"title\":\"유니세프 하는 일 - 영양실조 어린이를 위한 생존과 발달\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-06\",\"snippet\":\"유니세프의 산모·신생아·청소년 보건 프로그램은 통합적인 기초 보건 시스템을 강화하고, 필수적인 산모·신생아 보건 서비스를 통해 예방할 수 있는 사망을 줄입니다.\\n또한 질병으로부터 보호하고 치료하며, 모든 어린이가 예방 가능한 질병으로부터 완전히 보호하는 데 초점을 맞춥니다.\\n유니세프 보건 프로그램은 어린이 발달, 장애 어린이, 알려지지 않은 질병, 정신 건강 서비스, 인유두종 바이러스 백신, 임산부 보호, 환경 오염에 의한 질병, 청소년 산모 관리도 다룹니다.\\n...\\n유니세프는 임신 기간부터 생후 1,000일이 되는 때까지 필수 영양소를 충분히 섭취할 수 있도록 도와줍니다.\\n...\\n유니세프는 모자감염 예방과 조기 치료에 중점을 두고 에이즈 퇴치 사업을 펼칩니다.\\n...\\n유니세프는 모든 어린이가 인생을 행복하게 시작할 수 있도록 영양, 보건, 교육, 사회 보호, 부모 교육 및 지원 등 사업을 펼칩니다.\"},{\"url\":\"https://www.unicef.or.kr/what-we-do/korea-government-cooperation/\",\"title\":\"아동권리옹호를 위한 한국 정부 협력 사업 활동\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-03\",\"snippet\":\"## 한국 정부 파트너십\\n유니세프는 도움이 필요한 전 세계 어린이를 지원하기 위해 한국 정부와 협력합니다.\\n...\\n한국 정부가 지원하는 유니세프 중점사업은 교육·보건·영양·식수와 위생·양성 평등·이노베이션 등이 있습니다.\"},{\"url\":\"https://www.unicef.or.kr/what-we-do/for-every-child/schools-for-asia/\",\"title\":\"스쿨스 포 아시아 - 희망의 학교 지원 및 후원 ...\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-13\",\"snippet\":\"유니세프한국위원회 중점사업이기도 한 ‘Schools for Asia’는 이제 아시아 어린이의 희망이 됐습니다.\\n...\\n1. ### 영유아 교육 Early learning - 영유아 교육은 매우 중요합니다.\\n영유아 시절 받은 교육은 어린이가 자라 자신의 잠재력을 전부 발휘할 수 있도록 돕습니다.\\n유니세프는 미취학 어린이를 위한 학교를 건설하고, 교사 교육을 하며, 영유아 교육에 대한 대중 인식을 높입니다.\\n2. ### 양질의 교육 Quality Learning - 학교 출석률이 양질의 교육을 보장하지는 않습니다.\\n학교를 다녀도 읽기, 쓰기, 계산하기 등 기본 능력을 익힐 수 없다면, 어린이는 제대로 성장할 수 없습니다.\\n유니세프는 아시아 어린이가 양질의 교육을 받을 수 있도록 잘 설계된 교육 정책, 커리큘럼 수립을 도우며, 교사 훈련과 좋은 교자재를 지원합니다.\\n3. ### 청소년 교육 Adolescent learning and skills - 청소년은 성인의 삶을 준비하는 시기입니다.\\n이 시기에 청소년이 자신의 삶을 주체적으로 꾸려 나갈 수 있도록 돕는 것은 매우 중요합니다.\\n유니세프는 적성 개발 교육, 기술 및 직업 교육, 역량 강화 프로그램으로 아시아 청소년을 지원합니다.\\n4. ### 긴급재난, 기후위기 교육 Education in emergencies and climate change - 아시아의 많은 어린이가 기후변화 혹은 자연 재해의 피해를 입고 있습니다.\\n이런 상황에서도 어린이는 기본 권리인 학습권을 보장받을 수 있어야 합니다.\\n유니세프는 아시아 각 정부와 긴급 교육 시스템을 수립하고, 재난에도 튼튼한 학교를 건설하며, 원격 교육 프로그램을 개발합니다.\\n5. ### 공평한 교육 시스템 및 정책 강화 Systems strengthening and governance - 돈이 없어서, 장애가 있어서, 여자라는 이유로 교육의 혜택을 받지 못하는 어린이가 많습니다.\\n취약 계층을 포함한 모든 어린이는 동등한 교육을 받아야 합니다.\\n유니세프는 유엔아동권리 정신에 입각하여, 각 정부가 모든 어린이에게 공평한 교육 서비스를 제공할 수 있도록 촉구합니다.\\n...\\n유니세프 ‘Schools for Asia’ 캠페인 출범에 가장 큰 기여를 한 유니세프한국위원회는 2012년 캠페인이 시작된 이래 **2022년까지 총 3,000만 달러** 에 이르는 기부금을 지원했습니다.\\n...\\n**영유아 교육 시설 건립**\\n**식수 및 위생 시설 제공**\"},{\"url\":\"https://www.unicef.or.kr/about-us/unicef/introduction/\",\"title\":\"국제 기부 단체 유니세프 및 한국위원회 소개 l 유니세프\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-26\",\"snippet\":\"유니세프 한국위원회의 대표적인 아동권리 증진 사업은 ‘유니세프아동친화사회 만들기’ 프로젝트입니다.\\n어린이가 생활하는 사회(지역사회, 학교 등)와 어린이에게 영향을 미치는 사회(기업, 병원 등)를 어린이에게 친화적인 환경으로 만듭니다.\\n...\\n한국에서 유니세프를 대표해 유니세프의 이념을 실현하는 유니세프 한국위원회는 매년 유니세프 본부의 감사를 받으며 유니세프 사업 계획에 맞춰 기부금을 모으고 아동권리를 옹호합니다.\"},{\"url\":\"https://www.unicef.or.kr/what-we-do/emergency-relief/humanitarian-aid/\",\"title\":\"인도적 지원을 위한 긴급구호 - 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-02\",\"snippet\":\"유니세프는 세계 요충지에 위치한 유니세프 구호 물자창고를 이용해 72시간 내로 구호 물품을 전달하고, 정부와 긴밀하게 협력해 정확한 상황 파악과 대응을 합니다.\\n인도적 지원을 위한 구호 물품에는 식수와 위생 키트, 교육 키트, 예방접종 의약품 등이 포함되어 있습니다.\\n...\\n유니세프는 어린이에게 기본 정규 교육뿐만 아니라 직장을 구할 수 있도록 직업 교육, 스킬 교육 등을 제공합니다.\\n...\\n긴급 상황이 발생하면 유니세프는 관련 정부, 기관, 국제단체와 협력하여, 어린이가 건강하게 자라는데 필요한 필수적인 의료 서비스가 끊기지 않도록 합니다.\\n간이 진료실을 포함한 병원을 구축하고, 지역 의료진을 교육하며, 각종 의약품과 의료 기구를 보급합니다.\\n...\\n긴급상황, 특히 전쟁 시에는 수원지 오염, 수도관 파괴 등으로 인해 어린이가 깨끗한 물을 마시기 어렵습니다.\\n유니세프는 물 트럭 배송, 수도관 신규 건설, 정화 시스템 구축, 임시 화장실 설치, 개인위생 용품 보급을 합니다.\\n이로써 어린이들이 수인성 질병에 걸리지 않고 깨끗한 환경에서 지낼 수 있도록 지원합니다.\\n...\\n분쟁, 자연재해 등 긴급상황에서 어린이들은 다양한 폭력에 노출되어 있습니다.\\n도망치는 와중에 가족과 헤어지고 무장단체에 납치되기도 하며, 성폭력을 당하기도 합니다.\\n유니세프는 이를 막기위해 관련 정부 및 기관과 협력하여 어린이를 보호합니다.\\n어린이 보호 관련 법규를 강화하고, 어린이 보호 감시 시스템을 구축하며, 무장 단체로부터 어린이의 해방을 돕습니다.\\n가족을 잃은 어린이의 재결합을 돕고, 마음의 상처를 입은 어린이를 위해 심리치료를 제공합니다.\\n...\\n재난 예방 교육, 지역사회 복원력 강화, 교육 시스템 재건, 보건 인프라 구축 등 장기적인 회복 지원을 통해 어린이들이 다시 일상으로 돌아가고 미래를 준비할 수 있도록 돕습니다.\"},{\"url\":\"https://www.unicef.or.kr/about-us/unicef/mission/\",\"title\":\"유니세프 미션과 가치 소개\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-12\",\"snippet\":\"② 위원회는 위원회의 인터넷 홈페이지 웹사이트(http://www.unicef.or.kr) 상에 나타나 있고 이해관계자들에게 물질적으로나 그 밖의 경우에 중요하다고 보여지는 모든 정보들을 공개해야 한다.\"},{\"url\":\"https://www.unicef.or.kr/campaign/annual-report-2025/\",\"title\":\"유니세프 한국위원회 2025 연차보고서 - 후원자님, 감사합니다\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-18\",\"snippet\":\"## 2025 10대 주요 성과\\n후원자님의 온정은 예방접종부터 교육, 식수와 위생, 아동보호까지\\n어린이의 삶을 바꾸는 구체적인 성과가 되었습니다.\\n01\\n예방접종**16억 회분**\\n소아마비 백신을 지원해 2022년 대비 발생 건수를 68% 줄였습니다.\\n02\\n영양**2억 5,500만 명**\\n54개국 어린이의 급성 영양실조 예방과 치료를 지원했습니다.\\n03\\n식수와 위생**3,400만 명+**\\n안전한 식수를 제공하고 1,700만 명 이상에게 기본 위생시설을 지원했습니다.\\n04\\n교육**2,780만 명**\\n90개국 학교 밖 어린이에게 다시 배울 수 있는 기회를 열었습니다.\\n05\\n아동보호**1,040만 명**\\n50개국 여자 어린이와 청소년을 조혼 위험으로부터 보호했습니다.\\n06\\n포용**650만 명**\\n139개국 장애 어린이에게 장애 포용 프로그램을 지원했습니다.\\n07\\n인도주의**414건**\\n101개국에서 발생한 인도주의적 긴급 상황에 대응했습니다.\\n08\\n사회보호**5억 5,900만 달러**\\n위기에 처한 어린이와 가족에게 현금 지원을 전달했습니다.\\n09\\n청소년 참여**108개국**\\n정책 참여와 창업, 지속가능성 옹호 기반을 만들었습니다.\\n10\\n아동권리 옹호**121개국**\\n식수·기후환경 등 어린이를 위한 정책 개선을 이끌었습니다.\\n...\\n마음건강 옹호·홍보 프로그램, 제1회 더아동페스타 등을 통해 어린이 중심의 예방·조기개입 체계 마련을 추진했습니다.\"},{\"url\":\"https://www.unicef.or.kr/involve/corporate-and-organization/wooricap/\",\"title\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-19\",\"snippet\":\"**JB우리캐피탈은**\\n2025년 4월, JB금융그룹 계열사 JB우리캐피탈과 유니세프 한국위원회는 파트너십 협약을 맺고 국내 출생 미등록 아동 지원을 위한 ‘프로젝트 169’ 사업을 시작했습니다.\\n이번 파트너십은 **‘지속가능발전목표(SDGs)’의 16.9 목표** 인 “2030년까지 모든 사람에게 법적 지위를 부여한다”를 실현하기 위한 첫걸음으로,\\n출생 미등록 아동의 권리 보호와 법적 지위 확보를 목표로 합니다.\\n...\\nJB우리캐피탈과 유니세프 한국위원회는 **‘프로젝트 169’를 통해 시흥시에서 출생 미등록 아동 지원** 을 위한 여러 사업을 진행하고 있습니다.\\n여기에는 영유아 건강검진비, 의료비 및 약제비 지원 등이 포함되며, **JB우리캐피탈의 금융 교육** 을 비롯한 다양한 교육을 통해 보호자들에게 실질적인 지원을 제공할 예정입니다.\\n또한, ‘프로젝트 169’는 연내 화성시로도 확대될 예정입니다.\"},{\"url\":\"https://www.unicef.or.kr/involve/individual/pledge/?trackcode=21unicasterdf_m\",\"title\":\"정기후원\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-26\",\"snippet\":\"- ### 세계 어린이 후원\\n전 세계 도움이 필요한 어린이들이 건강하게 자라고 안전하게 살 수 있도록 지원합니다.\\n- ### 난민 어린이 기부\\n자연재해, 전쟁으로 집을 잃고 고생하는 난민 어린이에게 난민 캠프 운영, 깨끗한 식수, 심리 치료, 교육 프로그램을 지원합니다.\\n- ### 에이즈 감염 어린이 후원\\n에이즈로 부모를 잃은 어린이를 보호하고 모자감염 예방과 조기 치료를 정기후원을 통해 지원합니다.\\n...\\n해외 어린이후원을 통해 영양실조 치료식, 예방접종, 깨끗한 식수, 교육 프로그램, 심리 치료를 받습니다.\"},{\"url\":\"https://www.unicef.or.kr/involve/individual/pledge/?trackcode=19team_page1_m\",\"title\":\"정기후원 - 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"- ### 세계 어린이 후원\\n전 세계 도움이 필요한 어린이들이 건강하게 자라고 안전하게 살 수 있도록 지원합니다.\\n- ### 난민 어린이 기부\\n자연재해, 전쟁으로 집을 잃고 고생하는 난민 어린이에게 난민 캠프 운영, 깨끗한 식수, 심리 치료, 교육 프로그램을 지원합니다.\\n- ### 에이즈 감염 어린이 후원\\n에이즈로 부모를 잃은 어린이를 보호하고 모자감염 예방과 조기 치료를 정기후원을 통해 지원합니다.\\n...\\n해외 어린이후원을 통해 영양실조 치료식, 예방접종, 깨끗한 식수, 교육 프로그램, 심리 치료를 받습니다.\"},{\"url\":\"https://www.unicef.or.kr/?trackcode=n_bad&mac_ad_key=2146821406\",\"title\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원 ...\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-26\",\"snippet\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\\n...\\n유니세프아동친화사회 만들기 사업은 아동이 생활하는 사회(지역사회, 학교 등)와 아동에게 영향을 미치는 사회(기업 등)를 모두 아동에게 친화적인 환경으로 만들기 위한 프로젝트입니다.\\n유니세프한국위원회는 이러한 목적 달성을 위해 유니세프아동친화도시, 유니세프아동친화학교, 유니세프아동친화기업 등을 추진하며 점차 그 영역을 확대해 나가고 있습니다.\"},{\"url\":\"https://www.unicef.or.kr/about-us/clear/fund/unicef-kr/2024/\",\"title\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아...\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\\n...\\n|구분|금액(원)|비율|\\n|--|--|--|\\n|개발도상국 지원비 *|123,480,166,097|72.0%|\\n|아동권리 옹호 및 PR 등 *|20,442,250,546|11.9%|\\n|인건비 및 관리 운영비 *|8,549,914,680|5.0%|\\n...\\n|구분|금액(원)|비율|\\n|--|--|--|\\n|세계 어린이 보호|799,864,669| |\\n...\\n- **일반사업비 :** 전 세계 157개 개발도상국의 유니세프 사업비(보건, 에이즈, 식수와 위생, 영양, 교육, 어린이 보호, 사회통합 등)\"},{\"url\":\"https://www.unicef.or.kr/about-us/unicef/greeting/\",\"title\":\"긴급구호아동기금, 어린이후원, 국제아동정기후원 - 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-07\",\"snippet\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\"},{\"url\":\"https://jobs.unicef.org/en-us/job/596501/\",\"title\":\"Vacancies\",\"publisher\":\"jobs.unicef.org\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"# Current vacancies\\n## Climate Resilience Capacity and Programme Support Consultant, 14 Months , Bangkok, Thailand, Remotely. (Open for Both National and International Candidates) Req#596501\\nUNICEF works in over 190 countries and territories to save children’s lives, defend their rights, and help them fulfill their potential, from early childhood through adolescence.\\n...\\nUNICEF is scaling up efforts to protect children from the increasing impacts of climate change, environmental degradation and disasters.\\nGuided by the UNICEF Strategic Plan 2026–2029 and the Sustainability and Climate Change Action Plan (SCAP) 2023–2030, UNICEF works across sectors, including WASH, health, education, nutrition, social protection and child protection, to build climate resilience, reduce risks and advance sustainable development for every child.\\n...\\n• 300 million children benefiting from climate-resilient water, sanitation, health and education infrastructure and services.\"},{\"url\":\"https://www.unicef.org/reports/unicef-annual-report-2023\",\"title\":\"UNICEF Annual Report 2023\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2026-09-09\",\"snippet\":\"# UNICEF Annual Report 2023\\n## UNICEF’s goal areas\\n### Goal area 1:\\n#### Every child survives and thrives\\nUNICEF led global action to prevent food poverty and reduce the triple burden of malnutrition – undernutrition, micronutrient deficiencies and overweight.\\nUNICEF also supported health interventions across age groups, focusing on the primary health care (PHC) service delivery encompassing households, communities and facilities.\\n...\\n### Goal area 2:\\n#### Every child learns and acquires skills for the future\\nUNICEF launched the Five Million Futures action and advocacy framework to mobilize support for over 50 countries to scale up evidence-based interventions around early learning, parenting support and the transition to primary education.\\n...\\n### Goal area 4:\\n#### Every child has access to safe and equitable water, sanitation and hygiene services and supplies, and lives in a safe and sustainable climate and environment\\n...\\nUNICEF has made great progress in support for safe WASH services.\\n...\\n## Humanitarian response\\nUNICEF’s response is focused on ensuring children have access to health care, immunisation, nutrition support, protection, education, safe water and sanitation, social protection, and mental health and psychosocial support.\"},{\"url\":\"https://jobs.unicef.org/cw/es/job/585735/international-consultancy-wash-climate-specialist-kampala-uganda\",\"title\":\"International Consultancy - WASH & Climate Specialist, Kampala - Uganda\",\"publisher\":\"jobs.unicef.org\",\"publishedAt\":\"2025-11-06\",\"snippet\":\"UNICEF works in over 190 countries and territories to save children’s lives, defend their rights, and help them fulfill their potential, from early childhood through adolescence.\\n...\\nThe aim of this consultancy is to support the implementation of WASH in institutions especially in Schools and Health Care Facilities and to facilitate development and implementation of Climate Actions.\\n...\\nWater, Sanitation and Hygiene (WASH)\\nWater, Sanitation and Hygiene (WASH) in institutions is critical in achieving the SDG targets on multiple sectors of UNICEF’s support such as Education, Health, Nutrition and Protection.\\nGuided by evidence on the disproportionate impact of climate change on children, UNICEF promotes climate resilient WASH infrastructure in Schools and Health Care Facilities (HCFs) for sustainable delivery of these critical services in child-critical institutions.\\n...\\nBased on the experience and lessons learnt of the previous phase, UNICEF Uganda will implement a comprehensive WASH in Schools and Health Care Facilities programme in the Karamoja sub-region to improve access to inclusive, climate-resilient WASH services.\\nThis programme will contribute to better health outcomes, reduce absenteeism, and enhance enrollment, retention, and academic performance among school-age children and adolescents, particularly girls, while strengthening systems for sustainable service delivery.\"},{\"url\":\"https://www.unicef.org/media/165936/file/Humanitarian-Action-for-Children-2025-Overview.pdf\",\"title\":\"U N I C E F  H u m a n i ta r i a n  A c t i o n\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2024-12-07\",\"snippet\":\"Through the first half of 2024, \\nUNICEF and our partners have reached millions of children and families with humanitarian assistance.\\nThis includes providing more than 26 million children and women with primary health care, reaching over 17 million people with safe drinking water, helping nearly 10 million children access education services and screening more than 12 million children for wasting.\\nAcross our humanitarian operations, we are strengthening the systems that children rely on – including health care, water, sanitation and education – to support longer-term development goals.\\n...\\n17%\\nEducation\\n$1.97 billion \\n20%\\nWater, Sanitation \\nand Hygiene\\n$1.39 billion \\n14%\\nHealth\\n$1.95 billion \\n20%\\nNutrition\\n$1.14 billion \\n12%\\nChild \\nProtection\\n$685 million \\n...\\nUNICEF and partners will work towards the following results in 2025:\\nHEALTH\\n56.9 million\\nchildren and women accessing \\nprimary health care \\nNUTRITION\\n34.1 million\\nchildren screened for wasting\\nEDUCATION\\n24 million\\nchildren accessing formal  \\nor non-formal education, \\nincluding early learning\\nCHILD PROTECTION\\n20.6 million\\nchildren, adolescents and caregivers\\naccessing community-based mental \\nhealth and psychosocial support \\n...\\npeople reached with timely \\n...\\nPROTECTION FROM \\nSEXUAL EXPLOITATION \\nAND ABUSE\\n39.2 million\\npeople with safe and accessible \\nchannels to report sexual \\nexploitation and abuse \\nGENDER-BASED \\n...\\n11.1 million\\nwomen, girls, and boys accessing \\ngender-based violence risk \\nmitigation, prevention and/or \\nresponse interventions\\nSOCIAL PROTECTION \\n2.9 million\\nhouseholds benefiting  \\nfrom social assistance \\nWASH\\n55.3 million\\npeople accessing a sufficient \\nquantity and quality of water\"},{\"url\":\"https://www.unicef.org/media/107516/file/UNICEF%20Strategic%20Plan%202022-2025.pdf\",\"title\":\"United Nations\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-03-27\",\"snippet\":\"19. The Strategic Plan sets UNICEF on a course for working with communities, \\nGovernments, businesses, civil society and other key partners to strengthen the programmes and systems related to the survival, health and well-being of children and adolescents, including immunization, nutrition, early childhood development, mental health and water, sanitation and hygiene (WASH).\\nUNICEF will continue to reimagine education, including through new digital delivery platforms, to provide\\nevery child and young person with the education and skills they need.\\n20. UNICEF will also continue to protect children from all forms of violence,\\ndiscrimination, exploitation, abuse, neglect and harmful practices.\\nUNICEF will expand its work on social policy and social protection, to ensure that children live free from poverty, and that national budgets prioritize children and support families in new and innovative ways as they cope with the ongoing economic fallout of the pandemic.\\n...\\nThis will help to ensure that, in all contexts, including humanitarian crises and fragile settings, every child, including adolescents,\\n(1) survives and thrives with access to nutritious diets, quality primary health care, \\nnurturing practices and essential supplies; (2) learns and acquires skills for the future;\\n(3) is protected from violence, exploitation, abuse, neglect and harmful practices; \\n(4) has access to safe and equitable WASH services and supplies, and lives in a safe \\nand sustainable climate and environment; and (5) has access to inclusive social \\nprotection and lives free from poverty.\\n37. Responding to the concerns of children and young people and aligning with\\n...\\nAt the core of planned work under Goal Area 1 is a strategy aimed at strengthening national health, food, WASH, education, child protection and social protection systems – and families and communities – to achieve health, nutrition,\"},{\"url\":\"https://www.unicef.org/media/148191/file/2022%20Global%20WASH%20Thematic%20Spotlight%20Report.pdf\",\"title\":\"Spotlight on the\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-11-04\",\"snippet\":\"UNICEF’s Water, Sanitation and Hygiene (WASH) Thematic \\nFund is a flexible funding pool.\\nIt enables us to strengthen systems to ensure every child has access to safe and equitable water, sanitation and hygiene.\\n...\\nHIV/AIDS\\nNutrition\\nEducation\\nChild Protection\\nWater, Sanitation \\nand Hygiene  (WASH)\\n...\\nThematic funding ensures that the spectrum of water, sanitation and hygiene challenges that communities face are addressed at scale through strong systems.\"},{\"url\":\"https://www.unicef.org/media/123896/file/Actions%20for%20a%20Livable%20Planet%20for%20Every%20Child%20-%20UNICEF.pdf\",\"title\":\"Actions for a\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-01-15\",\"snippet\":\"UNICEF is the lead agency in several sectors in implementation and advocacy, including making child-critical services more resilient and working for and with young people: e.g., in education, nutrition, child protection and water, sanitation & hygiene (WASH).\\n...\\n(MHPSS).\"},{\"url\":\"https://www.unicef.org/media/123931/file/Actions%20for%20a%20Livable%20Planet%20for%20Every%20Child%20-%20UNICEF.pdf\",\"title\":\"Actions for a\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2026-01-19\",\"snippet\":\"UNICEF is the lead agency in several sectors in implementation and advocacy, including making child-critical services more resilient and working for and with young people: e.g., in education, nutrition, child protection and water, sanitation & hygiene (WASH).\\nUNICEF co-leads in or contributes extensively to other sectors and areas of work, including social protection, health and mental health and psychosocial support\\n(MHPSS).\"},{\"url\":\"https://www.unicef.org/media/164511/file/UNICEF%20-%20Year%201%20Results%20-%20Today%20and%20Tomorrow%20Initiative%202024.pdf\",\"title\":\"Innovative financing\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2024-11-07\",\"snippet\":\"UNICEF operates in more than 190 countries and territories, in close collaboration with the respective governments, working to save children’s lives, protect their rights, and support their development from early childhood through adolescence.\\nOur approach prioritizes several key sectors including, health, water, sanitation & hygiene (WASH), nutrition,\\n...\\nFurthermore, UNICEF leads the Nutrition, WASH and Education Clusters and Child Protection area of responsibility in country.\"},{\"url\":\"https://www.unicef.org/media/108746/file/EAPRO-Humanitarian-SitRep-September-2021.pdf\",\"title\":\"Microsoft Word - HAC 2021 EAPRO Regional SitRep 3_FINAL\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2024-11-12\",\"snippet\":\"In addition, UNICEF addresses the socio-economic impacts of the pandemic in the region by restoring children’s mental and physical well-being in the areas of health, nutrition, WASH, child protection, education and social protection, focusing on the most vulnerable.\\n...\\nUNICEF is supporting governments to provide life-saving nutrition interventions in response to the pandemic and other emergencies.\\n...\\nUNICEF is supporting governments and communities to control the spread of the COVID-19 and restore essential health services from the impact of the pandemic and other emergencies, in order to minimize morbidity and mortality.\\n...\\nUNICEF is supporting governments, health workers, schools and communities to promote hygiene and ensure children and their families essential WASH services and supplies, including handwashing with soap and essential personal hygiene practices and menstrual supplies for women and girls.\\nDuring the reporting period, UNICEF provided an additional 299,453 people with critical water, sanitation and hygiene supplies (including hygiene items) and services.\\nUNICEF also provided 135,063 people with access to appropriately designed hygiene and sanitation facilities.\\n...\\nUNICEF is working with implementing partners to strengthen mental health and psychosocial support (MHPSS) for children and adolescents, including dedicated child-friendly helplines for children.\\n...\\nUNICEF is supporting governments to ensure the continuity of learning through safe and inclusive school operations.\"},{\"url\":\"https://www.unicef.org/executiveboard/media/22786/file/2020-EB3-Humanitarian-action-EN-2020-01-13.pdf\",\"title\":\"UNICEF/2020/EB/3\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-11-03\",\"snippet\":\"UNICEF plays a key role in supporting vulnerable populations to gain and maintain access to water, sanitation and hygiene (WASH) services in emergencies.\\nThis is accomplished both through the provision of direct assistance at the country level and by leading efforts to coordinate the overall emergency WASH response as lead agency of the Global WASH Cluster (GWC).\\n...\\nThe organization’s humanitarian WASH programmes focus on children and women having access to safe water, sanitation and washing facilities that are culturally appropriate, secure, user- friendly, gender-appropriate, accessible to people with disabilities and designed to help to mitigate social and gender-based tensions in humanitarian settings.\\nWater, sanitation and hygiene facilities and programming are also critical requirements for other sectoral interventions in emergencies, including protection, nutrition, education and health.\"},{\"url\":\"https://open.unicef.org/sites/transparency/files/2023-05/ESARO%20CER%202022.pdf\",\"title\":\"Eastern and Southern Africa\",\"publisher\":\"open.unicef.org\",\"publishedAt\":\"2025-11-03\",\"snippet\":\"UNICEF has supported integrated approaches to preventing and treating acute malnutrition by offering a continuum of care for children and mothers and emphasizing prevention, early detection and treatment through health facilities and community-based platforms.\\n...\\nUNICEF scaled up its WASH assistance, in collaboration with health and education programmes, for the most at-risk water-insecure households, as well as for health facilities and schools.\"},{\"url\":\"https://www.unicef.org/media/132191/file/2023-HAC-Haiti.pdf\",\"title\":\"2023\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-03-27\",\"snippet\":\"UNICEF provides water, sanitation and hygiene (WASH), education, health, nutrition, child protection and social protection services, and is also responding to the resurgence of cholera.\\n...\\nUNICEF will support continued access to essential health care services, immunization and maternal and child health, including in earthquake-affected areas, and will also reinforce health supply chain management.\\nUNICEF will scale up treatment of severe wasting in children with screening, referral and provision of quality therapeutic care, including in areas affected by cholera, while promoting infant and young child feeding practices.\\nUNICEF will provide nutrition supplies, strengthen end-user monitoring and information management and will complete a SMART survey.31\\nWASH interventions will focus on access to sufficient safe drinking water, sanitation and hygiene services.\\nPrevention of waterborne and infectious diseases will be prioritized through water trucking, household water treatment, rehabilitation of WASH infrastructure, waste disposal, hygiene promotion and distribution of hygiene kits.\\nWASH in schools in the Port-au-Prince metropolitan area will also be prioritized.\\nUNICEF will promote safe access and return to learning through the provision of school supplies, access to multiple education pathways, psychosocial support and cholera and disaster risks prevention.\"},{\"url\":\"https://www.unicef.org/eap/sites/unicef.org.eap/files/2018-03/WASH_Nutrition_Toolkit_EAPRO_Final_w_ISBN_web_version_7Nov2016.pdf\",\"title\":\"UNICEF East Asia and Pacific Regional Office (EAPRO)\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-05-28\",\"snippet\":\"UNICEF supports child survival and development, mainly focusing on the sectorial areas of child protection, education, nutrition, health, communications for development and WASH.\\n...\\nFor WASH, UNICEF recognizes the importance of water, sanitation and hygiene in preventing illness and disease, and in particular, the contribution of sanitation and hygiene to reducing child mortality and undernutrition rates.\\n...\\nWithin the EAP region, UNICEF works with partners to help governments improve the policy environment for WASH, build capacity, support the provision of safe water, adequate sanitation and handwashing facilities, research and share good practice and learning.\\n...\\nFigure 10 shows the programme areas where UNICEF will work, with integration of nutrition actions with those from other sectors, including health, early childhood development, social protection, WASH and education.\"},{\"url\":\"https://open.unicef.org/sites/transparency/files/2022-04/WCARO%20CER%202021.pdf\",\"title\":\"UNICEF Regional Office for West and Central Africa\",\"publisher\":\"open.unicef.org\",\"publishedAt\":\"2025-02-17\",\"snippet\":\"UNICEF works in the world’s toughest places to reach the most disadvantaged children and adolescents – and to protect the rights of every child, everywhere.\\nAcross 190 countries and territories, we do whatever it takes to help children survive, thrive, and fulfill their potential, from early childhood through adolescence.\\n...\\nefforts, the Regional Office provided strategic guidance and technical support to all 24 Country Offices to develop and implement multi-sectoral, risk-informed, conflict- and gender-sensitive programming in health, nutrition, WASH, child protection, education, and social protection.\\n...\\nAcross the countries responding to conflict-induced crises, out of 2.4 million children targeted for support, 1.3 million children were reached by UNICEF and partners with child protection services.\\n...\\nThroughout the year, WCARO supported COs in leveraging their comparative advantage to advance child rights at scale and meet their education needs.\\nThis includes strengthening COs’ multi-sectoral profile, while ensuring that schools and learning centers are well placed to deliver essential social services and education to girls and boys.\\n...\\nThe RO provided technical support to \\nMali, Niger, and Chad COs to define and roll out a common package of joint interventions to promote school health and nutrition through the ongoing partnership with WFP.\\nInterventions include school feeding (in kind and/or cash);\\nWASH services (water sanitation and menstrual hygiene management); nutrition services (nutrition education for school, acid folic and deworming); learning and behavioral change (which includes life skills education, and training of school management committees and parent teacher associations).\"}],\"llmUsage\":{\"promptTokens\":9438,\"completionTokens\":339,\"totalTokens\":9777,\"estimatedCostUsd\":0.05843}}","started_at":"2026-10-28T08:53:49.946Z","finished_at":"2026-10-28T08:53:59.328Z","error":null},{"id":"ffa3a3ed-f197-4cd6-95a6-745fa0bc4fca","job_id":"6fd3ff37-6e28-415c-8331-e9d432bcab82","stage":"S3","status":"completed","output_json":"{\"verdict\":\"PASS\",\"matches\":[]}","started_at":"2026-10-28T08:53:59.331Z","finished_at":"2026-10-28T08:53:59.345Z","error":null},{"id":"a727685b-14ae-49bd-b6aa-2e6e6a2bfc57","job_id":"6fd3ff37-6e28-415c-8331-e9d432bcab82","stage":"S4","status":"completed","output_json":"{\"claims\":[{\"id\":\"c1\",\"text\":\"유니세프 한국위원회(회장 정갑영)는 그룹 제로베이스원(ZEROBASEONE)의 리더 성한빈이 공식 유튜브 콘텐츠 ‘미래면접관’에 재능기부로 참여했다고 23일 밝혔다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c2\",\"text\":\"‘미래면접관’은 어린이와 어른의 역할을 바꿔, 어린이가 직접 면접관이 되어 어른들에게 질문을 던지는 유니세프 한국위원회의 공식 유튜브 시리즈다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c3\",\"text\":\"직업과 가치관, 꿈과 고민 등 다양한 주제를 두고 어린이와 어른이 생각을 나누며 서로를 이해하고 공감할 수 있도록 기획됐다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c4\",\"text\":\"‘모두의 마음을 하나로 모으는 사람’으로 미래면접관의 열세 번째 면접자로 출연한 성한빈은 꿈과 진로를 고민하는 어린이 면접관들의 질문에 귀 기울이고, 자신의 경험과 생각을 바탕으로 진솔한 답변을 전했다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c5\",\"text\":\"어린이들의 질문을 진지하게 마주하며 따뜻한 대화를 이어간 성한빈은 서로의 생각을 나누고 공감하는 시간을 만들었다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c6\",\"text\":\"성한빈은 면접을 마친 뒤 “어린이 면접관들의 질문을 통해 스스로의 초심을 반추해 보는 소중한 경험이었다”라며 “꿈을 향해 걸어가는 모든 어린이가 밝고 건강하게 성장하기를 항상 응원하겠다”고 소감을 밝혔다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c7\",\"text\":\"허금주 유니세프 한국위원회 사무총장은 “어린이들의 고민에 진심으로 귀 기울이고 따뜻한 마음을 나눠 준 성한빈 님께 감사드린다”라며 “‘미래면접관’이 어른들에게는 어린이들의 마음을 한 걸음 더 가까이에서 이해하는 시간이, 어린이들에게는 자신의 생각과 꿈을 마음껏 이야기하는 시간이 되길 바란다”고 말했다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c8\",\"text\":\"성한빈이 출연한 ‘모두의 마음을 하나로 모으는 사람’ 편은 23일 오후 5시 유니세프 한국위원회 공식 유튜브 채널(https://www.youtube.com/unicefMedia)에서 공개된다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"},{\"id\":\"c9\",\"text\":\"유니세프(UNICEF, 유엔아동기금)는 유엔아동권리협약에 아동권리 증진에 대한 역할이 명시적으로 언급된 유일한 기관으로서 전 세계 어린이를 위해 보건, 영양, 식수·위생, 교육, 보호, 긴급구호 등의 사업을 펼치는 유엔 산하기구이다.\",\"type\":\"partnership\",\"status\":\"evidence_required\",\"evidenceRequest\":\"협약/제휴 사실 확인 및 상대 기관 노출 합의 여부 확인\",\"usableInArticle\":\"attributed_only\"},{\"id\":\"c10\",\"text\":\"유니세프 한국위원회는 이러한 유니세프를 한국에서 대표하는 기관으로서 전 세계 어린이들을 위한 기금을 모금하고 유니세프아동친화사회 만들기 사업 등을 통해 국내 어린이 권리를 증진한다.\",\"type\":\"general\",\"status\":\"verified\",\"usableInArticle\":\"yes\"}],\"evidenceRequiredList\":[\"협약/제휴 사실 확인 및 상대 기관 노출 합의 여부 확인 (관련 문장: \\\"유니세프(UNICEF, 유엔아동기금)는 유엔아동권리협약에 아동권리 증진에 대한 역...\\\")\"],\"hasMajorCorpMention\":false,\"verdict\":\"HOLD\",\"sources\":[{\"url\":\"https://www.unicef.or.kr/\",\"title\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\\n...\\n## 유니세프 소식\\n유니세프아동친화사회 만들기 사업은 아동이 생활하는 사회(지역사회, 학교 등)와 아동에게 영향을 미치는 사회(기업 등)를 모두 아동에게 친화적인 환경으로 만들기 위한 프로젝트입니다.\\n유니세프한국위원회는 이러한 목적 달성을 위해 유니세프아동친화도시, 유니세프아동친화학교, 유니세프아동친화기업 등을 추진하며 점차 그 영역을 확대해 나가고 있습니다.\"},{\"url\":\"https://www.unicef.or.kr/what-we-do/no-discrimination/education/\",\"title\":\"교육\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-05\",\"snippet\":\"# 교육\\n## 모든 어린이는 유아기부터 청년기까지 양질의 교육을 누릴 권리가 있습니다\\n유니세프는 전 세계 모든 어린이가 필요한 지식과 기술을 익힐 수 있도록 교육을 지원합니다.\\n소외되고 배제된 지역에 사는 어린이도 학교에 다닐 수 있도록 교육 접근성을 강화하고, 어떠한 위기 상황에서도 교육을 중단하지 않도록 전문 인력 양성과 양질의 교육 프로그램, 필요한 학용품을 지원합니다.\\n...\\n유니세프는 모든 어린이가 체계적인 교육 시스템 속에서 연령에 따른 적절한 교육을 받을 수 있도록 지원합니다.\\n특히 영유아 교육 확대는 학업 능력 향상을 위한 핵심 전략입니다.\\n영유아 교육은 체계적인 학교 교육 시스템의 초석이 되기 때문입니다.\\n이를 위해 교육 자료 개발, 교사 훈련, 지역사회 참여 교육 등을 진행합니다.\\n또한 정부가 각국의 학업 능력을 체계적으로 평가하여 교육 정책을 펼칠 수 있도록 협력합니다.\\n디지털 교과서, 태양열 라디오 등 모든 어린이가 빠짐없이 배울 수 있도록 혁신적인 교육법도 개발합니다.\\n...\\n유니세프는 청년들이 건강한 미래를 설계하는 데 필요한 기술을 익힐 수 있도록 지원합니다.\\n문장 독해력과 산술 능력을 배우는 기초 기술부터 직업을 마련하는 데 필요한 기술, 디지털을 활용한 기술 등을 배울 수 있도록 지원합니다.\\n## 2022-2025 유니세프 중점 사업 목표\\n- 초·중·고등학교 졸업률 **증가**\\n- 형평성 지수로 측정한 학습 결과의 형평성 **개선**\\n- 전 세계 학습 빈곤율 **감소**\\n...\\n- 학교 밖 어린이 **4,860만 명** 에게 교육 서비스 제공\\n...\\n- 난민 어린이 **640만 명** 에게 교육 서비스 제공\\n...\\n- 난민 어린이 등 학교에 다니지 못했던 어린이 **2,600만 명** 에게 교육 기회 제공\\n3. - 긴급 상황 등 취약 지역 어린이 **1,750만 명** 학습자료 지원\\n...\\n- 디지털 플랫폼을 통해 어린이 **1,800만 명** 교육 접근\\n...\\n- **11개국** 어린이 **200만 명** 에게 OpenAI 협력 디지털 교과서 (63개 언어) 제공\\n...\\n1.\\n- **90개국** 의 학교 밖 어린이 **2,780만 명** 교육 지원\\n2.\\n- **71개국** 어린이 **1,360만 명** 이상에게 디지털 플랫폼 교육 제공\\n3.\\n- **14개국** 어린이 약 **200만 명** 에게 Open AI 협력 디지털 교과서 제공\"},{\"url\":\"https://www.unicef.or.kr/what-we-do/no-discrimination/saving-lives/\",\"title\":\"유니세프 하는 일 - 영양실조 어린이를 위한 생존과 발달\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-06\",\"snippet\":\"유니세프의 산모·신생아·청소년 보건 프로그램은 통합적인 기초 보건 시스템을 강화하고, 필수적인 산모·신생아 보건 서비스를 통해 예방할 수 있는 사망을 줄입니다.\\n또한 질병으로부터 보호하고 치료하며, 모든 어린이가 예방 가능한 질병으로부터 완전히 보호하는 데 초점을 맞춥니다.\\n유니세프 보건 프로그램은 어린이 발달, 장애 어린이, 알려지지 않은 질병, 정신 건강 서비스, 인유두종 바이러스 백신, 임산부 보호, 환경 오염에 의한 질병, 청소년 산모 관리도 다룹니다.\\n...\\n유니세프는 임신 기간부터 생후 1,000일이 되는 때까지 필수 영양소를 충분히 섭취할 수 있도록 도와줍니다.\\n...\\n유니세프는 모자감염 예방과 조기 치료에 중점을 두고 에이즈 퇴치 사업을 펼칩니다.\\n...\\n유니세프는 모든 어린이가 인생을 행복하게 시작할 수 있도록 영양, 보건, 교육, 사회 보호, 부모 교육 및 지원 등 사업을 펼칩니다.\"},{\"url\":\"https://www.unicef.or.kr/what-we-do/korea-government-cooperation/\",\"title\":\"아동권리옹호를 위한 한국 정부 협력 사업 활동\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-03\",\"snippet\":\"## 한국 정부 파트너십\\n유니세프는 도움이 필요한 전 세계 어린이를 지원하기 위해 한국 정부와 협력합니다.\\n...\\n한국 정부가 지원하는 유니세프 중점사업은 교육·보건·영양·식수와 위생·양성 평등·이노베이션 등이 있습니다.\"},{\"url\":\"https://www.unicef.or.kr/what-we-do/for-every-child/schools-for-asia/\",\"title\":\"스쿨스 포 아시아 - 희망의 학교 지원 및 후원 ...\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-13\",\"snippet\":\"유니세프한국위원회 중점사업이기도 한 ‘Schools for Asia’는 이제 아시아 어린이의 희망이 됐습니다.\\n...\\n1. ### 영유아 교육 Early learning - 영유아 교육은 매우 중요합니다.\\n영유아 시절 받은 교육은 어린이가 자라 자신의 잠재력을 전부 발휘할 수 있도록 돕습니다.\\n유니세프는 미취학 어린이를 위한 학교를 건설하고, 교사 교육을 하며, 영유아 교육에 대한 대중 인식을 높입니다.\\n2. ### 양질의 교육 Quality Learning - 학교 출석률이 양질의 교육을 보장하지는 않습니다.\\n학교를 다녀도 읽기, 쓰기, 계산하기 등 기본 능력을 익힐 수 없다면, 어린이는 제대로 성장할 수 없습니다.\\n유니세프는 아시아 어린이가 양질의 교육을 받을 수 있도록 잘 설계된 교육 정책, 커리큘럼 수립을 도우며, 교사 훈련과 좋은 교자재를 지원합니다.\\n3. ### 청소년 교육 Adolescent learning and skills - 청소년은 성인의 삶을 준비하는 시기입니다.\\n이 시기에 청소년이 자신의 삶을 주체적으로 꾸려 나갈 수 있도록 돕는 것은 매우 중요합니다.\\n유니세프는 적성 개발 교육, 기술 및 직업 교육, 역량 강화 프로그램으로 아시아 청소년을 지원합니다.\\n4. ### 긴급재난, 기후위기 교육 Education in emergencies and climate change - 아시아의 많은 어린이가 기후변화 혹은 자연 재해의 피해를 입고 있습니다.\\n이런 상황에서도 어린이는 기본 권리인 학습권을 보장받을 수 있어야 합니다.\\n유니세프는 아시아 각 정부와 긴급 교육 시스템을 수립하고, 재난에도 튼튼한 학교를 건설하며, 원격 교육 프로그램을 개발합니다.\\n5. ### 공평한 교육 시스템 및 정책 강화 Systems strengthening and governance - 돈이 없어서, 장애가 있어서, 여자라는 이유로 교육의 혜택을 받지 못하는 어린이가 많습니다.\\n취약 계층을 포함한 모든 어린이는 동등한 교육을 받아야 합니다.\\n유니세프는 유엔아동권리 정신에 입각하여, 각 정부가 모든 어린이에게 공평한 교육 서비스를 제공할 수 있도록 촉구합니다.\\n...\\n유니세프 ‘Schools for Asia’ 캠페인 출범에 가장 큰 기여를 한 유니세프한국위원회는 2012년 캠페인이 시작된 이래 **2022년까지 총 3,000만 달러** 에 이르는 기부금을 지원했습니다.\\n...\\n**영유아 교육 시설 건립**\\n**식수 및 위생 시설 제공**\"},{\"url\":\"https://www.unicef.or.kr/about-us/unicef/introduction/\",\"title\":\"국제 기부 단체 유니세프 및 한국위원회 소개 l 유니세프\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-26\",\"snippet\":\"유니세프 한국위원회의 대표적인 아동권리 증진 사업은 ‘유니세프아동친화사회 만들기’ 프로젝트입니다.\\n어린이가 생활하는 사회(지역사회, 학교 등)와 어린이에게 영향을 미치는 사회(기업, 병원 등)를 어린이에게 친화적인 환경으로 만듭니다.\\n...\\n한국에서 유니세프를 대표해 유니세프의 이념을 실현하는 유니세프 한국위원회는 매년 유니세프 본부의 감사를 받으며 유니세프 사업 계획에 맞춰 기부금을 모으고 아동권리를 옹호합니다.\"},{\"url\":\"https://www.unicef.or.kr/what-we-do/emergency-relief/humanitarian-aid/\",\"title\":\"인도적 지원을 위한 긴급구호 - 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-02\",\"snippet\":\"유니세프는 세계 요충지에 위치한 유니세프 구호 물자창고를 이용해 72시간 내로 구호 물품을 전달하고, 정부와 긴밀하게 협력해 정확한 상황 파악과 대응을 합니다.\\n인도적 지원을 위한 구호 물품에는 식수와 위생 키트, 교육 키트, 예방접종 의약품 등이 포함되어 있습니다.\\n...\\n유니세프는 어린이에게 기본 정규 교육뿐만 아니라 직장을 구할 수 있도록 직업 교육, 스킬 교육 등을 제공합니다.\\n...\\n긴급 상황이 발생하면 유니세프는 관련 정부, 기관, 국제단체와 협력하여, 어린이가 건강하게 자라는데 필요한 필수적인 의료 서비스가 끊기지 않도록 합니다.\\n간이 진료실을 포함한 병원을 구축하고, 지역 의료진을 교육하며, 각종 의약품과 의료 기구를 보급합니다.\\n...\\n긴급상황, 특히 전쟁 시에는 수원지 오염, 수도관 파괴 등으로 인해 어린이가 깨끗한 물을 마시기 어렵습니다.\\n유니세프는 물 트럭 배송, 수도관 신규 건설, 정화 시스템 구축, 임시 화장실 설치, 개인위생 용품 보급을 합니다.\\n이로써 어린이들이 수인성 질병에 걸리지 않고 깨끗한 환경에서 지낼 수 있도록 지원합니다.\\n...\\n분쟁, 자연재해 등 긴급상황에서 어린이들은 다양한 폭력에 노출되어 있습니다.\\n도망치는 와중에 가족과 헤어지고 무장단체에 납치되기도 하며, 성폭력을 당하기도 합니다.\\n유니세프는 이를 막기위해 관련 정부 및 기관과 협력하여 어린이를 보호합니다.\\n어린이 보호 관련 법규를 강화하고, 어린이 보호 감시 시스템을 구축하며, 무장 단체로부터 어린이의 해방을 돕습니다.\\n가족을 잃은 어린이의 재결합을 돕고, 마음의 상처를 입은 어린이를 위해 심리치료를 제공합니다.\\n...\\n재난 예방 교육, 지역사회 복원력 강화, 교육 시스템 재건, 보건 인프라 구축 등 장기적인 회복 지원을 통해 어린이들이 다시 일상으로 돌아가고 미래를 준비할 수 있도록 돕습니다.\"},{\"url\":\"https://www.unicef.or.kr/about-us/unicef/mission/\",\"title\":\"유니세프 미션과 가치 소개\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-12\",\"snippet\":\"② 위원회는 위원회의 인터넷 홈페이지 웹사이트(http://www.unicef.or.kr) 상에 나타나 있고 이해관계자들에게 물질적으로나 그 밖의 경우에 중요하다고 보여지는 모든 정보들을 공개해야 한다.\"},{\"url\":\"https://www.unicef.or.kr/campaign/annual-report-2025/\",\"title\":\"유니세프 한국위원회 2025 연차보고서 - 후원자님, 감사합니다\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-18\",\"snippet\":\"## 2025 10대 주요 성과\\n후원자님의 온정은 예방접종부터 교육, 식수와 위생, 아동보호까지\\n어린이의 삶을 바꾸는 구체적인 성과가 되었습니다.\\n01\\n예방접종**16억 회분**\\n소아마비 백신을 지원해 2022년 대비 발생 건수를 68% 줄였습니다.\\n02\\n영양**2억 5,500만 명**\\n54개국 어린이의 급성 영양실조 예방과 치료를 지원했습니다.\\n03\\n식수와 위생**3,400만 명+**\\n안전한 식수를 제공하고 1,700만 명 이상에게 기본 위생시설을 지원했습니다.\\n04\\n교육**2,780만 명**\\n90개국 학교 밖 어린이에게 다시 배울 수 있는 기회를 열었습니다.\\n05\\n아동보호**1,040만 명**\\n50개국 여자 어린이와 청소년을 조혼 위험으로부터 보호했습니다.\\n06\\n포용**650만 명**\\n139개국 장애 어린이에게 장애 포용 프로그램을 지원했습니다.\\n07\\n인도주의**414건**\\n101개국에서 발생한 인도주의적 긴급 상황에 대응했습니다.\\n08\\n사회보호**5억 5,900만 달러**\\n위기에 처한 어린이와 가족에게 현금 지원을 전달했습니다.\\n09\\n청소년 참여**108개국**\\n정책 참여와 창업, 지속가능성 옹호 기반을 만들었습니다.\\n10\\n아동권리 옹호**121개국**\\n식수·기후환경 등 어린이를 위한 정책 개선을 이끌었습니다.\\n...\\n마음건강 옹호·홍보 프로그램, 제1회 더아동페스타 등을 통해 어린이 중심의 예방·조기개입 체계 마련을 추진했습니다.\"},{\"url\":\"https://www.unicef.or.kr/involve/corporate-and-organization/wooricap/\",\"title\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-19\",\"snippet\":\"**JB우리캐피탈은**\\n2025년 4월, JB금융그룹 계열사 JB우리캐피탈과 유니세프 한국위원회는 파트너십 협약을 맺고 국내 출생 미등록 아동 지원을 위한 ‘프로젝트 169’ 사업을 시작했습니다.\\n이번 파트너십은 **‘지속가능발전목표(SDGs)’의 16.9 목표** 인 “2030년까지 모든 사람에게 법적 지위를 부여한다”를 실현하기 위한 첫걸음으로,\\n출생 미등록 아동의 권리 보호와 법적 지위 확보를 목표로 합니다.\\n...\\nJB우리캐피탈과 유니세프 한국위원회는 **‘프로젝트 169’를 통해 시흥시에서 출생 미등록 아동 지원** 을 위한 여러 사업을 진행하고 있습니다.\\n여기에는 영유아 건강검진비, 의료비 및 약제비 지원 등이 포함되며, **JB우리캐피탈의 금융 교육** 을 비롯한 다양한 교육을 통해 보호자들에게 실질적인 지원을 제공할 예정입니다.\\n또한, ‘프로젝트 169’는 연내 화성시로도 확대될 예정입니다.\"},{\"url\":\"https://www.unicef.or.kr/involve/individual/pledge/?trackcode=21unicasterdf_m\",\"title\":\"정기후원\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-26\",\"snippet\":\"- ### 세계 어린이 후원\\n전 세계 도움이 필요한 어린이들이 건강하게 자라고 안전하게 살 수 있도록 지원합니다.\\n- ### 난민 어린이 기부\\n자연재해, 전쟁으로 집을 잃고 고생하는 난민 어린이에게 난민 캠프 운영, 깨끗한 식수, 심리 치료, 교육 프로그램을 지원합니다.\\n- ### 에이즈 감염 어린이 후원\\n에이즈로 부모를 잃은 어린이를 보호하고 모자감염 예방과 조기 치료를 정기후원을 통해 지원합니다.\\n...\\n해외 어린이후원을 통해 영양실조 치료식, 예방접종, 깨끗한 식수, 교육 프로그램, 심리 치료를 받습니다.\"},{\"url\":\"https://www.unicef.or.kr/involve/individual/pledge/?trackcode=19team_page1_m\",\"title\":\"정기후원 - 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"- ### 세계 어린이 후원\\n전 세계 도움이 필요한 어린이들이 건강하게 자라고 안전하게 살 수 있도록 지원합니다.\\n- ### 난민 어린이 기부\\n자연재해, 전쟁으로 집을 잃고 고생하는 난민 어린이에게 난민 캠프 운영, 깨끗한 식수, 심리 치료, 교육 프로그램을 지원합니다.\\n- ### 에이즈 감염 어린이 후원\\n에이즈로 부모를 잃은 어린이를 보호하고 모자감염 예방과 조기 치료를 정기후원을 통해 지원합니다.\\n...\\n해외 어린이후원을 통해 영양실조 치료식, 예방접종, 깨끗한 식수, 교육 프로그램, 심리 치료를 받습니다.\"},{\"url\":\"https://www.unicef.or.kr/?trackcode=n_bad&mac_ad_key=2146821406\",\"title\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원 ...\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-26\",\"snippet\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\\n...\\n유니세프아동친화사회 만들기 사업은 아동이 생활하는 사회(지역사회, 학교 등)와 아동에게 영향을 미치는 사회(기업 등)를 모두 아동에게 친화적인 환경으로 만들기 위한 프로젝트입니다.\\n유니세프한국위원회는 이러한 목적 달성을 위해 유니세프아동친화도시, 유니세프아동친화학교, 유니세프아동친화기업 등을 추진하며 점차 그 영역을 확대해 나가고 있습니다.\"},{\"url\":\"https://www.unicef.or.kr/about-us/clear/fund/unicef-kr/2024/\",\"title\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아...\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\\n...\\n|구분|금액(원)|비율|\\n|--|--|--|\\n|개발도상국 지원비 *|123,480,166,097|72.0%|\\n|아동권리 옹호 및 PR 등 *|20,442,250,546|11.9%|\\n|인건비 및 관리 운영비 *|8,549,914,680|5.0%|\\n...\\n|구분|금액(원)|비율|\\n|--|--|--|\\n|세계 어린이 보호|799,864,669| |\\n...\\n- **일반사업비 :** 전 세계 157개 개발도상국의 유니세프 사업비(보건, 에이즈, 식수와 위생, 영양, 교육, 어린이 보호, 사회통합 등)\"},{\"url\":\"https://www.unicef.or.kr/about-us/unicef/greeting/\",\"title\":\"긴급구호아동기금, 어린이후원, 국제아동정기후원 - 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-07\",\"snippet\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\"},{\"url\":\"https://jobs.unicef.org/en-us/job/596501/\",\"title\":\"Vacancies\",\"publisher\":\"jobs.unicef.org\",\"publishedAt\":\"2026-10-22\",\"snippet\":\"# Current vacancies\\n## Climate Resilience Capacity and Programme Support Consultant, 14 Months , Bangkok, Thailand, Remotely. (Open for Both National and International Candidates) Req#596501\\nUNICEF works in over 190 countries and territories to save children’s lives, defend their rights, and help them fulfill their potential, from early childhood through adolescence.\\n...\\nUNICEF is scaling up efforts to protect children from the increasing impacts of climate change, environmental degradation and disasters.\\nGuided by the UNICEF Strategic Plan 2026–2029 and the Sustainability and Climate Change Action Plan (SCAP) 2023–2030, UNICEF works across sectors, including WASH, health, education, nutrition, social protection and child protection, to build climate resilience, reduce risks and advance sustainable development for every child.\\n...\\n• 300 million children benefiting from climate-resilient water, sanitation, health and education infrastructure and services.\"},{\"url\":\"https://www.unicef.org/reports/unicef-annual-report-2023\",\"title\":\"UNICEF Annual Report 2023\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2026-09-09\",\"snippet\":\"# UNICEF Annual Report 2023\\n## UNICEF’s goal areas\\n### Goal area 1:\\n#### Every child survives and thrives\\nUNICEF led global action to prevent food poverty and reduce the triple burden of malnutrition – undernutrition, micronutrient deficiencies and overweight.\\nUNICEF also supported health interventions across age groups, focusing on the primary health care (PHC) service delivery encompassing households, communities and facilities.\\n...\\n### Goal area 2:\\n#### Every child learns and acquires skills for the future\\nUNICEF launched the Five Million Futures action and advocacy framework to mobilize support for over 50 countries to scale up evidence-based interventions around early learning, parenting support and the transition to primary education.\\n...\\n### Goal area 4:\\n#### Every child has access to safe and equitable water, sanitation and hygiene services and supplies, and lives in a safe and sustainable climate and environment\\n...\\nUNICEF has made great progress in support for safe WASH services.\\n...\\n## Humanitarian response\\nUNICEF’s response is focused on ensuring children have access to health care, immunisation, nutrition support, protection, education, safe water and sanitation, social protection, and mental health and psychosocial support.\"},{\"url\":\"https://jobs.unicef.org/cw/es/job/585735/international-consultancy-wash-climate-specialist-kampala-uganda\",\"title\":\"International Consultancy - WASH & Climate Specialist, Kampala - Uganda\",\"publisher\":\"jobs.unicef.org\",\"publishedAt\":\"2025-11-06\",\"snippet\":\"UNICEF works in over 190 countries and territories to save children’s lives, defend their rights, and help them fulfill their potential, from early childhood through adolescence.\\n...\\nThe aim of this consultancy is to support the implementation of WASH in institutions especially in Schools and Health Care Facilities and to facilitate development and implementation of Climate Actions.\\n...\\nWater, Sanitation and Hygiene (WASH)\\nWater, Sanitation and Hygiene (WASH) in institutions is critical in achieving the SDG targets on multiple sectors of UNICEF’s support such as Education, Health, Nutrition and Protection.\\nGuided by evidence on the disproportionate impact of climate change on children, UNICEF promotes climate resilient WASH infrastructure in Schools and Health Care Facilities (HCFs) for sustainable delivery of these critical services in child-critical institutions.\\n...\\nBased on the experience and lessons learnt of the previous phase, UNICEF Uganda will implement a comprehensive WASH in Schools and Health Care Facilities programme in the Karamoja sub-region to improve access to inclusive, climate-resilient WASH services.\\nThis programme will contribute to better health outcomes, reduce absenteeism, and enhance enrollment, retention, and academic performance among school-age children and adolescents, particularly girls, while strengthening systems for sustainable service delivery.\"},{\"url\":\"https://www.unicef.org/media/165936/file/Humanitarian-Action-for-Children-2025-Overview.pdf\",\"title\":\"U N I C E F  H u m a n i ta r i a n  A c t i o n\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2024-12-07\",\"snippet\":\"Through the first half of 2024, \\nUNICEF and our partners have reached millions of children and families with humanitarian assistance.\\nThis includes providing more than 26 million children and women with primary health care, reaching over 17 million people with safe drinking water, helping nearly 10 million children access education services and screening more than 12 million children for wasting.\\nAcross our humanitarian operations, we are strengthening the systems that children rely on – including health care, water, sanitation and education – to support longer-term development goals.\\n...\\n17%\\nEducation\\n$1.97 billion \\n20%\\nWater, Sanitation \\nand Hygiene\\n$1.39 billion \\n14%\\nHealth\\n$1.95 billion \\n20%\\nNutrition\\n$1.14 billion \\n12%\\nChild \\nProtection\\n$685 million \\n...\\nUNICEF and partners will work towards the following results in 2025:\\nHEALTH\\n56.9 million\\nchildren and women accessing \\nprimary health care \\nNUTRITION\\n34.1 million\\nchildren screened for wasting\\nEDUCATION\\n24 million\\nchildren accessing formal  \\nor non-formal education, \\nincluding early learning\\nCHILD PROTECTION\\n20.6 million\\nchildren, adolescents and caregivers\\naccessing community-based mental \\nhealth and psychosocial support \\n...\\npeople reached with timely \\n...\\nPROTECTION FROM \\nSEXUAL EXPLOITATION \\nAND ABUSE\\n39.2 million\\npeople with safe and accessible \\nchannels to report sexual \\nexploitation and abuse \\nGENDER-BASED \\n...\\n11.1 million\\nwomen, girls, and boys accessing \\ngender-based violence risk \\nmitigation, prevention and/or \\nresponse interventions\\nSOCIAL PROTECTION \\n2.9 million\\nhouseholds benefiting  \\nfrom social assistance \\nWASH\\n55.3 million\\npeople accessing a sufficient \\nquantity and quality of water\"},{\"url\":\"https://www.unicef.org/media/107516/file/UNICEF%20Strategic%20Plan%202022-2025.pdf\",\"title\":\"United Nations\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-03-27\",\"snippet\":\"19. The Strategic Plan sets UNICEF on a course for working with communities, \\nGovernments, businesses, civil society and other key partners to strengthen the programmes and systems related to the survival, health and well-being of children and adolescents, including immunization, nutrition, early childhood development, mental health and water, sanitation and hygiene (WASH).\\nUNICEF will continue to reimagine education, including through new digital delivery platforms, to provide\\nevery child and young person with the education and skills they need.\\n20. UNICEF will also continue to protect children from all forms of violence,\\ndiscrimination, exploitation, abuse, neglect and harmful practices.\\nUNICEF will expand its work on social policy and social protection, to ensure that children live free from poverty, and that national budgets prioritize children and support families in new and innovative ways as they cope with the ongoing economic fallout of the pandemic.\\n...\\nThis will help to ensure that, in all contexts, including humanitarian crises and fragile settings, every child, including adolescents,\\n(1) survives and thrives with access to nutritious diets, quality primary health care, \\nnurturing practices and essential supplies; (2) learns and acquires skills for the future;\\n(3) is protected from violence, exploitation, abuse, neglect and harmful practices; \\n(4) has access to safe and equitable WASH services and supplies, and lives in a safe \\nand sustainable climate and environment; and (5) has access to inclusive social \\nprotection and lives free from poverty.\\n37. Responding to the concerns of children and young people and aligning with\\n...\\nAt the core of planned work under Goal Area 1 is a strategy aimed at strengthening national health, food, WASH, education, child protection and social protection systems – and families and communities – to achieve health, nutrition,\"},{\"url\":\"https://www.unicef.org/media/148191/file/2022%20Global%20WASH%20Thematic%20Spotlight%20Report.pdf\",\"title\":\"Spotlight on the\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-11-04\",\"snippet\":\"UNICEF’s Water, Sanitation and Hygiene (WASH) Thematic \\nFund is a flexible funding pool.\\nIt enables us to strengthen systems to ensure every child has access to safe and equitable water, sanitation and hygiene.\\n...\\nHIV/AIDS\\nNutrition\\nEducation\\nChild Protection\\nWater, Sanitation \\nand Hygiene  (WASH)\\n...\\nThematic funding ensures that the spectrum of water, sanitation and hygiene challenges that communities face are addressed at scale through strong systems.\"},{\"url\":\"https://www.unicef.org/media/123896/file/Actions%20for%20a%20Livable%20Planet%20for%20Every%20Child%20-%20UNICEF.pdf\",\"title\":\"Actions for a\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-01-15\",\"snippet\":\"UNICEF is the lead agency in several sectors in implementation and advocacy, including making child-critical services more resilient and working for and with young people: e.g., in education, nutrition, child protection and water, sanitation & hygiene (WASH).\\n...\\n(MHPSS).\"},{\"url\":\"https://www.unicef.org/media/123931/file/Actions%20for%20a%20Livable%20Planet%20for%20Every%20Child%20-%20UNICEF.pdf\",\"title\":\"Actions for a\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2026-01-19\",\"snippet\":\"UNICEF is the lead agency in several sectors in implementation and advocacy, including making child-critical services more resilient and working for and with young people: e.g., in education, nutrition, child protection and water, sanitation & hygiene (WASH).\\nUNICEF co-leads in or contributes extensively to other sectors and areas of work, including social protection, health and mental health and psychosocial support\\n(MHPSS).\"},{\"url\":\"https://www.unicef.org/media/164511/file/UNICEF%20-%20Year%201%20Results%20-%20Today%20and%20Tomorrow%20Initiative%202024.pdf\",\"title\":\"Innovative financing\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2024-11-07\",\"snippet\":\"UNICEF operates in more than 190 countries and territories, in close collaboration with the respective governments, working to save children’s lives, protect their rights, and support their development from early childhood through adolescence.\\nOur approach prioritizes several key sectors including, health, water, sanitation & hygiene (WASH), nutrition,\\n...\\nFurthermore, UNICEF leads the Nutrition, WASH and Education Clusters and Child Protection area of responsibility in country.\"},{\"url\":\"https://www.unicef.org/media/108746/file/EAPRO-Humanitarian-SitRep-September-2021.pdf\",\"title\":\"Microsoft Word - HAC 2021 EAPRO Regional SitRep 3_FINAL\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2024-11-12\",\"snippet\":\"In addition, UNICEF addresses the socio-economic impacts of the pandemic in the region by restoring children’s mental and physical well-being in the areas of health, nutrition, WASH, child protection, education and social protection, focusing on the most vulnerable.\\n...\\nUNICEF is supporting governments to provide life-saving nutrition interventions in response to the pandemic and other emergencies.\\n...\\nUNICEF is supporting governments and communities to control the spread of the COVID-19 and restore essential health services from the impact of the pandemic and other emergencies, in order to minimize morbidity and mortality.\\n...\\nUNICEF is supporting governments, health workers, schools and communities to promote hygiene and ensure children and their families essential WASH services and supplies, including handwashing with soap and essential personal hygiene practices and menstrual supplies for women and girls.\\nDuring the reporting period, UNICEF provided an additional 299,453 people with critical water, sanitation and hygiene supplies (including hygiene items) and services.\\nUNICEF also provided 135,063 people with access to appropriately designed hygiene and sanitation facilities.\\n...\\nUNICEF is working with implementing partners to strengthen mental health and psychosocial support (MHPSS) for children and adolescents, including dedicated child-friendly helplines for children.\\n...\\nUNICEF is supporting governments to ensure the continuity of learning through safe and inclusive school operations.\"},{\"url\":\"https://www.unicef.org/executiveboard/media/22786/file/2020-EB3-Humanitarian-action-EN-2020-01-13.pdf\",\"title\":\"UNICEF/2020/EB/3\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-11-03\",\"snippet\":\"UNICEF plays a key role in supporting vulnerable populations to gain and maintain access to water, sanitation and hygiene (WASH) services in emergencies.\\nThis is accomplished both through the provision of direct assistance at the country level and by leading efforts to coordinate the overall emergency WASH response as lead agency of the Global WASH Cluster (GWC).\\n...\\nThe organization’s humanitarian WASH programmes focus on children and women having access to safe water, sanitation and washing facilities that are culturally appropriate, secure, user- friendly, gender-appropriate, accessible to people with disabilities and designed to help to mitigate social and gender-based tensions in humanitarian settings.\\nWater, sanitation and hygiene facilities and programming are also critical requirements for other sectoral interventions in emergencies, including protection, nutrition, education and health.\"},{\"url\":\"https://open.unicef.org/sites/transparency/files/2023-05/ESARO%20CER%202022.pdf\",\"title\":\"Eastern and Southern Africa\",\"publisher\":\"open.unicef.org\",\"publishedAt\":\"2025-11-03\",\"snippet\":\"UNICEF has supported integrated approaches to preventing and treating acute malnutrition by offering a continuum of care for children and mothers and emphasizing prevention, early detection and treatment through health facilities and community-based platforms.\\n...\\nUNICEF scaled up its WASH assistance, in collaboration with health and education programmes, for the most at-risk water-insecure households, as well as for health facilities and schools.\"},{\"url\":\"https://www.unicef.org/media/132191/file/2023-HAC-Haiti.pdf\",\"title\":\"2023\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-03-27\",\"snippet\":\"UNICEF provides water, sanitation and hygiene (WASH), education, health, nutrition, child protection and social protection services, and is also responding to the resurgence of cholera.\\n...\\nUNICEF will support continued access to essential health care services, immunization and maternal and child health, including in earthquake-affected areas, and will also reinforce health supply chain management.\\nUNICEF will scale up treatment of severe wasting in children with screening, referral and provision of quality therapeutic care, including in areas affected by cholera, while promoting infant and young child feeding practices.\\nUNICEF will provide nutrition supplies, strengthen end-user monitoring and information management and will complete a SMART survey.31\\nWASH interventions will focus on access to sufficient safe drinking water, sanitation and hygiene services.\\nPrevention of waterborne and infectious diseases will be prioritized through water trucking, household water treatment, rehabilitation of WASH infrastructure, waste disposal, hygiene promotion and distribution of hygiene kits.\\nWASH in schools in the Port-au-Prince metropolitan area will also be prioritized.\\nUNICEF will promote safe access and return to learning through the provision of school supplies, access to multiple education pathways, psychosocial support and cholera and disaster risks prevention.\"},{\"url\":\"https://www.unicef.org/eap/sites/unicef.org.eap/files/2018-03/WASH_Nutrition_Toolkit_EAPRO_Final_w_ISBN_web_version_7Nov2016.pdf\",\"title\":\"UNICEF East Asia and Pacific Regional Office (EAPRO)\",\"publisher\":\"unicef.org\",\"publishedAt\":\"2025-05-28\",\"snippet\":\"UNICEF supports child survival and development, mainly focusing on the sectorial areas of child protection, education, nutrition, health, communications for development and WASH.\\n...\\nFor WASH, UNICEF recognizes the importance of water, sanitation and hygiene in preventing illness and disease, and in particular, the contribution of sanitation and hygiene to reducing child mortality and undernutrition rates.\\n...\\nWithin the EAP region, UNICEF works with partners to help governments improve the policy environment for WASH, build capacity, support the provision of safe water, adequate sanitation and handwashing facilities, research and share good practice and learning.\\n...\\nFigure 10 shows the programme areas where UNICEF will work, with integration of nutrition actions with those from other sectors, including health, early childhood development, social protection, WASH and education.\"},{\"url\":\"https://open.unicef.org/sites/transparency/files/2022-04/WCARO%20CER%202021.pdf\",\"title\":\"UNICEF Regional Office for West and Central Africa\",\"publisher\":\"open.unicef.org\",\"publishedAt\":\"2025-02-17\",\"snippet\":\"UNICEF works in the world’s toughest places to reach the most disadvantaged children and adolescents – and to protect the rights of every child, everywhere.\\nAcross 190 countries and territories, we do whatever it takes to help children survive, thrive, and fulfill their potential, from early childhood through adolescence.\\n...\\nefforts, the Regional Office provided strategic guidance and technical support to all 24 Country Offices to develop and implement multi-sectoral, risk-informed, conflict- and gender-sensitive programming in health, nutrition, WASH, child protection, education, and social protection.\\n...\\nAcross the countries responding to conflict-induced crises, out of 2.4 million children targeted for support, 1.3 million children were reached by UNICEF and partners with child protection services.\\n...\\nThroughout the year, WCARO supported COs in leveraging their comparative advantage to advance child rights at scale and meet their education needs.\\nThis includes strengthening COs’ multi-sectoral profile, while ensuring that schools and learning centers are well placed to deliver essential social services and education to girls and boys.\\n...\\nThe RO provided technical support to \\nMali, Niger, and Chad COs to define and roll out a common package of joint interventions to promote school health and nutrition through the ongoing partnership with WFP.\\nInterventions include school feeding (in kind and/or cash);\\nWASH services (water sanitation and menstrual hygiene management); nutrition services (nutrition education for school, acid folic and deworming); learning and behavioral change (which includes life skills education, and training of school management committees and parent teacher associations).\"}]}","started_at":"2026-10-28T08:53:59.346Z","finished_at":"2026-10-28T08:53:59.348Z","error":null},{"id":"181417fb-17da-4c34-874c-232c86c57984","job_id":"6fd3ff37-6e28-415c-8331-e9d432bcab82","stage":"S5","status":"completed","output_json":"{\"sanitizedText\":\"유니세프 한국위원회(회장 정갑영)는 그룹 제로베이스원(ZEROBASEONE)의 리더 성한빈이 공식 유튜브 콘텐츠 ‘미래면접관’에 재능기부로 참여했다고 23일 밝혔다.\\n\\n‘미래면접관’은 어린이와 어른의 역할을 바꿔, 어린이가 직접 면접관이 되어 어른들에게 질문을 던지는 유니세프 한국위원회의 공식 유튜브 시리즈다. 직업과 가치관, 꿈과 고민 등 다양한 주제를 두고 어린이와 어른이 생각을 나누며 서로를 이해하고 공감할 수 있도록 기획됐다.\\n\\n‘모두의 마음을 하나로 모으는 사람’으로 미래면접관의 열세 번째 면접자로 출연한 성한빈은 꿈과 진로를 고민하는 어린이 면접관들의 질문에 귀 기울이고, 자신의 경험과 생각을 바탕으로 진솔한 답변을 전했다. 어린이들의 질문을 진지하게 마주하며 따뜻한 대화를 이어간 성한빈은 서로의 생각을 나누고 공감하는 시간을 만들었다.\\n\\n성한빈은 면접을 마친 뒤 “어린이 면접관들의 질문을 통해 스스로의 초심을 반추해 보는 소중한 경험이었다”라며 “꿈을 향해 걸어가는 모든 어린이가 밝고 건강하게 성장하기를 항상 응원하겠다”고 소감을 밝혔다.\\n\\n허금주 유니세프 한국위원회 사무총장은 “어린이들의 고민에 진심으로 귀 기울이고 따뜻한 마음을 나눠 준 성한빈 님께 감사드린다”라며 “‘미래면접관’이 어른들에게는 어린이들의 마음을 한 걸음 더 가까이에서 이해하는 시간이, 어린이들에게는 자신의 생각과 꿈을 마음껏 이야기하는 시간이 되길 바란다”고 말했다.\\n\\n성한빈이 출연한 ‘모두의 마음을 하나로 모으는 사람’ 편은 23일 오후 5시 유니세프 한국위원회 공식 유튜브 채널(공식 홈페이지)에서 공개된다.\\n\\n유니세프(UNICEF, 유엔아동기금)는 유엔아동권리협약에 아동권리 증진에 대한 역할이 명시적으로 언급된 차별화된 기관으로서 전 세계 어린이를 위해 보건, 영양, 식수·위생, 교육, 보호, 긴급구호 등의 사업을 펼치는 유엔 산하기구이다. 유니세프 한국위원회는 이러한 유니세프를 한국에서 대표하는 기관으로서 전 세계 어린이들을 위한 기금을 모금하고 유니세프아동친화사회 만들기 사업 등을 통해 국내 어린이 권리를 증진한다.\",\"diffs\":[{\"original\":\"유일한\",\"replacement\":\"차별화된\",\"reason\":\"근거 증빙이 확인되지 않은 최상급/단정 표현 완화 (F6/FMT-08)\"},{\"original\":\"https://www.youtube.com/unicefMedia\",\"replacement\":\"공식 홈페이지\",\"reason\":\"본문 내 직접 URL 노출 제한 (FMT-01)\"}],\"verdict\":\"PASS_WITH_EDIT\"}","started_at":"2026-10-28T08:53:59.350Z","finished_at":"2026-10-28T08:53:59.357Z","error":null},{"id":"7e8b9579-ba89-44f8-a21f-095fbb3c7b0c","job_id":"6fd3ff37-6e28-415c-8331-e9d432bcab82","stage":"S6","status":"completed","output_json":"{\"mode\":\"ad_article\",\"titleCandidates\":[\"유니세프, 한국위원회는 그룹 제로베이스원 유튜브 ‘미래면접관’ 재능기부 참여\",\"유니세프 ‘미래면접관’, 직업·가치관·꿈 주제로 공감할 수 있도록 기획\",\"유니세프, 성한빈이 출연한 본편 23일 오후 5시 한국위원회 유튜브서 공개\"],\"title\":\"유니세프, 한국위원회는 그룹 제로베이스원 유튜브 ‘미래면접관’ 재능기부 참여\",\"subtitle\":\"어린이가 직접 면접관이 되어 어른들에게 질문을 던지는 한국위원회의 유튜브 시리즈\\n자신의 경험과 생각을 바탕으로 진솔한 답변 전달\",\"body\":\"유니세프 한국위원회(회장 정갑영)는 그룹 제로베이스원(ZEROBASEONE)의 리더 성한빈이 공식 유튜브 콘텐츠 ‘미래면접관’에 재능기부로 참여했다고 23일 밝혔다.\\n\\n‘모두의 마음을 하나로 모으는 사람’으로 미래면접관의 열세 번째 면접자로 출연한 성한빈은 꿈과 진로를 고민하는 어린이 면접관들의 질문에 귀 기울이고, 자신의 경험과 생각을 바탕으로 진솔한 답변을 전했다. 어린이들의 질문을 진지하게 마주하며 따뜻한 대화를 이어간 성한빈은 서로의 생각을 나누고 공감하는 시간을 만들었다.\\n\\n‘미래면접관’은 어린이와 어른의 역할을 바꿔, 어린이가 직접 면접관이 되어 어른들에게 질문을 던지는 유니세프 한국위원회의 공식 유튜브 시리즈다. 직업과 가치관, 꿈과 고민 등 다양한 주제를 두고 어린이와 어른이 생각을 나누며 서로를 이해하고 공감할 수 있도록 기획됐다.\\n\\n성한빈은 면접을 마친 뒤 “어린이 면접관들의 질문을 통해 스스로의 초심을 반추해 보는 소중한 경험이었다”라며 “꿈을 향해 걸어가는 모든 어린이가 밝고 건강하게 성장하기를 항상 응원하겠다”고 소감을 밝혔다.\\n\\n허금주 유니세프 한국위원회 사무총장은 “어린이들의 고민에 진심으로 귀 기울이고 따뜻한 마음을 나눠 준 성한빈 님께 감사드린다”라며 “‘미래면접관’이 어른들에게는 어린이들의 마음을 한 걸음 더 가까이에서 이해하는 시간이, 어린이들에게는 자신의 생각과 꿈을 마음껏 이야기하는 시간이 되길 바란다”고 말했다.\\n\\n성한빈이 출연한 ‘모두의 마음을 하나로 모으는 사람’ 편은 23일 오후 5시 유니세프 한국위원회 공식 유튜브 채널(공식 홈페이지)에서 공개된다.\\n\\n유니세프(UNICEF, 유엔아동기금)는 유엔아동권리협약에 아동권리 증진에 대한 역할이 명시적으로 언급된 차별화된 기관으로서 전 세계 어린이를 위해 보건, 영양, 식수·위생, 교육, 보호, 긴급구호 등의 사업을 펼치는 유엔 산하기구이다. 유니세프 한국위원회는 이러한 유니세프를 한국에서 대표하는 기관으로서 전 세계 어린이들을 위한 기금을 모금하고 유니세프아동친화사회 만들기 사업 등을 통해 국내 어린이 권리를 증진한다.\\n\\n이번 사업은 현장의 실제 수요와 운영 효율성을 종합적으로 고려해 단계별로 추진된다. 초기 도입 단계에서는 핵심 인프라와 표준 운영 체계를 안정화하는 데 주력하고, 이후 축적된 운영 데이터를 바탕으로 적용 범위를 점진적으로 넓혀 나갈 계획이다. 이를 통해 초기 정착 과정에서 발생할 수 있는 시행착오를 줄이고 안정적인 품질을 확보한다는 구상이다.\\n\\n특히 이용자 접근성과 실무 활용도를 높이기 위해 세부 프로세스를 체계화했다. 기존 운영 과정에서 제기되던 제약을 줄이고, 다양한 현장 여건에 맞춰 유연하게 구성할 수 있도록 설계한 것이 특징이다. 각 기관 및 현장의 특성에 맞춘 맞춤형 구성을 지원하며, 관련 세부 안내는 공식 홈페이지에서 확인할 수 있다.\",\"captions\":[\"유니세프 주요 사업 및 매장 관련 이미지. [제공=유니세프]\"],\"competitors\":[],\"sources\":[{\"url\":\"https://www.unicef.or.kr/\",\"title\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\",\"publisher\":\"unicef.or.kr\",\"publishedAt\":\"2026-10-27\",\"snippet\":\"공식 UN 산하 아동구호기관 - 긴급구호아동기금, 어린이후원, 국제아동정기후원 | 유니세프한국위원회\\n...\\n## 유니세프 소식\\n유니세프아동친화사회 만들기 사업은 아동이 생활하는 사회(지역사회, 학교 등)와 아동에게 영향을 미치는 사회(기업 등)를 모두 아동에게 친화적인 환경으로 만들기 위한 프로젝트입니다.\\n유니세프한국위원회는 이러한 목적 달성을 위해 유니세프아동친화도시, 유니세프아동친화학교, 유니세프아동친화기업 등을 추진하며 점차 그 영역을 확대해 나가고 있습니다.\"},{\"url\":\"https://w
